<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Authoritative Answer Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 32px}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}h1{font-size:28px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.src{font-size:12px;color:#86aac3;margin-top:6px}.actions{margin-top:12px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#edf6ff;color:#07111f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:12px;margin:10px 0}.row.pass{border-color:#2c6a4b}.row.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.q{font-size:16px;font-weight:800;margin:6px 0}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55}.answer{margin-top:8px;line-height:1.65}.top{display:flex;gap:8px;align-items:center}.verdict{margin-left:auto;font-weight:900}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><h1>MAGI Authoritative Answer Test</h1><div class="sub">Google Driveの正式成績PDFから取得した<strong>実データのスナップショット</strong>をEvidenceとして使い、回答内容が正しい数値を返すかを検証します。これはライブ取得試験ではなく、まず「正しい根拠を渡した時に正しく答える」試験です。</div>
<section class="card"><b>使用ソース</b><div class="muted">・丸岡中軟式野球部_通算成績一覧2026-2027.pdf（R8.8.2〜R8.8.11）<br>・丸岡中軟式野球部_通算成績一覧2025-2026.pdf</div><div class="actions"><button id="run">8ケース開始</button></div></section>
<section class="card"><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b id="pass" class="ok">0</b></div><div class="stat"><span>FAIL</span><b id="fail" class="bad">0</b></div><div class="stat"><span>API ERROR</span><b id="api">0</b></div></div><div class="muted" style="margin-top:10px">Answer Engine: <span id="ver">未取得</span></div></section><section class="card" id="list"></section></div>
<script>
const CASES=[
{id:'A01',q:'新チームの陽翔のOPS教えて',route:'BATTING_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2026-2027.pdf',scope:'R8.8.2-R8.8.11',player:'大久保 陽翔',batting:{OPS:'.912'}},must:['.912'],mustNot:['.812','.969']},
{id:'A02',q:'旧チームの陽翔のOPS教えて',route:'BATTING_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2025-2026.pdf',scope:'2025-2026',player:'大久保 陽翔',batting:{OPS:'.969'}},must:['.969'],mustNot:['.912','.745']},
{id:'A03',q:'新チームの大野竜暉の打率教えて',route:'BATTING_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2026-2027.pdf',scope:'R8.8.2-R8.8.11',player:'大野 竜暉',batting:{AVG:'.278'}},must:['.278'],mustNot:['.302','.293']},
{id:'A04',q:'新チームの大野竜暉のOPS教えて',route:'BATTING_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2026-2027.pdf',scope:'R8.8.2-R8.8.11',player:'大野 竜暉',batting:{OPS:'.924'}},must:['.924'],mustNot:['.801','1.012']},
{id:'A05',q:'旧チームの大野竜暉の防御率と奪三振教えて',route:'PITCHING_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2025-2026.pdf',scope:'2025-2026',player:'大野 竜暉',pitching:{ERA:'1.69',innings:'54.0',strikeouts:'50'}},must:['1.69','50'],mustNot:[]},
{id:'A06',q:'新チームは何勝何敗？',route:'TEAM_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2026-2027.pdf',scope:'R8.8.2-R8.8.11',teamRecord:{games:6,wins:3,losses:2,draws:1}},must:['3勝','2敗'],mustNot:['8勝','20勝']},
{id:'A07',q:'新チームのチームOPS教えて',route:'TEAM_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2026-2027.pdf',scope:'R8.8.2-R8.8.11',teamBatting:{OPS:'.738'}},must:['.738'],mustNot:['.672']},
{id:'A08',q:'中嶋玲月の打率とOPS教えて',route:'BATTING_LOOKUP',e:{source:'丸岡中軟式野球部_通算成績一覧2026-2027.pdf',scope:'R8.8.2-R8.8.11',player:'中嶋 玲月',batting:{AVG:'.588',OPS:'1.376'}},must:['.588','1.376'],mustNot:[]}
];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function judge(c,d){const errs=[];const a=String(d.answer||'');for(const x of c.must||[])if(!a.includes(x))errs.push(`回答に「${x}」がない`);for(const x of c.mustNot||[])if(a.includes(x))errs.push(`誤った値「${x}」が回答に混入`);return errs}
async function call(c){const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ANSWER_FIXTURE',question:c.q,route:c.route,evidence:c.e})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
$('run').onclick=async()=>{$('run').disabled=true;$('list').innerHTML='';let p=0,f=0,a=0;for(const c of CASES){const row=document.createElement('div');row.className='row';$('list').appendChild(row);try{const d=await call(c);$('ver').textContent=d.answerEngineVersion||'?';const errs=judge(c,d),ok=!errs.length;if(ok)p++;else f++;row.className='row '+(ok?'pass':'fail');row.innerHTML=`<div class="top"><b>${c.id}</b><span class="verdict ${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</span></div><div class="q">${esc(c.q)}</div><div class="src">${esc(c.e.source)} / ${esc(c.e.scope)}</div><div class="mono">route=${esc(c.route)} / confidence=${esc(d.confidence)}</div><div class="answer">${esc(d.answer)}</div>${errs.length?`<div class="bad" style="margin-top:8px">${errs.map(esc).join('<br>')}</div>`:''}`;}catch(e){a++;row.className='row fail';row.innerHTML=`<div class="bad">${c.id} API ERROR: ${esc(e.message||e)}</div>`}$('done').textContent=p+f+a;$('pass').textContent=p;$('fail').textContent=f;$('api').textContent=a;await sleep(2200)}$('run').disabled=false;};
</script></body></html>
