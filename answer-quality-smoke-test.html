<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>MAGI Synthetic Answer Control Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}h1{font-size:28px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.warn{color:#ffd38a;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#edf6ff;color:#07111f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:12px;margin:10px 0}.row.pass{border-color:#2c6a4b}.row.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.q{font-size:16px;font-weight:800;margin:6px 0}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55}.answer{margin-top:8px;line-height:1.65}.top{display:flex;gap:8px;align-items:center}.verdict{margin-left:auto;font-weight:900}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<h1>MAGI Synthetic Answer Control Test</h1>
<div class="sub"><span class="warn">注意：このページの数値は実データではなく、回答ロジック確認用の人工Fixtureです。</span><br>ここでのPASSは「与えたEvidenceを正しく使う／無い数値を作らない／矛盾を隠さない」ことだけを意味し、選手成績そのものの正しさは証明しません。</div>
<section class="card"><b>目的</b><div class="muted">回答生成層の機械的安全性だけを確認します。実データ精度の試験は別ページで行います。</div><div class="actions"><button id="run">8ケース開始</button></div></section>
<section class="card"><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b class="ok" id="pass">0</b></div><div class="stat"><span>FAIL</span><b class="bad" id="fail">0</b></div><div class="stat"><span>API ERROR</span><b id="api">0</b></div></div><div class="muted" style="margin-top:10px">Answer Engine: <span id="ver">未取得</span></div></section>
<section class="card" id="list"></section>
</div>
<script>
const CASES=[
 {id:'Q01',q:'陽翔のOPS教えて',route:'BATTING_LOOKUP',e:{player:'大久保 陽翔',scope:'今季',batting:{OPS:'.812'}},must:['.812'],mustNot:[]},
 {id:'Q02',q:'陽翔の通算OPS教えて',route:'BATTING_LOOKUP',e:{player:'大久保 陽翔',scope:'通算',batting:{OPS:'.745'}},must:['.745'],mustNot:['.812']},
 {id:'Q03',q:'大野竜暉の防御率教えて',route:'PITCHING_LOOKUP',e:{player:'大野 竜暉',scope:'通算',pitching:{ERA:'1.69'}},must:['1.69'],mustNot:[]},
 {id:'Q04',q:'大野竜暉の打撃と投手の両方まとめて',route:'PLAYER_OVERVIEW',e:{player:'大野 竜暉',batting:{AVG:'.302',OPS:'.801'},pitching:{ERA:'1.69',strikeouts:'50'}},must:['.302','1.69','50'],mustNot:[]},
 {id:'Q05',q:'武田晴琉翔のOPS教えて',route:'BATTING_LOOKUP',e:{player:'武田 晴琉翔',batting:{AVG:'.250'}},must:[],mustNot:[],expectRefuse:true},
 {id:'Q06',q:'橋向の防御率教えて',route:'PITCHING_LOOKUP',e:{player:'橋向 結都',sources:[{name:'集計A',ERA:'2.10'},{name:'集計B',ERA:'2.45'}]},must:['2.10','2.45'],mustNot:[],expectConflict:true},
 {id:'Q07',q:'今季何勝何敗？',route:'TEAM_LOOKUP',e:{scope:'今季',teamRecord:{wins:8,losses:3,draws:1}},must:['8勝','3敗'],mustNot:[]},
 {id:'Q08',q:'8月号TEAM REPORT見せて',route:'DOCUMENT_SEARCH',e:{documents:[{title:'TEAM REPORT 8月号',status:'FOUND'}]},must:['TEAM REPORT 8月号'],mustNot:[]}
];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function judge(c,d){const errs=[];const a=String(d.answer||'');for(const x of c.must||[])if(!a.includes(x))errs.push(`回答に「${x}」がない`);for(const x of c.mustNot||[])if(a.includes(x))errs.push(`回答に禁止値「${x}」がある`);if(c.expectRefuse&&!(d.refusedToInvent===true&&(d.missingInformation||[]).length))errs.push('不足データを作らずに拒否できていない');if(c.expectConflict&&!(String(d.confidence).toUpperCase()==='LOW'&&(d.contradictions||[]).length))errs.push('矛盾をLOW confidenceで明示できていない');return errs}
async function call(c){const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ANSWER_FIXTURE',question:c.q,route:c.route,evidence:c.e})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
$('run').onclick=async()=>{ $('run').disabled=true;$('list').innerHTML='';let p=0,f=0,a=0;for(const c of CASES){let row=document.createElement('div');row.className='row';$('list').appendChild(row);try{const d=await call(c);$('ver').textContent=d.answerEngineVersion||'?';const errs=judge(c,d);const ok=!errs.length;if(ok)p++;else f++;row.className='row '+(ok?'pass':'fail');row.innerHTML=`<div class="top"><b>${c.id}</b><span class="verdict ${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</span></div><div class="q">${esc(c.q)}</div><div class="mono">route=${esc(c.route)} / confidence=${esc(d.confidence)} / refusedToInvent=${esc(d.refusedToInvent)}</div><div class="answer">${esc(d.answer)}</div>${errs.length?`<div class="bad" style="margin-top:8px">${errs.map(esc).join('<br>')}</div>`:''}`;}catch(e){a++;row.className='row fail';row.innerHTML=`<div class="bad">${c.id} API ERROR: ${esc(e.message||e)}</div>`}$('done').textContent=p+f+a;$('pass').textContent=p;$('fail').textContent=f;$('api').textContent=a;await sleep(2200)}$('run').disabled=false;};
</script></body></html>
