<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI XLSM / CSV Consistency Test v2</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 36px}h1{font-size:30px;line-height:1.2;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.ok{color:#8ce0b4}.bad{color:#ff9898}.warn{color:#ffd792}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:13px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.partial{border-color:#806a31}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55;overflow-wrap:anywhere}.big{font-size:24px;font-weight:900}</style></head><body><div class="wrap"><h1>MAGI XLSM / CSV Consistency Test v2</h1><div class="sub"><strong>XLSM正本が最優先</strong>。CSVは詳細分析用です。打撃は共通カウントを厳格照合。守備も守備機会・補殺・刺殺・失策・併殺・三重殺・捕手回数・捕逸・許盗塁・盗塁企図・盗塁阻止・牽制刺・捕妨害をXLSM「守備一覧」と照合します。</div><section class="card"><div><b>判定ルール</b></div><div class="muted">CSVとXLSMが一致した選手だけ、CSVの試合別・条件別分析を許可します。不一致またはCSV未収録の選手は<strong>XLSM集計値のみ</strong>使用します。守備率・盗塁阻止率などの率はカウントから再計算します。</div><div class="actions"><button onclick="run('current')">現チーム確認</button><button onclick="run('old')">旧チーム確認</button></div></section><section class="card" id="summary"><div class="muted">未実行</div></section><section class="card" id="details"></section></div><script>
const summary=document.getElementById('summary'),details=document.getElementById('details');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function stateText(s){return s==='FULL'?'FULL OPEN':s==='PARTIAL'?'PARTIAL OPEN':'BLOCKED'}
function stateClass(s){return s==='FULL'?'ok':s==='PARTIAL'?'warn':'bad'}
async function run(season){summary.innerHTML='<div class="muted">DriveのXLSM正本とCSVを照合中…</div>';details.innerHTML='';let d;try{const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'DETAIL_CSV_AUDIT',season})});d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`)}catch(e){summary.innerHTML=`<div class="big bad">API ERROR</div><div>${esc(e.message||e)}</div>`;return}
const b=d.batting||{},f=d.fielding||{},st=d.overallState||'BLOCKED';summary.innerHTML=`<div class="big ${stateClass(st)}">${esc(d.seasonLabel)} — ${stateText(st)}</div><div class="muted">XLSM正本: ${esc(d.authoritativeSource?.name||'')}<br>Policy: ${esc(d.policyVersion)}<br>結論: ${esc(d.rule)}</div>`;
let html=`<div class="row ${b.gateOpen?'pass':'fail'}"><b>打撃 XLSM ↔ CSV</b> — <span class="${b.gateOpen?'ok':'bad'}">${b.gateOpen?'PASS':'BLOCK'}</span><div class="muted">CSV: ${esc(b.source?.name||'')} / ${b.rows||0}行 / ${b.playerCount||0}選手 / ${esc(b.minDate)}〜${esc(b.maxDate)}<br>重複=${b.duplicateRows||0} / 欠落=${esc((b.missingColumns||[]).join(', ')||'なし')} / 照合NG=${b.blockedPlayerCount||0}</div></div>`;
const fcls=f.teamWideAnalysisAllowed?'pass':((f.allowedPlayerCount||0)>0?'partial':'fail');
html+=`<div class="row ${fcls}"><b>守備 XLSM ↔ CSV 数値照合</b> — <span class="${f.teamWideAnalysisAllowed?'ok':((f.allowedPlayerCount||0)>0?'warn':'bad')}">${f.teamWideAnalysisAllowed?'TEAM PASS':((f.allowedPlayerCount||0)>0?'PARTIAL':'BLOCK')}</span><div class="muted">CSV: ${esc(f.source?.name||'')} / ${f.rows||0}行 / CSV ${f.playerCount||0}選手 / XLSM ${f.masterPlayerCount||0}選手<br>一致して詳細分析可=${f.allowedPlayerCount||0} / CSV未収録=${f.unavailablePlayerCount||0} / CSV数値不一致=${f.blockedPlayerCount||0}<br>構造監査=${f.structuralGateOpen?'PASS':'BLOCK'} / 重複=${f.duplicateRows||0} / 期間=${f.startDateValid?'OK':'NG'}<br><span class="warn">${esc(f.note||'')}</span></div></div>`;
html+='<div class="muted"><b>守備・選手別</b></div>';
for(const p of (f.players||[])){let status='CSV詳細分析可',cls='pass',txt='一致';if(!p.csv&&p.master){status='XLSMのみ';cls='partial';txt='CSV未収録';}else if(!p.allowed){status='CSV分析停止';cls='fail';txt='不一致';}const issues=(p.issues||[]).map(x=>x.status==='MISMATCH'?`${x.label}: XLSM=${x.xlsm} / CSV=${x.csv}`:x.status).join('<br>');html+=`<div class="row ${cls}"><b>${esc(p.name)}</b> — <span class="${cls==='pass'?'ok':cls==='partial'?'warn':'bad'}">${esc(status)}</span><div class="mono">${esc(txt)} / CSV rows=${p.csvRows||0}${issues?'<br>'+issues:''}</div></div>`}
details.innerHTML=html}
</script></body></html>
