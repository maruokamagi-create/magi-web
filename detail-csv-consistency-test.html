<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI XLSM / CSV Consistency Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 36px}h1{font-size:30px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.ok{color:#8ce0b4}.bad{color:#ff9898}.warn{color:#ffd792}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:13px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55;overflow-wrap:anywhere}.big{font-size:24px;font-weight:900}</style></head><body><div class="wrap"><h1>MAGI XLSM / CSV Consistency Test</h1><div class="sub">原則は<strong>XLSM正本が正しい数値</strong>。CSVは詳細分析用です。CSVを使う前に共通カウントをXLSMと厳格照合し、1項目でも矛盾・未検証があればそのCSV分析を止めます。率は比較対象にせず、カウントから再計算します。</div><section class="card"><div><b>今回の確認</b></div><div class="muted">打撃CSV：打数・安打・打点・得点・単打・二塁打・三塁打・本塁打・三振・四球・死球・盗塁・盗塁刺・犠打・犠飛を選手ごとにXLSM正本と照合。<br>守備CSV：まず文字コード・必須列・重複・期間を監査。守備数値そのもののXLSM照合は次段階で接続します。</div><div class="actions"><button onclick="run('current')">現チーム確認</button><button onclick="run('old')">旧チーム確認</button></div></section><section class="card" id="summary"><div class="muted">未実行</div></section><section class="card" id="details"></section></div><script>
const summary=document.getElementById('summary'),details=document.getElementById('details');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function run(season){summary.innerHTML='<div class="muted">DriveのXLSM正本とCSVを照合中…</div>';details.innerHTML='';let d;try{const r=await fetch('/api/magi/detail-consistency',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({season})});d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`)}catch(e){summary.innerHTML=`<div class="big bad">API ERROR</div><div>${esc(e.message||e)}</div>`;return}
const batting=d.batting||{},fielding=d.fielding||{};const all=d.analysisAllowed;summary.innerHTML=`<div class="big ${all?'ok':'bad'}">${esc(d.seasonLabel)} — ${all?'GATE OPEN':'GATE BLOCKED'}</div><div class="muted">XLSM正本: ${esc(d.authoritativeSource?.name||'')}<br>Policy: ${esc(d.policyVersion)}<br>結論: ${esc(d.rule)}</div>`;
let html=`<div class="row ${batting.gateOpen?'pass':'fail'}"><b>打撃 XLSM ↔ CSV</b> — <span class="${batting.gateOpen?'ok':'bad'}">${batting.gateOpen?'PASS':'BLOCK'}</span><div class="muted">CSV: ${esc(batting.source?.name||'')} / encoding=${esc(batting.source?.encoding||'')} / ${batting.rows||0}行 / ${batting.playerCount||0}選手 / ${esc(batting.minDate)}〜${esc(batting.maxDate)}<br>完全重複行=${batting.duplicateRows||0} / 必須列欠落=${esc((batting.missingColumns||[]).join(', ')||'なし')} / 照合NG選手=${batting.blockedPlayerCount||0}</div></div>`;
html+=`<div class="row ${fielding.structuralGateOpen?'pass':'fail'}"><b>守備 CSV 構造監査</b> — <span class="${fielding.structuralGateOpen?'ok':'bad'}">${fielding.structuralGateOpen?'PASS':'BLOCK'}</span><div class="muted">CSV: ${esc(fielding.source?.name||'')} / encoding=${esc(fielding.source?.encoding||'')} / ${fielding.rows||0}行 / ${fielding.playerCount||0}選手 / ${esc(fielding.minDate)}〜${esc(fielding.maxDate)}<br>完全重複行=${fielding.duplicateRows||0} / 必須列欠落=${esc((fielding.missingRequiredColumns||[]).join(', ')||'なし')} / 期間整合=${fielding.startDateValid?'OK':'NG'}<br><span class="warn">${esc(fielding.note||'')}</span></div></div>`;
for(const p of (batting.players||[])){const rec=p.reconciliation||{};const ok=rec.csvAnalysisAllowed;const issues=[...(rec.mismatches||[]),...(rec.unverifiable||[])];html+=`<div class="row ${ok?'pass':'fail'}"><b>${esc(p.name)}</b> — <span class="${ok?'ok':'bad'}">${ok?'一致':'CSV分析停止'}</span><div class="mono">CSV rows=${p.csvRows} / masterFound=${p.masterFound}<br>${issues.length?issues.map(x=>`${esc(x.key)}: XLSM=${esc(x.master)} / CSV=${esc(x.csv)} / ${esc(x.status)}`).join('<br>'):'共通カウントすべて一致'}</div></div>`}details.innerHTML=html}
</script></body></html>
