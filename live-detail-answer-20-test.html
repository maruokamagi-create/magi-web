<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Detail Answer 20 Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom))}.card,.row{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:15px;margin:12px 0}h1{margin:0 0 7px;font-size:27px}.sub,.meta{color:#9db4c7;line-height:1.65}.notice{line-height:1.75;color:#c4d4e2}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:850;background:#edf6ff;color:#07111f}.row.pass{border-color:#2c6a4b}.row.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.top{display:flex;gap:8px;align-items:center}.id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8da8bf}.verdict{margin-left:auto;font-weight:900}.q{font-weight:800;margin:9px 0}.ans{line-height:1.65}.detail{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;margin-top:8px;word-break:break-word}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><h1>MAGI 旧チーム 詳細回答 20問拡張テスト</h1><div class="sub">8/8合格後の拡張試験。対象選手・チーム判定、走塁、四死球、犠打・犠飛、守備、捕手指標を広げて確認します。</div>
<section class="card"><div class="notice"><b>対象：</b>2025-2026旧チームのみ。現チームCSVは未確定のため対象外。<br><b>判定：</b>FULL OPEN済みの照合結果を必須とし、質問対象・領域・要求指標が正しく返るかを確認します。</div><div class="actions"><button id="run">20問テスト開始</button></div><div id="state" class="meta">未実行</div><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b id="pass" class="ok">0</b></div><div class="stat"><span>FAIL</span><b id="fail" class="bad">0</b></div><div class="stat"><span>API ERROR</span><b id="api">0</b></div></div></section><section id="list"></section></main><script>
const CASES=[
{id:'X01',q:'前チームの宮村 龍の盗塁数は？',domain:'RUNNING',player:'宮村 龍',keys:['SB']},
{id:'X02',q:'前チームの宮嵜 翔の四球と死球を教えて',domain:'BATTING_DETAIL',player:'宮嵜 翔',keys:['BB','HBP']},
{id:'X03',q:'前チームの大野 竜暉の犠打と犠飛は？',domain:'BATTING_DETAIL',player:'大野 竜暉',keys:['SAC','SF']},
{id:'X04',q:'前チームの鰐渕 将太の守備機会と失策は？',domain:'FIELDING',player:'鰐渕 将太',keys:['CHANCES','ERRORS']},
{id:'X05',q:'前チームの大野 竜暉の守備率は？',domain:'FIELDING',player:'大野 竜暉',keys:['FIELDING_PCT']},
{id:'X06',q:'前チームの宮村 龍の盗塁阻止数と盗塁阻止率は？',domain:'FIELDING',player:'宮村 龍',keys:['CS','CS_PCT']},
{id:'X07',q:'前チーム全体の盗塁数は？',domain:'RUNNING',team:true,keys:['SB']},
{id:'X08',q:'前チーム全体の失策数は？',domain:'FIELDING',team:true,keys:['ERRORS']},
{id:'X09',q:'旧チームの坂本 陸の盗塁刺はいくつ？',domain:'RUNNING',player:'坂本 陸',keys:['CS']},
{id:'X10',q:'2025-2026の宮村 龍の盗塁成功率を教えて',domain:'RUNNING',player:'宮村 龍',keys:['SB_PCT']},
{id:'X11',q:'旧チームの大久保陽翔の四死球は？',domain:'BATTING_DETAIL',player:'大久保 陽翔',keys:['BB','HBP','BB_HBP']},
{id:'X12',q:'前チームの嶋田栄志の犠打数を見せて',domain:'BATTING_DETAIL',player:'嶋田 栄志',keys:['SAC']},
{id:'X13',q:'前チームの武澤大翔の犠飛は何本？',domain:'BATTING_DETAIL',player:'武澤 大翔',keys:['SF']},
{id:'X14',q:'前チームの大野竜暉の補殺数は？',domain:'FIELDING',player:'大野 竜暉',keys:['ASSISTS']},
{id:'X15',q:'旧チームの大久保 陽翔の刺殺数を教えて',domain:'FIELDING',player:'大久保 陽翔',keys:['PUTOUTS']},
{id:'X16',q:'前チームの宮村龍の捕逸はいくつ？',domain:'FIELDING',player:'宮村 龍',keys:['PB']},
{id:'X17',q:'前チームの大野 竜暉の許盗塁は？',domain:'FIELDING',player:'大野 竜暉',keys:['SB_ALLOWED']},
{id:'X18',q:'前チームの宮村 龍の盗塁企図数を教えて',domain:'FIELDING',player:'宮村 龍',keys:['SB_ATT']},
{id:'X19',q:'旧チームの宮村 龍の牽制刺は？',domain:'FIELDING',player:'宮村 龍',keys:['PK']},
{id:'X20',q:'前チーム全体の守備率は？',domain:'FIELDING',team:true,keys:['FIELDING_PCT']}
];
const $=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function check(c,d){const e=[];if(!d?.ok)e.push('ok=false');if(d?.refusedToInvent)e.push(`refused: ${d.reason||''}`);if(d?.season!=='old')e.push(`season=${d?.season}`);if(d?.domain!==c.domain)e.push(`domain ${c.domain} != ${d?.domain}`);if(!d?.verification?.detailAnalysisAllowed)e.push('FULL OPEN evidence not confirmed');if(c.player&&d?.target?.player!==c.player)e.push(`player ${c.player} != ${d?.target?.player}`);if(c.team&&d?.target?.type!=='TEAM')e.push('team target missing');for(const k of c.keys){if(!Object.prototype.hasOwnProperty.call(d?.metricValues||{},k))e.push(`metric missing ${k}`);const shown=d?.displayValues?.[k];if(shown===undefined||shown===null)e.push(`display missing ${k}`);else if(!String(d.answer||'').includes(String(shown)))e.push(`answer does not contain ${k}=${shown}`)}return e}
async function call(c){const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'VERIFIED_DETAIL_ANSWER',question:c.q})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function addRow(c,d,errs,apiError){const row=document.createElement('article');row.className='row '+(!apiError&&!errs.length?'pass':'fail');row.innerHTML=`<div class="top"><span class="id">${c.id}</span><span class="verdict ${!apiError&&!errs.length?'ok':'bad'}">${apiError?'API ERROR':errs.length?'FAIL':'PASS'}</span></div><div class="q">${esc(c.q)}</div>`+(apiError?`<div class="bad">${esc(apiError)}</div>`:`<div class="ans">${esc(d.answer)}</div><div class="detail">domain=${esc(d.domain)} / target=${esc(d.target?.player||d.target?.label)} / values=${esc(JSON.stringify(d.metricValues))}<br>engine=${esc(d.engineVersion)} / gate=${esc(d.verification?.overallState)}</div>`)+(errs.length?`<div class="bad detail">${errs.map(esc).join('<br>')}</div>`:'');$('list').appendChild(row)}
$('run').onclick=async()=>{$('run').disabled=true;$('list').innerHTML='';let p=0,f=0,a=0;for(let i=0;i<CASES.length;i++){const c=CASES[i];$('state').textContent=`${i+1}/${CASES.length} ${c.id} 実行中`;try{const d=await call(c),errs=check(c,d);if(errs.length)f++;else p++;addRow(c,d,errs,'')}catch(e){a++;addRow(c,null,[],String(e.message||e))}$('done').textContent=i+1;$('pass').textContent=p;$('fail').textContent=f;$('api').textContent=a;await sleep(500)}$('state').textContent=`終了：PASS ${p} / FAIL ${f} / API ERROR ${a}`;$('run').disabled=false};
</script></body></html>
