<div class="wrap">
  <h1>MAGI Router Stress Test</h1>
  <div class="sub">質問理解の精度検証専用。MAGI本体の成績表示・審議は実行しません。</div>

  <section class="card">
    <div class="notice">
      最重要指標は「危険誤作動」です。これは、本来は聞き返すべき質問を、曖昧なまま実行可能ルートへ進めたケースです。<br>
      API側のレート制限を超えにくいよう、1件ごとに約3.6秒空けて実行します。全件は数分かかります。
    </div>
    <div class="actions">
      <button id="runAll">全テスト開始</button>
      <button id="runNext" class="secondary">次の10件</button>
      <button id="stop" class="secondary">停止</button>
      <button id="reset" class="secondary">結果リセット</button>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="state" id="state">未実行</div>
  </section>

  <section class="card">
    <div class="stats">

      <div class="stat"><span>危険誤作動</span><b class="danger" id="danger">0</b></div>
      <div class="stat"><span>不要聞き返し</span><b class="warn" id="overclarify">0</b></div>
    </div>
    <div class="stats" style="margin-top:8px">
      <div class="stat"><span>誤ルート</span><b id="wrongRoute">0</b></div>

      <div class="stat"><span>正解率</span><b id="accuracy">—</b></div>
    </div>
  </section>

  <section class="card">
    <div class="filters" id="filters"></div>
  </section>

  <section class="card">
    <div class="list" id="list"></div>
  </section>

 {id:'R23',cat:'実戦/期間',q:'竜暉の最近どう？',exp:{route:'CLARIFY',clarify:true,safe:false}},
 {id:'R24',cat:'実戦/意味不明',q:'陽翔のあれ最近どうなった',exp:{route:'CLARIFY',clarify:true,safe:false}},
 {id:'R25',cat:'実戦/対象外',q:'明日の天気どう？',exp:{route:'UNSUPPORTED',clarify:false,safe:false}},
 {id:'R26',cat:'実戦/審議',q:'大野と陽翔なら次の試合どっちを先発投手にするべき？',exp:{route:'DELIBERATION',clarify:false,safe:true,players:['大野 竜暉','大久保 陽翔']}},
 {id:'R27',cat:'実戦/比較',q:'陽翔と竜暉、盗塁数が多いのは？',exp:{route:'PLAYER_COMPARISON',clarify:false,safe:true,players:['大久保 陽翔','大野 竜暉'],domain:'RUNNING'}},
 {id:'R28',cat:'実戦/曖昧',q:'陽翔と竜暉の最近を比べて',exp:{route:'CLARIFY',clarify:true,safe:false}},
 {id:'R29',cat:'実戦/依頼',q:'陽翔の成績をPDFにして',exp:{route:'CLARIFY',clarify:true,safe:false}},
 {id:'R30',cat:'実戦/依頼',q:'陽翔の通算打撃成績をPDFにして',exp:{route:'BATTING_LOOKUP',clarify:false,safe:true,player:'大久保 陽翔',domain:'BATTING',time:'CAREER'}}
];

const $=id=>document.getElementById(id), results=new Map();
let running=false, cursor=0, activeFilter='全部';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('total').textContent=CASES.length;

function hasAll(arr, expected){return (expected||[]).every(x=>(arr||[]).includes(x))}
function evaluate(c,d){
 const e=c.exp||{}, reasons=[];
 if(e.route && d.route!==e.route) reasons.push(`route expected=${e.route} actual=${d.route}`);
 if(typeof e.clarify==='boolean' && !!d.needsClarification!==e.clarify) reasons.push(`clarify expected=${e.clarify} actual=${!!d.needsClarification}`);
 if(typeof e.safe==='boolean' && !!d.safeToExecute!==e.safe) reasons.push(`safe expected=${e.safe} actual=${!!d.safeToExecute}`);
 if(e.player && !(d.players||[]).includes(e.player)) reasons.push(`player missing=${e.player}`);
 if(e.players && !hasAll(d.players,e.players)) reasons.push(`players missing=${e.players.filter(x=>!(d.players||[]).includes(x)).join(',')}`);
 if(e.domain && !(d.domains||[]).includes(e.domain)) reasons.push(`domain missing=${e.domain}`);
 if(e.time && d.timeScope!==e.time) reasons.push(`time expected=${e.time} actual=${d.timeScope}`);
 const dangerous=e.clarify===true && d.route!=='CLARIFY' && d.safeToExecute===true;
 const overclarify=e.clarify===false && d.route==='CLARIFY';
 const wrongRoute=!!e.route && e.route!=='CLARIFY' && d.route!==e.route && !overclarify;
 return {pass:reasons.length===0,dangerous,overclarify,wrongRoute,reasons};
}

async function runCase(c){
 const start=performance.now();
 try{
  const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ROUTE_QUESTION',question:c.q,context:c.ctx||[]})});
  const d=await r.json();
  if(!r.ok||!d.ok) throw new Error(d.error||`HTTP ${r.status}`);
  const ev=evaluate(c,d);results.set(c.id,{case:c,data:d,ev,ms:Math.round(performance.now()-start)});
 }catch(err){results.set(c.id,{case:c,error:String(err?.message||err),ev:{pass:false,dangerous:false,overclarify:false,wrongRoute:false,reasons:[String(err?.message||err)]},ms:Math.round(performance.now()-start)});}
 render();
}

async function runRange(from,to){
 if(running)return;running=true;toggleButtons();
 for(let i=from;i<to&&i<CASES.length;i++){
  if(!running)break;cursor=i;$('state').textContent=`${i+1}/${CASES.length} 実行中: ${CASES[i].id} ${CASES[i].q}`;
  await runCase(CASES[i]);cursor=i+1;updateProgress();
  if(i<to-1&&i<CASES.length-1&&running)await sleep(3600);
 }
 running=false;toggleButtons();$('state').textContent=cursor>=CASES.length?'全テスト終了':'停止中 / 次は '+(cursor+1)+'件目';
}
$('runAll').onclick=()=>runRange(cursor,CASES.length);
$('runNext').onclick=()=>runRange(cursor,Math.min(cursor+10,CASES.length));
$('stop').onclick=()=>{running=false;$('state').textContent='停止要求を受け付けました';toggleButtons()};
$('reset').onclick=()=>{if(running)return;results.clear();cursor=0;render();updateProgress();$('state').textContent='結果をリセットしました'};
function toggleButtons(){$('runAll').disabled=running;$('runNext').disabled=running;$('reset').disabled=running;$('stop').disabled=!running}

function updateProgress(){$('bar').style.width=`${Math.round((results.size/CASES.length)*100)}%`}
function summary(){
 let pass=0,danger=0,over=0,wrong=0,other=0;
 for(const r of results.values()){
  if(r.ev.pass)pass++;
  else if(r.ev.dangerous)danger++;
  else if(r.ev.overclarify)over++;
  else if(r.ev.wrongRoute)wrong++;
  else other++;
 }
 $('done').textContent=results.size;$('pass').textContent=pass;$('danger').textContent=danger;$('overclarify').textContent=over;$('wrongRoute').textContent=wrong;$('otherFail').textContent=other;$('accuracy').textContent=results.size?`${Math.round(pass/results.size*1000)/10}%`:'—';
}
function makeFilters(){
 const cats=['全部','FAILのみ',...new Set(CASES.map(c=>c.cat))];$('filters').innerHTML='';
 for(const cat of cats){const b=document.createElement('button');b.className=cat===activeFilter?'':'secondary';b.textContent=cat;b.onclick=()=>{activeFilter=cat;makeFilters();renderList()};$('filters').appendChild(b)}
}
function visible(c,r){if(activeFilter==='全部')return true;if(activeFilter==='FAILのみ')return r&&!r.ev.pass;return c.cat===activeFilter}
function renderList(){
 const list=$('list');list.innerHTML='';
 for(const c of CASES){const r=results.get(c.id);if(!visible(c,r))continue;
  const row=document.createElement('div');row.className='row '+(r?(r.ev.pass?'pass':'fail'):'');
  const verdict=!r?'未実行':r.ev.pass?'PASS':r.ev.dangerous?'危険誤作動':r.ev.overclarify?'不要聞き返し':r.ev.wrongRoute?'誤ルート':'FAIL';
  const actual=r?.data?`${r.data.route} / ${r.data.confidence||'—'} / safe=${!!r.data.safeToExecute}`:(r?.error?`ERROR ${r.error}`:'—');
  row.innerHTML=`<div class="top"><span class="id">${c.id}</span><span class="tag">${c.cat}</span><span class="verdict">${verdict}</span></div><div class="q"></div><div class="meta">期待: ${c.exp.route||'任意'} / clarify=${c.exp.clarify??'任意'} / safe=${c.exp.safe??'任意'}<br>実際: ${actual}</div><div class="detail"></div>`;
  row.querySelector('.q').textContent=c.q;
  const detail=row.querySelector('.detail');
  if(r&&!r.ev.pass)detail.textContent=r.ev.reasons.join('\n');
  if(r?.data){const raw=document.createElement('details');raw.innerHTML='<summary>JSON</summary>';const pre=document.createElement('div');pre.className='raw';pre.textContent=JSON.stringify(r.data,null,2);raw.appendChild(pre);row.appendChild(raw)}
  list.appendChild(row);
 }
}
function render(){summary();renderList();updateProgress()}
makeFilters();render();toggleButtons();
</script>
</body>
</html>
