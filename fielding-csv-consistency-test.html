<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Fielding XLSM / CSV Consistency Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 36px}h1{font-size:30px;line-height:1.25}.sub,.muted{color:#9db4c7;line-height:1.7}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:13px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.warn{color:#ffd792}.big{font-size:24px;font-weight:900}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55;overflow-wrap:anywhere}</style></head><body><div class="wrap"><h1>MAGI Fielding XLSM / CSV Consistency Test</h1><div class="sub"><strong>XLSM正本が正しい数値</strong>。守備CSVを分析へ使う前に、守備機会・補殺・刺殺・失策・併殺・三重殺・捕手回数・捕逸・許盗塁・盗塁企図・盗塁阻止・牽制刺・捕妨害を選手ごとに照合します。守備率と盗塁阻止率はカウントから再計算します。</div><section class="card"><div class="actions"><button onclick="run('current')">現チーム確認</button><button onclick="run('old')">旧チーム確認</button></div></section><section class="card" id="summary"><div class="muted">未実行</div></section><section class="card" id="details"></section></div><script>
const s=document.getElementById('summary'),d=document.getElementById('details');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function run(season){s.innerHTML='<div class="muted">XLSM正本と守備CSVを数値照合中…</div>';d.innerHTML='';let x;try{const r=await fetch('/api/magi/fielding-consistency',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({season})});x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||`HTTP ${r.status}`)}catch(e){s.innerHTML=`<div class="big bad">API ERROR</div><div>${esc(e.message||e)}</div>`;return}
const ok=x.teamWideAnalysisAllowed;s.innerHTML=`<div class="big ${ok?'ok':'bad'}">${esc(x.seasonLabel)} — ${ok?'FIELDING GATE OPEN':'FIELDING GATE BLOCKED'}</div><div class="muted">XLSM正本: ${esc(x.authoritativeSource?.name)} / sheet=${esc(x.authoritativeSource?.sheet)}<br>CSV: ${esc(x.detailSource?.name)} / encoding=${esc(x.detailSource?.encoding)} / ${x.csvRows}行 / CSV ${x.csvPlayerCount}選手 / XLSM ${x.masterPlayerCount}選手<br>照合NG選手=${x.blockedPlayerCount}<br>結論: ${esc(x.rule)}<br><span class="warn">${esc(x.note)}</span></div>`;
let html='';for(const p of x.players||[]){const good=p.allowed;html+=`<div class="row ${good?'pass':'fail'}"><b>${esc(p.name)}</b> — <span class="${good?'ok':'bad'}">${good?'一致・CSV分析可':'不一致/未収録・XLSM優先'}</span><div class="mono">CSV rows=${p.csvRows}${(p.issues||[]).length?'<br>'+p.issues.map(i=>i.status==='MISMATCH'?`${esc(i.label)}: XLSM=${esc(i.xlsm)} / CSV=${esc(i.csv)}`:esc(i.status)).join('<br>'):'<br>共通カウント一致'}</div></div>`}d.innerHTML=html}
</script></body></html>
