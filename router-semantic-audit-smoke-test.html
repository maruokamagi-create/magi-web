<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MAGI Semantic Audit Smoke Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:880px;margin:auto;padding:22px 14px 36px}h1{font-size:28px;margin:0 0 8px}.sub{color:#9db4c7;line-height:1.6}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:#edf6ff;color:#07111f}.row{background:#071827;border:1px solid #284966;border-radius:14px;padding:12px;margin:10px 0}.row.pass{border-color:#2c6a4b}.row.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.meta{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55}.q{font-size:16px;font-weight:800;margin:8px 0}.top{display:flex;justify-content:space-between;gap:10px}.note{font-size:13px;color:#bad0e1;line-height:1.5}</style></head><body><div class="wrap"><h1>MAGI Semantic Audit Smoke Test</h1><div class="sub">180問試験で見つかった「テストの正解そのものが妥当か」を監査します。単に既存の期待値へ合わせず、実際に人間の質問を理解して余計な聞き返しをしないことを確認します。</div><div class="card"><button id="run">6ケース開始</button><div id="summary" style="margin-top:12px">未実行</div><div id="version" class="meta"></div></div><div id="list"></div></div><script>
const CASES=[
{id:'A01',q:'レポート見せて',route:'CLARIFY',why:'対象レポートが特定できないので確認が必要'},
{id:'A02',q:'陽翔の成績と起用どう？',route:'DELIBERATION',why:'起用判断が明示されており、成績は判断材料として扱える'},
{id:'A03',q:'4番どうする？',route:'DELIBERATION',why:'チーム全体を候補集合として4番起用を判断できる'},
{id:'A04',q:'大野 竜暉の打撃と投手の両方まとめて',route:'PLAYER_OVERVIEW',why:'打撃・投手の両方が明示されており、どちらかを選ばせる必要はない'},
{id:'A05',q:'投手誰？',route:'CLARIFY',why:'先発・救援・対象試合など目的が不足している'},
{id:'A06',q:'8月号のTEAM REPORTを見せて',route:'DOCUMENT_SEARCH',why:'資料が具体的に特定されている'}
];
const list=document.getElementById('list'),summary=document.getElementById('summary'),version=document.getElementById('version');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(c){const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ROUTE_QUESTION',question:c.q,context:[]})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
document.getElementById('run').onclick=async()=>{list.innerHTML='';let pass=0,fail=0,api=0;for(const c of CASES){let row=document.createElement('div');row.className='row';try{const d=await call(c);const ok=d.route===c.route;if(ok)pass++;else fail++;row.classList.add(ok?'pass':'fail');row.innerHTML=`<div class="top"><b>${c.id}</b><b class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</b></div><div class="q">${c.q}</div><div class="meta">期待: ${c.route}<br>実際: ${d.route} / ${d.confidence} / router=${d.routerVersion||'?'}</div><div class="note">${c.why}</div>`;version.textContent=`Router Version: ${d.routerVersion||'?'}`}catch(e){api++;row.classList.add('fail');row.innerHTML=`<div class="top"><b>${c.id}</b><b class="bad">API ERROR</b></div><div class="q">${c.q}</div><div class="bad">${String(e.message||e)}</div>`}list.appendChild(row);await sleep(1200)}summary.innerHTML=`<b class="${fail||api?'bad':'ok'}">${pass}/${CASES.length} PASS</b> / FAIL ${fail} / API ERROR ${api}`}
</script></body></html>
