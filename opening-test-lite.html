<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>MAGI Opening Test Lite</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020914;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;overflow:hidden}#stage{position:fixed;inset:0;background:radial-gradient(circle at center,#071b36 0,#020914 68%,#000 100%);display:grid;place-items:center}#logo{width:min(91vw,760px);height:auto;opacity:0;transform:scale(.985);filter:brightness(.18) saturate(.75)}body.play #logo{animation:reveal 2.05s cubic-bezier(.2,.72,.15,1) forwards}#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}body.play #flash{animation:flash .42s 2.08s ease-out forwards}#page{position:fixed;inset:0;background:#0b2740;color:white;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;pointer-events:none}body.play #page{animation:page .62s 2.38s ease forwards}#page h1{margin:0;font-size:clamp(38px,11vw,74px);letter-spacing:.1em}#page p{margin:0;color:#9cb5ca;letter-spacing:.08em;font-size:12px}#loading{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;color:#637d94;font-size:11px;letter-spacing:.08em}body.play #loading{display:none}button{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:5;border:1px solid #6887a2;border-radius:999px;background:#102f4b;color:#fff;padding:10px 15px;font-weight:700;display:none}body.done button{display:block}@keyframes reveal{0%{opacity:0;transform:scale(.985);filter:brightness(.12) blur(1.5px) saturate(.6)}42%{opacity:.48;filter:brightness(.55) blur(0) saturate(.9)}82%{opacity:1;transform:scale(1);filter:brightness(1) saturate(1)}100%{opacity:1;transform:scale(1.012);filter:brightness(1.14) drop-shadow(0 0 20px rgba(76,167,255,.25))}}@keyframes flash{0%{opacity:0}32%{opacity:1}100%{opacity:0}}@keyframes page{0%,40%{opacity:0}100%{opacity:1}}</style></head><body><div id="stage"><img id="logo" alt="MAGI" src="./magi_intro_light.jpg"></div><div id="flash"></div><div id="page"><h1>MAGI</h1><p>PAGE START</p></div><div id="loading">LOGO LOADING...</div><button id="again">もう一度</button><script>const img=document.getElementById('logo');const start=()=>{document.body.classList.add('play');setTimeout(()=>document.body.classList.add('done'),3050)};if(img.complete&&img.naturalWidth)start();else img.addEventListener('load',start,{once:true});document.getElementById('again').onclick=()=>location.reload();</script></body></html>
