<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAGI Opening Test Lite</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020914;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;overflow:hidden}#stage{position:fixed;inset:0;background:radial-gradient(circle at center,#061c3a 0,#020914 68%,#000 100%);display:grid;place-items:center}#logo{width:min(88vw,760px);height:auto;opacity:0;transform:scale(.985);filter:brightness(.45) saturate(.9);animation:reveal 2.15s cubic-bezier(.2,.72,.15,1) forwards}#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .46s 2.18s ease-out forwards}#page{position:fixed;inset:0;background:#0b2740;color:white;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;animation:page .65s 2.46s ease forwards}#page h1{margin:0;font-size:clamp(38px,11vw,74px);letter-spacing:.1em}#page p{margin:0;color:#9cb5ca;letter-spacing:.08em}button{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));z-index:5;border:1px solid #6887a2;border-radius:999px;background:#102f4b;color:#fff;padding:11px 16px;font-weight:700}@keyframes reveal{0%{opacity:0;transform:scale(.985);filter:brightness(.12) blur(2px) saturate(.6)}45%{opacity:.45;filter:brightness(.55) blur(0) saturate(.9)}82%{opacity:1;transform:scale(1);filter:brightness(1) saturate(1)}100%{opacity:1;transform:scale(1.015);filter:brightness(1.18) drop-shadow(0 0 22px rgba(76,167,255,.28))}}@keyframes flash{0%{opacity:0}34%{opacity:1}100%{opacity:0}}@keyframes page{0%,45%{opacity:0}100%{opacity:1}}</style></head><body><div id="stage"><img id="logo" alt="MAGI" src="/magi_intro_light.jpg?v=2"></div><div id="flash"></div><div id="page"><h1>MAGI</h1><p>PAGE START</p></div><button onclick="location.reload()">もう一度</button></body></html>
