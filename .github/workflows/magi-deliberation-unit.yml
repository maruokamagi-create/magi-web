      - 'server/api/magi/_full-lineup.js'
      - 'server/api/magi/_pitching-plan.js'
      - 'server/api/magi/_pitching-plan-output-guard.js'
      - 'server/api/magi/_drive-live-audit.js'
      - 'server/api/magi/_persona-output-guard.js'
      - 'server/api/magi/_cross-output-guard.js'
      - 'server/api/magi/_gemini.js'
      - 'server/api/magi/_canonical-cache.js'
      - 'scripts/test-provider-quota-cooldown.mjs'
      - 'server/api/magi/_roster.js'
      - 'engine-ui-v187.js'
      - 'magi-formal-runner-v373.js'
      - 'magi-app-bootstrap-v363.js'
      - 'index.html'
      - 'scripts/test-formal-deadlock-v373.mjs'
      - '.github/workflows/magi-production-reproducibility-smoke.yml'
      - 'deliberation-integrity-v348.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'scripts/test-full-lineup-persona-transport.mjs'
      - 'cross-dialogue-ui-v380.js'
      - 'magi-user-language-v382.js'
      - 'scripts/test-deliberation-final.mjs'
      - 'scripts/test-persona-output-guard.mjs'
      - 'scripts/test-live133-residual-grounding.mjs'
      - 'scripts/test-persona-batch-soft-recovery.mjs'
      - 'scripts/test-persona-second-fallback.mjs'
      - 'scripts/test-lineup-persona-grounding.mjs'
      - 'scripts/test-dialogue-resilient-fallback.mjs'
      - 'scripts/test-dialogue-core-kinds.mjs'
      - 'scripts/test-cross-dialogue-ui-contract.mjs'
      - 'scripts/test-user-language-summary.mjs'
      - 'scripts/test-pitching-plan-output-guard.mjs'
      - 'scripts/test-derived-metric-label-guard.mjs'
      - 'scripts/test-deliberation-evidence-bridge.mjs'
      - 'scripts/test-natural-evaluation-routing.mjs'
      - 'scripts/test-selection-peer-baseline.mjs'
      - 'scripts/test-selection-live-evidence.mjs'
      - 'scripts/test-full-lineup-selection.mjs'
      - 'scripts/test-live-production-sha-gate.mjs'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
      - 'scripts/test-pitching-plan-selection.mjs'
      - 'scripts/test-full-lineup-semantic-route.mjs'
      - 'scripts/test-pitching-plan-semantic-route.mjs'
      - 'scripts/test-cross-output-guard.mjs'
      - 'scripts/test-persona-case-mode.mjs'
      - '.github/workflows/magi-production-full-lineup-smoke.yml'
      - 'scripts/validate-production-full-lineup-final.jq'
      - 'scripts/test-production-full-lineup-smoke-contract.mjs'
      - '.github/workflows/magi-deliberation-unit.yml'
  pull_request:
    paths:
      - 'server/api/magi/core.js'
      - 'server/api/magi/_semantic-authority.js'
      - 'scripts/test-semantic-team-aggregate-route.mjs'
      - 'server/api/magi/persona-batch.js'
      - 'scripts/test-persona-batch-soft-recovery.mjs'
      - 'server/api/magi/_persona-output-guard.js'
      - 'scripts/test-persona-output-guard.mjs'
