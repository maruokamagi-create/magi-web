name: MAGI Deliberation Final Selftest

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/persona.js'
      - 'server/api/magi/orchestrate.js'
      - 'server/api/magi/core.js'
      - 'server/api/magi/_semantic-postguard.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_full-lineup.js'
      - 'server/api/magi/_drive-live-audit.js'
      - 'server/api/magi/_persona-output-guard.js'
      - 'server/api/magi/_cross-output-guard.js'
      - 'server/api/magi/_roster.js'
      - 'scripts/test-deliberation-final.mjs'
      - 'scripts/test-persona-output-guard.mjs'
      - 'scripts/test-selection-peer-baseline.mjs'
      - 'scripts/test-selection-live-evidence.mjs'
      - 'scripts/test-full-lineup-selection.mjs'
      - 'scripts/test-full-lineup-semantic-route.mjs'
      - 'scripts/test-cross-output-guard.mjs'
      - 'scripts/test-persona-case-mode.mjs'
      - '.github/workflows/magi-deliberation-unit.yml'
  workflow_dispatch:

jobs:
  deterministic-deliberation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run deliberation final cases
        run: node --experimental-default-type=module scripts/test-deliberation-final.mjs

      - name: Run persona evidence-language guard cases
        run: node --experimental-default-type=module scripts/test-persona-output-guard.mjs

      - name: Run selection peer-baseline guard cases
        run: node --experimental-default-type=module scripts/test-selection-peer-baseline.mjs

      - name: Run live lineup selection evidence cases
        run: node --experimental-default-type=module scripts/test-selection-live-evidence.mjs

      - name: Run full 1-9 lineup deliberation cases
        run: node --experimental-default-type=module scripts/test-full-lineup-selection.mjs

      - name: Run full lineup semantic routing cases
        run: node --experimental-default-type=module scripts/test-full-lineup-semantic-route.mjs

      - name: Run cross-examination evidence guard cases
        run: node --experimental-default-type=module scripts/test-cross-output-guard.mjs

      - name: Run persona case-mode cases
        run: node --experimental-default-type=module scripts/test-persona-case-mode.mjs
