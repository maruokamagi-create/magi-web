      - 'index.html'
      - 'scripts/test-formal-deadlock-v373.mjs'
      - '.github/workflows/magi-production-reproducibility-smoke.yml'
      - 'scripts/test-selection-live-evidence.mjs'
      - 'scripts/test-full-lineup-selection.mjs'
      - '.github/workflows/magi-production-full-lineup-smoke.yml'
      - 'scripts/validate-production-full-lineup-final.jq'
      - 'scripts/test-production-full-lineup-smoke-contract.mjs'
      - '.github/workflows/magi-deliberation-unit.yml'
  workflow_dispatch:

jobs:
  deterministic-deliberation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run deliberation final cases
        run: node --experimental-default-type=module scripts/test-deliberation-final.mjs

      - name: Run persona evidence-language guard cases
        run: node --experimental-default-type=module scripts/test-persona-output-guard.mjs

      - name: Verify TEAM_REVIEW live-stage acceptance polarity
        run: node --experimental-default-type=module scripts/test-team-review-stage-polarity.mjs

      - name: Run Live 133 residual grounding cases
        run: node --experimental-default-type=module scripts/test-live133-residual-grounding.mjs

      - name: Run persona-batch mixed soft-recovery cases
        run: node --experimental-default-type=module scripts/test-persona-batch-soft-recovery.mjs

      - name: Run SECOND transient fallback cases
        run: node --experimental-default-type=module scripts/test-persona-second-fallback.mjs

      - name: Run current-lineup persona grounding cases
        run: node --experimental-default-type=module scripts/test-lineup-persona-grounding.mjs

      - name: Run direct dialogue fallback cases
        run: node --experimental-default-type=module scripts/test-dialogue-resilient-fallback.mjs

      - name: Run core debate-kind cases
        run: node --experimental-default-type=module scripts/test-dialogue-core-kinds.mjs

      - name: Run direct dialogue UI contract cases
        run: node --experimental-default-type=module scripts/test-cross-dialogue-ui-contract.mjs

      - name: Run user-facing summary language cases
        run: node --experimental-default-type=module scripts/test-user-language-summary.mjs

      - name: Run pitching-plan evidence-quality guard cases
        run: node --experimental-default-type=module scripts/test-pitching-plan-output-guard.mjs

      - name: Run derived metric label guard cases
        run: node --experimental-default-type=module scripts/test-derived-metric-label-guard.mjs

      - name: Run structured deliberation evidence bridge cases
        run: node --experimental-default-type=module scripts/test-deliberation-evidence-bridge.mjs

      - name: Validate semantic team aggregate stats routing
        run: node --experimental-default-type=module scripts/test-semantic-team-aggregate-route.mjs

      - name: Run natural team/player evaluation routing cases
        run: node --experimental-default-type=module scripts/test-natural-evaluation-routing.mjs

      - name: Run selection peer-baseline guard cases
        run: node --experimental-default-type=module scripts/test-selection-peer-baseline.mjs

      - name: Run live lineup selection evidence cases
        run: node --experimental-default-type=module scripts/test-selection-live-evidence.mjs

      - name: Run full 1-9 lineup deliberation cases
        run: node --experimental-default-type=module scripts/test-full-lineup-selection.mjs

      - name: Test actual formal UI runner's deadlock and evidence acceptance
        run: node --experimental-default-type=module scripts/test-formal-deadlock-v373.mjs

      - name: Validate production full-lineup outcome contract (real jq)
        run: node --experimental-default-type=module scripts/test-production-full-lineup-smoke-contract.mjs

      - name: Run 7-inning pitching-plan deliberation cases
        run: node --experimental-default-type=module scripts/test-pitching-plan-selection.mjs

      - name: Run full lineup semantic routing cases
        run: node --experimental-default-type=module scripts/test-full-lineup-semantic-route.mjs

      - name: Run pitching-plan semantic routing cases
        run: node --experimental-default-type=module scripts/test-pitching-plan-semantic-route.mjs

      - name: Run cross-examination evidence guard cases
        run: node --experimental-default-type=module scripts/test-cross-output-guard.mjs

      - name: Run persona case-mode cases
        run: node --experimental-default-type=module scripts/test-persona-case-mode.mjs

      - name: Run provider quota cooldown cases
        run: node --experimental-default-type=module scripts/test-provider-quota-cooldown.mjs

      - name: Run full-lineup persona transport contract
        run: node --experimental-default-type=module scripts/test-full-lineup-persona-transport.mjs

      - name: Run live production SHA gate contract
        run: node --experimental-default-type=module scripts/test-live-production-sha-gate.mjs

