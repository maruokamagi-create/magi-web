name: MAGI Engine UI Selection Unit

on:
  push:
    paths:
      - 'main-live-answer-v362.js'
      - 'question-sample-routes-v394.js'
      - 'scripts/test-guided-question-samples.mjs'
      - 'scripts/test-semantic-formal-error-display.mjs'
      - 'engine-ui-v187.js'
      - 'deliberation-integrity-v348.js'
      - 'magi-ui-runner-guard-v359.js'
      - 'magi-formal-runner-v373.js'
      - 'scripts/test-formal-error-visibility.mjs'
      - 'scripts/test-engine-ui-selection-mode.mjs'
      - 'scripts/test-client-server-selection-alignment.mjs'
      - 'server/api/magi/orchestrate.js'
      - 'server/api/magi/_pitching-plan.js'
      - 'server/api/magi/_full-lineup.js'
      - '.github/workflows/magi-engine-ui-selection-unit.yml'
  pull_request:
    paths:
      - 'main-live-answer-v362.js'
      - 'question-sample-routes-v394.js'
      - 'scripts/test-guided-question-samples.mjs'
      - 'scripts/test-semantic-formal-error-display.mjs'
      - 'magi-app-bootstrap-v363.js'
      - 'index.html'
      - '.github/workflows/magi-engine-ui-selection-unit.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test guided question samples (no provider)
        run: node scripts/test-guided-question-samples.mjs
      - name: Test client selection routing
        run: node scripts/test-engine-ui-selection-mode.mjs
      - name: Test client server selection alignment
        run: node scripts/test-client-server-selection-alignment.mjs
      - name: Check sanitized SECOND failure classification and propagation
        run: node scripts/test-formal-error-visibility.mjs
      - name: Check user-visible semantic error classification
        run: node scripts/test-semantic-formal-error-display.mjs
