name: MAGI Production Sequential Deliberation Suite
# closer Evidence packet-to-persona trace verification
# suite refresh after live selftest syntax repair

on:
  push:
    branches: [main]
    paths:
      - 'api/magi-gateway.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'server/api/magi/**'
      - '.github/workflows/magi-production-selection-smoke.yml'
      - '.github/workflows/magi-production-full-lineup-smoke.yml'
      - '.github/workflows/magi-production-pitching-plan-smoke.yml'
      - '.github/workflows/magi-production-deliberation-smoke.yml'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
      - '.github/workflows/magi-production-reproducibility-smoke.yml'
      - '.github/workflows/magi-production-sequential-suite.yml'
  workflow_dispatch:

concurrency:
  group: magi-production-sequential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    uses: ./.github/workflows/magi-production-selection-smoke.yml
  full-lineup:
    needs: selection
    uses: ./.github/workflows/magi-production-full-lineup-smoke.yml
  pitching-plan:
    needs: full-lineup
    uses: ./.github/workflows/magi-production-pitching-plan-smoke.yml
  deliberation:
    needs: pitching-plan
    uses: ./.github/workflows/magi-production-deliberation-smoke.yml
  live-deliberation:
    needs: deliberation
    uses: ./.github/workflows/magi-production-live-deliberation-selftest.yml
  reproducibility:
    needs: live-deliberation
    uses: ./.github/workflows/magi-production-reproducibility-smoke.yml
