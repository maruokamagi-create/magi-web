name: MAGI Production Browser Bootstrap Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'magi-app-bootstrap-v356.js'
      - 'main-live-answer-v329.js'
      - 'deliberation-integrity-v348.js'
      - 'lineup-finalizer-v350.js'
      - 'api/magi-selection-live-selftest.js'
      - '.github/workflows/magi-production-bootstrap-smoke.yml'
  workflow_dispatch:

jobs:
  production-browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deployment
        run: sleep 45

      - name: Verify single-entry production bootstrap and live master evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/" -o /tmp/index.html
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-app-bootstrap-v356.js?v=356" -o /tmp/bootstrap.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/main-live-answer-v329.js?v=356" -o /tmp/semantic.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/deliberation-integrity-v348.js?v=356" -o /tmp/integrity.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/lineup-finalizer-v350.js?v=356" -o /tmp/finalizer.js

          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/index.html','utf8');
          const boot=fs.readFileSync('/tmp/bootstrap.js','utf8');
          const semantic=fs.readFileSync('/tmp/semantic.js','utf8');
          const integrity=fs.readFileSync('/tmp/integrity.js','utf8');
          const finalizer=fs.readFileSync('/tmp/finalizer.js','utf8');

          const loader=html.indexOf('/loader-v130.js?v=294');
          const canonical=html.indexOf('/magi-app-bootstrap-v356.js?v=356');
          if(loader<0||canonical<0||loader>=canonical)throw new Error('canonical app bootstrap must load after UI loader');
          if(html.includes('/magi-runtime-v1.js'))throw new Error('obsolete layered runtime is still loaded');
          if(html.includes('/formal-runtime-bootstrap-v351.js'))throw new Error('obsolete overlay bootstrap is still loaded');
          if(html.includes('/main-live-answer-v329.js'))throw new Error('semantic entry must be owned by canonical bootstrap, not index.html');
          if(html.includes('/deliberation-integrity-v348.js'))throw new Error('integrity layer must be owned by canonical bootstrap');
          if(html.includes('/lineup-finalizer-v350.js'))throw new Error('lineup finalizer must be owned by canonical bootstrap');

          if(!boot.includes('MAGI_ENGINE_UI_V187===true'))throw new Error('bootstrap does not wait for explicit formal UI readiness');
          if(!boot.includes('MAGI_FORMAL_UI_RUNNER_V1'))throw new Error('bootstrap does not capture the formal UI runner');
          if(boot.includes('MutationObserver'))throw new Error('bootstrap must not use recursive DOM observers during startup');
          if(boot.includes("Object.defineProperty(window,'runMagi'"))throw new Error('bootstrap must not fight legacy code for the global runMagi symbol');
          if(/45000|30000|12000/.test(boot))throw new Error('bootstrap contains a mobile startup wall-clock timeout');
          if(!boot.includes("entry:'GEMINI_SEMANTIC_FIRST'"))throw new Error('Gemini-first entry marker missing');
          if(!boot.includes('localFallback:false'))throw new Error('LOCAL fallback is not explicitly disabled');
          if(!boot.includes("b.removeAttribute('onclick')"))throw new Error('canonical bootstrap does not detach the old inline runMagi entry');

          const i1=boot.indexOf('/deliberation-integrity-v348.js');
          const i2=boot.indexOf('/lineup-finalizer-v350.js');
          const i3=boot.indexOf('/main-live-answer-v329.js');
          if(i1<0||i2<0||i3<0||!(i1<i2&&i2<i3))throw new Error('canonical app layers are not loaded in deterministic order');

          const integrityVersion=(integrity.match(/version:'([^']*integrity)'/)||[])[1];
          if(!integrityVersion)throw new Error('integrity engine version marker missing');
          if(!finalizer.includes('MAGI_LINEUP_FINALIZER_V350')||!finalizer.includes('lineup-finalizer-v350'))throw new Error('lineup finalizer marker missing');

          if(!semantic.includes('MAGI_FORMAL_UI_RUNNER_V1'))throw new Error('semantic router does not call the captured formal runner');
          if(!semantic.includes('MAGI_SEMANTIC_RUN_V1'))throw new Error('semantic entrypoint is not exported');
          if(/\blegacyRun\b/.test(semantic))throw new Error('legacy local runner fallback still exists');
          if(/['"]LEGACY['"]/.test(semantic))throw new Error('legacy route still exists');

          console.log(`SINGLE-ENTRY MAGI BOOTSTRAP: PASS (${integrityVersion})`);
          NODE

          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/api/magi-selection-live-selftest" -o /tmp/selection.json
          cat /tmp/selection.json; echo
          jq -e '.ok==true and .rosterExact==true and .count==14 and .playersWithBatting==14 and .hasEvidenceText==true and (.sourceName|contains("2026-2027"))' /tmp/selection.json >/dev/null
          echo 'PRODUCTION SINGLE ENTRY + LIVE MASTER: PASS'
