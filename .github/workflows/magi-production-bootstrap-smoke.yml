name: MAGI Production Browser Bootstrap Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'chat-ui-canonical-v387.js'
      - 'magi-control-summary-v377.js'
      - 'result-layout-v189.js'
      - 'selection-polish-v218.js'
      - 'magi-app-bootstrap-v363.js'
      - 'deliberation-integrity-v348.js'
      - 'magi-formal-runner-v373.js'
      - 'magi-core-client-guard-v363.js'
      - 'main-live-answer-v362.js'
      - 'magi-ui-runner-guard-v359.js'
      - 'lineup-finalizer-v350.js'
      - 'engine-progress-v358.js'
      - 'server/api/magi/_canonical-cache.js'
      - 'server/api/magi/_gemini.js'
      - 'server/api/magi/_semantic-authority.js'
      - 'server/api/magi/_drive-live-audit.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_evidence-source-map.js'
      - 'server/api/magi/_roster.js'
      - 'server/api/magi/_pitching-detail-evidence.js'
      - 'server/api/magi/_appearance-fielding-evidence.js'
      - 'server/api/magi/_coach-observation-evidence.js'
      - 'server/api/magi/_parent-observation-evidence.js'
      - 'server/api/magi/_normalized-observation-evidence.js'
      - 'server/api/magi/_staff-evidence-access.js'
      - 'server/api/magi/core.js'
      - 'api/magi-gateway.js'
      - 'api/magi-selection-live-selftest.js'
      - '.github/workflows/magi-production-bootstrap-smoke.yml'
  workflow_dispatch:
  # final verification refresh 2026-09-25

jobs:
  production-browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static canonical architecture guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/magi-app-bootstrap-v363.js?v=381' index.html
          grep -q '/chat-ui-canonical-v387.js?v=387' index.html
          grep -q 'magi-formal-runner-v373.js' magi-app-bootstrap-v363.js
          grep -q 'structuredValidationOnly:true' magi-formal-runner-v373.js
          node --check chat-ui-canonical-v387.js
          grep -Fq 'MAGI_CHAT_UI_CANONICAL_V387' chat-ui-canonical-v387.js
          echo 'CANONICAL BOOTSTRAP CORE: PASS'

      - name: Verify deterministic CONTROL summary policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          vm.runInThisContext(fs.readFileSync('magi-control-summary-v377.js','utf8'));
          const api=globalThis.MAGI_CONTROL_SUMMARY_V377;
          if(!api)throw new Error('summary API missing');
          const majority=['大野 竜暉','坂田 暉馬','中嶋 玲月','嶋田 栄志','大久保 陽翔','鰐渕 将太','橋向 結都','武澤 大翔','武田 晴琉翔'];
          const casper=['大野 竜暉','坂田 暉馬','嶋田 栄志','中嶋 玲月','大久保 陽翔','橋向 結都','鰐渕 将太','大久保 夢翔','武田 晴琉翔'];
          const players=[...new Set([...majority,...casper])].map((name,i)=>({name,batting:{AB:String(15+i),AVG:name==='中嶋 玲月'?'.542':'.300',OPS:name==='中嶋 玲月'?'1.268':'.800'}}));
          const result={
            case:{question:'ベストオーダーは？',evidence:{teamPolicy:{sampleSize:{practicalBattingAtBatsSufficient:15}},numericEvidenceContract:{recentSixNumbersProvided:false},recentSix:{status:'INCOMPLETE'},allCurrentTeamCheck:{players}}},
            primary:{
              melchior:{candidatePlayers:majority},balthasar:{candidatePlayers:majority},casper:{candidatePlayers:casper}
            },
            second:{
              melchior:{persona:'MELCHIOR-1',candidatePlayers:majority,candidateBasis:'今季通算の出塁とOPS、上位から中軸へのつながりを重視する。'},
              balthasar:{persona:'BALTHASAR-2',candidatePlayers:majority,candidateBasis:'得点につなげる上位と中軸の並びを優先し、この打順を維持する。'},
              casper:{persona:'CASPER-3',candidatePlayers:casper,candidateBasis:'中軸の役割分担と全体の起用バランスを優先する。'}
            },
            final:{mode:'FULL_LINEUP',lineup:majority.map((name,i)=>({slot:i+1,name})),reDeliberationConditions:[
              '各選手の対右投手・対左投手別の詳細な打撃成績',
              '現チームの打数がまだ10打数台の選手が多く、母数の蓄積が必要',
              '今季通算のOPSが大きく変化した場合'
            ]}
          };
          const s=api.build(result);
          if(s?.label!=='2対1 MAJORITY')throw new Error('majority label failed: '+JSON.stringify(s));
          if(s?.minorityPersona!=='CASPER')throw new Error('minority preservation failed');
          if(!String(s?.mainDisagreement).includes('4番'))throw new Error('major disagreement did not prioritize 4th slot');
          const conditions=(s?.reDeliberationConditions||[]).join(' ');
          if(/対右|対左|左右|相手投手|母数|10打数台/.test(conditions))throw new Error('forbidden reconsideration condition survived: '+conditions);
          const corrected=api.sanitizeSpeech('メルキオール、直近で中嶋 玲月が打率.542・OPS 1.268を記録している。',result);
          if(!corrected.includes('今季通算')||corrected.includes('直近で'))throw new Error('current/recent label correction failed: '+corrected);
          if((s.decisiveReasons||[]).some(x=>/1番[\s\S]*9番/.test(x)))throw new Error('lineup recital leaked into reasons');
          console.log('DETERMINISTIC CONTROL SUMMARY POLICY: PASS');
          NODE

      - name: Verify staff Evidence access and coach parsing deterministically
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {staffEvidenceAccessDecision} from './server/api/magi/_staff-evidence-access.js';
          import {buildCoachObservationEvidence} from './server/api/magi/_coach-observation-evidence.js';
          import {buildParentObservationEvidence} from './server/api/magi/_parent-observation-evidence.js';
          import {buildNormalizedObservationEvidence} from './server/api/magi/_normalized-observation-evidence.js';
          const sourceId='15_dUUu6V2okcjHo-0Wnrgqrb9LbGvTBSs_0B66v3NWM';
          const meta={id:sourceId,name:'《MAGI》指導者向け情報提供フォーム（回答）',mimeType:'application/vnd.google-apps.spreadsheet',modifiedTime:'2026-09-20T11:23:37Z'};
          const csv=[
            'タイムスタンプ,情報提供者,選手名,「何を伝えたいですか？」,「何がありましたか？」,さらに残しておきたいことがあればお願いします',
            '2026/09/20 19:57:58,近藤先生,橋向 結都,投手,制球が安定し長いイニングを任せられる,',
            '2026/09/20 20:05:15,近藤先生,坂田 暉馬,投手,最近、投手としては制球が安定しない。無理をさせるよりも、内野守備に専念する方がいい方向に向かう気がする。,',
            '2026/09/20 20:23:37,大久保さん,大久保 陽翔,打撃,左打席の内容が改善した,'
          ].join('\n');
          const allow=staffEvidenceAccessDecision({role:'admin',purpose:'DELIBERATION',sourceType:'COACH_OBSERVATION'});
          const deny=staffEvidenceAccessDecision({role:'member',purpose:'DELIBERATION',sourceType:'COACH_OBSERVATION'});
          if(!allow.allowed||deny.allowed)throw new Error('staff access gate failed');
          const packet=await buildCoachObservationEvidence({
            players:['坂田 暉馬'],
            accessContext:{role:'coach',purpose:'DELIBERATION'},
            metadataProvider:async()=>meta,
            sheetCsvProvider:async()=>csv
          });
          if(packet.status!=='COMPLETE'||packet.observations.length!==1)throw new Error('coach parse failed');
          const obs=packet.observations[0];
          if(obs.player!=='坂田 暉馬'||obs.lineage.sourceRow!==3)throw new Error('coach lineage row failed: '+JSON.stringify(obs));
          if(obs.statementClass!=='OBSERVATION_WITH_OPINION')throw new Error('coach statement classification failed');
          let blocked=false;
          try{
            await buildCoachObservationEvidence({players:['坂田 暉馬'],accessContext:{role:'member',purpose:'DELIBERATION'},metadataProvider:async()=>{throw new Error('metadata must not be reached')}});
          }catch(e){blocked=e?.code==='STAFF_EVIDENCE_ACCESS_DENIED';}
          if(!blocked)throw new Error('member access was not blocked before source read');
          const parentMeta={id:'parent',name:'《MAGI》保護者向け情報提供フォーム（回答）',mimeType:'application/vnd.google-apps.spreadsheet'};
          const parentCsv=['タイムスタンプ,あなたの立場,気づいた選手を選んでください,いつ頃のことですか？,どんな場面でしたか？,実際にどんなことがありましたか？,どんな部分に成長や良さを感じましたか？,この出来事を一言で表すとしたら？（任意）,《MAGI》に補足しておきたいこと,お名前(任意)','2026-09-13 15:01:42,2年生保護者,大野 竜暉,9月12日,試合,精神的な成長を感じた,姿勢,,,'].join('\n');
          const parentPacket=await buildParentObservationEvidence({players:['大野 竜暉'],accessContext:{role:'admin',purpose:'DELIBERATION'},metadataProvider:async()=>parentMeta,sheetCsvProvider:async()=>parentCsv});
          if(parentPacket.observations.length!==1||parentPacket.observations[0].lineage.independentVote!==true)throw new Error('parent observation parse/lineage failed');
          const ledgerMeta={id:'ledger',name:'《MAGI》指導者・保護者 観察情報統合台帳',mimeType:'application/vnd.google-apps.spreadsheet'};
          const ledgerCsv=['記録日時,情報源,情報提供者,立場,対象,時期,場面・種別,原文・観察内容,成長・評価観点,一言タグ,補足,MAGI取扱区分','2026-09-13 15:01:42,保護者,,2年生保護者,大野 竜暉,9月12日,試合,精神的な成長を感じた,姿勢,,,PARENT OBSERVATION'].join('\n');
          const ledgerPacket=await buildNormalizedObservationEvidence({players:['大野 竜暉'],accessContext:{role:'coach',purpose:'DELIBERATION'},metadataProvider:async()=>ledgerMeta,sheetCsvProvider:async()=>ledgerCsv});
          const n=ledgerPacket.observations[0];
          if(!n||n.lineage.independentVote!==false||n.lineage.derivedFrom!=='PARENT_OBSERVATION')throw new Error('normalized lineage dedupe failed');
          if(staffEvidenceAccessDecision({role:'member',purpose:'DELIBERATION',sourceType:'PARENT_OBSERVATION'}).allowed)throw new Error('member parent observation access leaked');
          console.log('STAFF EVIDENCE ACCESS + COACH/PARENT/NORMALIZED PARSING: PASS');
          NODE

      - name: Wait for production deployment
        run: sleep 45

      - name: Verify canonical click ownership guard
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -sS https://magi-web.vercel.app/ -o /tmp/index.html
          grep -Fq '/drive-server-v293.js?v=301' /tmp/index.html
          curl -L --fail -sS https://magi-web.vercel.app/drive-server-v293.js?v=301 -o /tmp/drive-server.js
          grep -Fq "if(typeof window.MAGI_SEMANTIC_RUN_V2==='function')return;" /tmp/drive-server.js
          grep -Fq '/stats-direct-click-v314.js?v=318' /tmp/index.html
          curl -L --fail -sS 'https://magi-web.vercel.app/stats-direct-click-v314.js?v=318' -o /tmp/stats-direct-click.js
          grep -Fq "if(typeof window.MAGI_SEMANTIC_RUN_V2==='function')return;" /tmp/stats-direct-click.js
          grep -Fq '/magi-app-bootstrap-v363.js?v=381' /tmp/index.html
          curl -L --fail -sS 'https://magi-web.vercel.app/magi-app-bootstrap-v363.js?v=381' -o /tmp/bootstrap.js
          curl -L --fail -sS 'https://magi-web.vercel.app/main-live-answer-v362.js?v=381' -o /tmp/main-live-answer-check.js
          grep -Fq "window.MAGI_SEMANTIC_RUN_V2(b)" /tmp/bootstrap.js
          grep -Fq "entry:'BOOTSTRAP_CAPTURE_SEMANTIC_V2'" /tmp/bootstrap.js
          ! grep -Fq "window.addEventListener('click',event=>{const btn=mainButton" /tmp/main-live-answer-check.js
          grep -Fq 'MAGI_LAST_SEMANTIC_EXECUTION' /tmp/main-live-answer-check.js

          grep -Fq '/stats-server-bridge-v315.js?v=319' /tmp/index.html
          grep -Fq '/pitching-direct-report-v317.js?v=330' /tmp/index.html
          curl -L --fail -sS https://magi-web.vercel.app/stats-server-bridge-v315.js?v=319 -o /tmp/stats-bridge.js
          curl -L --fail -sS https://magi-web.vercel.app/pitching-direct-report-v317.js?v=330 -o /tmp/pitching-report.js
          curl -L --fail -sS https://magi-web.vercel.app/main-live-answer-v362.js?v=381 -o /tmp/main-live-answer-check.js
          grep -Fq "typeof window.MAGI_SEMANTIC_RUN_V2==='function'" /tmp/stats-bridge.js
          grep -Fq "typeof window.MAGI_SEMANTIC_RUN_V2==='function'" /tmp/pitching-report.js

          curl -L --fail -sS https://magi-web.vercel.app/fielding-direct-report-v329.js?v=329 -o /tmp/fielding-report.js
          grep -Fq "fetch('/api/magi/fielding-report'" /tmp/fielding-report.js
          grep -Fq 'window.MAGI_RUN_FIELDING_REPORT=runReport' /tmp/fielding-report.js
          grep -Fq "waitFor('MAGI_PITCH_DIRECT_FN')" /tmp/main-live-answer-check.js
          grep -Fq 'magiClarifyModalV362' /tmp/main-live-answer-check.js
          grep -Fq 'MAGIから確認' /tmp/main-live-answer-check.js
          grep -Fq 'resolveClarification' /tmp/main-live-answer-check.js
          grep -Fq 'r=await requestCore(originalQuestion)' /tmp/main-live-answer-check.js
          grep -Fq "contextPush('assistant',txt(r?.clarificationQuestion||r?.answer))" /tmp/main-live-answer-check.js
          grep -Fq "contextPush('user',answer)" /tmp/main-live-answer-check.js
          grep -Fq 'turn<3' /tmp/main-live-answer-check.js
          echo 'PRODUCTION CLARIFY MODAL CONTRACT: PASS'
          echo 'CANONICAL CLICK OWNERSHIP: PASS'

      - name: Verify natural evaluation routing contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "from './_evaluation-routing.js'" server/api/magi/core.js
          grep -Fq '弱点|強み|問題' server/api/magi/_evaluation-routing.js
          grep -Fq 'playerEvaluation=' server/api/magi/_evaluation-routing.js
          grep -Fq 'クローザー|抑え|スタメン' server/api/magi/_evaluation-routing.js
          grep -Fq 'return teamChange||playerEvaluation||observation' server/api/magi/_evaluation-routing.js
          grep -Fq 'CURRENT_MASTER_NATURAL_TEAM_REVIEW' server/api/magi/core.js
          grep -Fq "reviewKind:'TEAM_REVIEW'" server/api/magi/core.js
          grep -Fq 'CURRENT_MASTER_NATURAL_PLAYER_REVIEW' server/api/magi/core.js
          grep -Fq "reviewKind:'PLAYER_REVIEW'" server/api/magi/core.js
          grep -Fq 'buildAppearanceDetailEvidence({focusPlayer})' server/api/magi/core.js
          grep -Fq 'const requestedNames=focusPlayer?' server/api/magi/_appearance-detail-evidence.js
          grep -Fq "if (!naturalPlayerReview && !resolution?.requestedDocument && focusNames.length" server/api/magi/core.js
          echo 'NATURAL TEAM/PLAYER EVALUATION ROUTING: PASS'

      - name: Verify production bootstrap and live master Evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/" -o /tmp/index.html
          grep -Fq '/magi-app-bootstrap-v363.js?v=381' /tmp/index.html
          grep -Fq '/chat-ui-canonical-v387.js?v=387' /tmp/index.html
          echo 'PRODUCTION BOOTSTRAP ASSETS: PASS'

          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/api/magi-selection-live-selftest" -o /tmp/selection.json
          cat /tmp/selection.json; echo
          jq -r '"COACH DIAGNOSTIC: adminStatus=\(.adminCoachObservationStatus) adminError=\(.adminCoachObservationError) adminHttp=\(.adminCoachObservationHttpStatus) memberStatus=\(.memberCoachObservationStatus) memberError=\(.memberCoachObservationError) memberHttp=\(.memberCoachObservationHttpStatus)"' /tmp/selection.json
          jq -e '.ok==true and .fullLineupReady==true and .adminNormalizedObservationReady==true and .memberNormalizedObservationBlocked==true and .adminNormalizedObservationStatus=="COMPLETE" and .memberNormalizedObservationStatus!="COMPLETE" and .closerPitchingReady==true and .adminCoachEvidenceReady==true and .memberCoachEvidenceBlocked==true and .adminCoachObservationStatus=="COMPLETE" and .memberCoachObservationStatus!="COMPLETE" and .selectionKind=="FULL_LINEUP" and .rosterExact==true and .count==14 and .playersWithCoreBatting==14 and .textHasCurrentNumbers==true and (.sourceName|contains("2026-2027"))' /tmp/selection.json >/dev/null
          echo 'PRODUCTION LIVE NUMERIC MASTER EVIDENCE: PASS'
