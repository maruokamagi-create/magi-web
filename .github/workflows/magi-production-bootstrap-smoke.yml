name: MAGI Production Browser Bootstrap Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'chat-ui-v196.js'
      - 'magi-app-bootstrap-v363.js'
      - 'deliberation-integrity-v348.js'
      - 'magi-formal-runner-v373.js'
      - 'magi-core-client-guard-v363.js'
      - 'main-live-answer-v362.js'
      - 'magi-ui-runner-guard-v359.js'
      - 'lineup-finalizer-v350.js'
      - 'engine-progress-v358.js'
      - 'server/api/magi/_canonical-cache.js'
      - 'server/api/magi/_gemini.js'
      - 'server/api/magi/_semantic-authority.js'
      - 'api/magi-gateway.js'
      - 'api/magi-selection-live-selftest.js'
      - '.github/workflows/magi-production-bootstrap-smoke.yml'
  workflow_dispatch:

jobs:
  production-browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static canonical architecture guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/magi-app-bootstrap-v363.js?v=375' index.html
          grep -q '/chat-ui-v196.js?v=208' index.html
          ! grep -q 'magi-formal-hotfix-v369.js' index.html
          grep -q "const REV='375'" magi-app-bootstrap-v363.js
          grep -q 'MAGI_DELIBERATION_SERIAL_V374' deliberation-integrity-v348.js
          grep -q '1.1.2-serial-integrity' deliberation-integrity-v348.js
          ! grep -q 'Promise.all(jobs)' deliberation-integrity-v348.js
          grep -q 'magi-formal-runner-v373.js' magi-app-bootstrap-v363.js
          ! grep -q 'magi-formal-runner-v358.js' magi-app-bootstrap-v363.js
          ! grep -q 'magi-ui-truth-v363.js' magi-app-bootstrap-v363.js
          grep -q 'structuredValidationOnly:true' magi-formal-runner-v373.js
          grep -q 'proseBlocking:false' magi-formal-runner-v373.js
          grep -q "version:'formal-runner-v373-single-path'" magi-formal-runner-v373.js
          grep -Fq "function who(t){t=String(t||'').toUpperCase();if(t.includes('MAGI CONTROL'))return P.CONTROL;if(t.includes('MELCHIOR'))return P.MELCHIOR" chat-ui-v196.js
          grep -Fq 'function controlTargetFor(speaker)' chat-ui-v196.js
          grep -Fq 'function controlSpeechFor(speech,target)' chat-ui-v196.js
          grep -Fq 'displaySpeech=isControl?controlSpeechFor(speech,controlTarget):speech' chat-ui-v196.js
          grep -Fq 'senderMeta=isControl?(controlTarget?`→ ${controlTarget.jp}`' chat-ui-v196.js
          grep -Fq '#magiChatView .magiTarget{display:none!important}' chat-ui-v196.js
          grep -Fq 'function scrubRedundantTargetLabels(root=document)' chat-ui-v196.js
          grep -Fq 'new MutationObserver(()=>scrubRedundantTargetLabels(box))' chat-ui-v196.js
          grep -Fq 'function finalSummaryText()' chat-ui-v196.js
          grep -Fq "addPhase(body,'最終総括')" chat-ui-v196.js
          grep -Fq 'MAGI CONTROL<span>最終総括</span>' chat-ui-v196.js
          ! grep -Fq '宛先：' chat-ui-v196.js
          grep -q "CACHE_VERSION = 'magi-canonical-v4'" server/api/magi/_canonical-cache.js
          grep -q "VOLATILE_KEYS" server/api/magi/_canonical-cache.js
          grep -Fq 'error?.timedOut === true' server/api/magi/_gemini.js
          grep -Fq "semantic-authority-v2-resilient-gemini-first" server/api/magi/_semantic-authority.js
          grep -Fq "semanticAuthority:'SAFE_EMERGENCY_FALLBACK'" server/api/magi/_semantic-authority.js
          grep -Fq "selectionKind:'FULL_LINEUP'" server/api/magi/_semantic-authority.js
          grep -Fq "function answerComplete(label='MAGI 回答完了')" engine-progress-v358.js
          grep -Fq "if(/回答完了/.test(t))return{answerDone:true,label:'MAGI 回答完了'}" engine-progress-v358.js
          ! grep -Fq '/回答完了|審議完了/' engine-progress-v358.js
          ! grep -q 'function evidenceCritical' lineup-finalizer-v350.js
          echo 'CANONICAL V375 + RESILIENT SEMANTIC + PROGRESS FIX: PASS'

      - name: Wait for production deployment
        run: sleep 45

      - name: Verify production serialized bootstrap and live master Evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/" -o /tmp/index.html
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/chat-ui-v196.js?v=208" -o /tmp/chat-ui.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-app-bootstrap-v363.js?v=375" -o /tmp/bootstrap.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/deliberation-integrity-v348.js?v=375" -o /tmp/integrity.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-formal-runner-v373.js?v=375" -o /tmp/formal.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-core-client-guard-v363.js?v=375" -o /tmp/core-guard.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/main-live-answer-v362.js?v=375" -o /tmp/semantic.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/engine-progress-v358.js?v=375" -o /tmp/progress.js

          grep -Fq '/magi-app-bootstrap-v363.js?v=375' /tmp/index.html
          grep -Fq '/chat-ui-v196.js?v=208' /tmp/index.html
          ! grep -Fq 'magi-formal-hotfix-v369.js' /tmp/index.html
          grep -Fq "function who(t){t=String(t||'').toUpperCase();if(t.includes('MAGI CONTROL'))return P.CONTROL;if(t.includes('MELCHIOR'))return P.MELCHIOR" /tmp/chat-ui.js
          grep -Fq 'function controlTargetFor(speaker)' /tmp/chat-ui.js
          grep -Fq 'function controlSpeechFor(speech,target)' /tmp/chat-ui.js
          grep -Fq 'displaySpeech=isControl?controlSpeechFor(speech,controlTarget):speech' /tmp/chat-ui.js
          grep -Fq 'senderMeta=isControl?(controlTarget?`→ ${controlTarget.jp}`' /tmp/chat-ui.js
          grep -Fq '#magiChatView .magiTarget{display:none!important}' /tmp/chat-ui.js
          grep -Fq 'function scrubRedundantTargetLabels(root=document)' /tmp/chat-ui.js
          grep -Fq 'new MutationObserver(()=>scrubRedundantTargetLabels(box))' /tmp/chat-ui.js
          grep -Fq 'function finalSummaryText()' /tmp/chat-ui.js
          grep -Fq "addPhase(body,'最終総括')" /tmp/chat-ui.js
          grep -Fq 'MAGI CONTROL<span>最終総括</span>' /tmp/chat-ui.js
          ! grep -Fq '宛先：' /tmp/chat-ui.js
          grep -Fq 'magiMsg ${isControl?' /tmp/chat-ui.js
          grep -Fq "const REV='375'" /tmp/bootstrap.js
          grep -Fq 'MAGI_DELIBERATION_SERIAL_V374' /tmp/integrity.js
          grep -Fq '1.1.2-serial-integrity' /tmp/integrity.js
          ! grep -Fq 'Promise.all(jobs)' /tmp/integrity.js
          grep -Fq 'magi-formal-runner-v373.js' /tmp/bootstrap.js
          ! grep -Fq 'magi-formal-runner-v358.js' /tmp/bootstrap.js
          ! grep -Fq 'magi-ui-truth-v363.js' /tmp/bootstrap.js
          grep -Fq "version:'canonical-app-v375'" /tmp/bootstrap.js
          grep -Fq 'V373_SINGLE_PATH' /tmp/bootstrap.js
          grep -Fq 'structuredValidationOnly:true' /tmp/formal.js
          grep -Fq 'proseBlocking:false' /tmp/formal.js
          grep -Fq "const VERSION='363'" /tmp/core-guard.js
          grep -Fq 'DATA HUB 正本データ（サーバー取得）' /tmp/semantic.js
          grep -Fq "function answerComplete(label='MAGI 回答完了')" /tmp/progress.js
          grep -Fq "if(/回答完了/.test(t))return{answerDone:true,label:'MAGI 回答完了'}" /tmp/progress.js
          echo 'PRODUCTION CANONICAL V375 + RESILIENT SEMANTIC + PROGRESS FIX: PASS'

          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/api/magi-selection-live-selftest" -o /tmp/selection.json
          cat /tmp/selection.json; echo
          jq -e '.ok==true and .fullLineupReady==true and .selectionKind=="FULL_LINEUP" and .rosterExact==true and .count==14 and .playersWithCoreBatting==14 and .textHasCurrentNumbers==true and (.sourceName|contains("2026-2027"))' /tmp/selection.json >/dev/null
          echo 'PRODUCTION LIVE NUMERIC MASTER EVIDENCE: PASS'
