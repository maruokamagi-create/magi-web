name: MAGI Production Browser Bootstrap Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'magi-app-bootstrap-v362.js'
      - 'main-live-answer-v362.js'
      - 'magi-ui-runner-guard-v359.js'
      - 'magi-ui-truth-v359.js'
      - 'magi-formal-runner-v358.js'
      - 'engine-progress-v358.js'
      - 'api/magi-gateway.js'
      - 'api/magi-selection-live-selftest.js'
      - '.github/workflows/magi-production-bootstrap-smoke.yml'
  workflow_dispatch:

jobs:
  production-browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deployment
        run: sleep 45

      - name: Verify v362 authoritative Evidence rendering and fail-closed execution
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/" -o /tmp/index.html
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-app-bootstrap-v362.js?v=362" -o /tmp/bootstrap.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/main-live-answer-v362.js?v=362" -o /tmp/semantic.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-ui-truth-v359.js?v=362" -o /tmp/ui-truth.js
          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/magi-formal-runner-v358.js?v=362" -o /tmp/formal.js

          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/index.html','utf8');
          const boot=fs.readFileSync('/tmp/bootstrap.js','utf8');
          const semantic=fs.readFileSync('/tmp/semantic.js','utf8');
          const uiTruth=fs.readFileSync('/tmp/ui-truth.js','utf8');
          const formal=fs.readFileSync('/tmp/formal.js','utf8');
          const gateway=fs.readFileSync('api/magi-gateway.js','utf8');

          const loader=html.indexOf('/loader-v130.js?v=294');
          const legacyLast=html.indexOf('/print-preview-return-v330.js?v=330');
          const canonical=html.indexOf('/magi-app-bootstrap-v362.js?v=362');
          if(loader<0||legacyLast<0||canonical<0||!(loader<legacyLast&&legacyLast<canonical))throw new Error('v362 bootstrap is not after all legacy scripts');
          const afterCanonical=html.slice(canonical + '/magi-app-bootstrap-v362.js?v=362'.length);
          if(/<script\s+src=/.test(afterCanonical))throw new Error('a runtime script is loaded after canonical bootstrap');
          if(html.includes('/magi-app-bootstrap-v361.js'))throw new Error('obsolete v361 bootstrap still loaded');

          if(!boot.includes("version:'canonical-app-v362'"))throw new Error('v362 runtime marker missing');
          if(!boot.includes("entry:'WINDOW_CAPTURE_SEMANTIC_V2'"))throw new Error('v362 semantic owner marker missing');
          if(!boot.includes('authoritativeEvidenceVisible:true'))throw new Error('authoritative Evidence display marker missing');
          if(!boot.includes('/main-live-answer-v362.js'))throw new Error('v362 semantic entry not loaded');
          if(boot.includes('/main-live-answer-v329.js'))throw new Error('old semantic entry still loaded by canonical bootstrap');

          if(!semantic.includes("const CLIENT_VERSION='362'"))throw new Error('v362 client version missing');
          if(!semantic.includes("const RUNTIME_VERSION='362'"))throw new Error('v362 runtime version missing');
          if(!semantic.includes("'X-MAGI-Client-Version':CLIENT_VERSION"))throw new Error('client version header missing');
          if(!semantic.includes("'X-MAGI-Runtime-Version':RUNTIME_VERSION"))throw new Error('runtime version header missing');
          if(!semantic.includes('window.addEventListener(\'click\''))throw new Error('window-capture semantic owner missing');
          if(!semantic.includes('DATA HUB 正本データ（サーバー取得）'))throw new Error('authoritative Evidence renderer missing');
          if(!semantic.includes("DATA HUB：14件参照"))throw new Error('14-player visible DATA HUB assertion missing');
          if(!semantic.includes('players.every'))throw new Error('14-player visible Evidence assertion missing');
          if(!semantic.includes('打率|AVG')||!semantic.includes('OPS'))throw new Error('visible batting metric assertion missing');

          if(!uiTruth.includes('DATA_HUB_UI_MISMATCH'))throw new Error('UI truth guard missing');
          if(!formal.includes('NUMERIC_EVIDENCE_RESULT_INVALID'))throw new Error('numeric result guard missing');
          if(!gateway.includes('MIN_CORE_CLIENT_VERSION = 362'))throw new Error('server client gate is not v362');
          if(!gateway.includes('MIN_RUNTIME_VERSION = 362'))throw new Error('server runtime gate is not v362');

          console.log('V362 AUTHORITATIVE EVIDENCE UI + STALE CLIENT FAIL-CLOSED: PASS');
          NODE

          curl -L --fail --retry 3 --retry-delay 3 -sS "$BASE/api/magi-selection-live-selftest" -o /tmp/selection.json
          cat /tmp/selection.json; echo
          jq -e '.ok==true and .fullLineupReady==true and .selectionKind=="FULL_LINEUP" and .rosterExact==true and .count==14 and .playersWithCoreBatting==14 and .textHasCurrentNumbers==true and (.sourceName|contains("2026-2027"))' /tmp/selection.json >/dev/null
          echo 'PRODUCTION V362 + LIVE NUMERIC MASTER EVIDENCE: PASS'
