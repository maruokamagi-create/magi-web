name: MAGI Development Continuity Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate development continuity ledger
        env:
          MAGI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAGI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/magi-continuity-guard.mjs
