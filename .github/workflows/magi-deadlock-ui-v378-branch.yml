name: MAGI DEADLOCK UI V378 Branch Guard

on:
  push:
    branches:
      - safe/deadlock-ui-v378
    paths:
      - 'final-decision-emphasis-v340.js'
      - 'index.html'
      - 'scripts/test-deadlock-ui-v378.mjs'
      - '.github/workflows/magi-deadlock-ui-v378-branch.yml'

jobs:
  deadlock-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check final-decision-emphasis-v340.js
      - name: DEADLOCK presentation regression
        run: node scripts/test-deadlock-ui-v378.mjs
      - name: Confirm normal decision wording preserved
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "verdict:'結論未成立'" final-decision-emphasis-v340.js
          grep -Fq "title:'参考案（未確定）'" final-decision-emphasis-v340.js
          grep -Fq "verdict:'最終ベストオーダー'" final-decision-emphasis-v340.js
          grep -Fq "title:'公式戦想定 ベストオーダー'" final-decision-emphasis-v340.js
          grep -Fq '/final-decision-emphasis-v340.js?v=378' index.html
          echo 'SAFE DEADLOCK-ONLY DISPLAY CHANGE: PASS'
