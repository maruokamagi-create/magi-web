name: MAGI Question Understanding Selftest

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/_semantic-request.js'
      - 'api/magi-question-selftest.js'
      - 'server/api/magi/_semantic-postguard.js'
      - 'server/api/magi/_attachment-request.js'
      - 'server/api/magi/core.js'
      - 'api/magi-question-selftest.js'
      - 'api/magi-attachment-selftest.js'
      - 'server/api/magi/_question-router.js'
      - 'server/api/magi/_question-router-current.js'
      - 'server/api/magi/_roster.js'
      - 'stats-server-bridge-v315.js'
      - 'best-order-evidence-v268.js'
      - 'server/api/magi/_appearance-detail-evidence.js'
      - '.github/workflows/magi-question-selftest.yml'
  workflow_dispatch:

jobs:
  production-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Vercel production deployment
        shell: bash
        run: |
          set -e
          TEXT_URL='https://magi-web.vercel.app/api/magi-question-selftest?batch=12'
          MEDIA_URL='https://magi-web.vercel.app/api/magi-attachment-selftest'
          for i in $(seq 1 60); do
            text_code=$(curl -L -sS -o /tmp/text-probe.json -w '%{http_code}' "$TEXT_URL" || true)
            media_code=$(curl -L -sS -o /tmp/media-probe.json -w '%{http_code}' "$MEDIA_URL" || true)
            text_ready=false
            media_ready=false
            if [ "$text_code" = "200" ] && jq -e '.results[] | select(.id == 65 and .pass == true and (.semanticVersion | contains("postguard-v4")))' /tmp/text-probe.json >/dev/null 2>&1 && curl -L -sS 'https://magi-web.vercel.app/api/magi-question-selftest?batch=16' | jq -e '.results[] | select(.id == 86 and .pass == true and .mode == "CLARIFY" and .preflightApplied == true)' >/dev/null 2>&1; then text_ready=true; fi
            if [ "$media_code" = "200" ] && jq -e '.version == "attachment-request-v1" and .total == 5 and .passed == 5' /tmp/media-probe.json >/dev/null 2>&1; then media_ready=true; fi
            generated_ready=false
            generated_code=$(curl -L -sS -o /tmp/generated-probe.json -w '%{http_code}' 'https://magi-web.vercel.app/api/magi-question-selftest?suite=10000&batch=0' || true)
            if [ "$generated_code" = "200" ] && jq -e '.total == 10000 and (.results | type == "array") and (.results | length == 100) and (.results[99].id == 100)' /tmp/generated-probe.json >/dev/null 2>&1; then generated_ready=true; fi
            if [ "$text_ready" = true ] && [ "$media_ready" = true ] && [ "$generated_ready" = true ]; then
              echo "Latest production selftest endpoints are ready."
              exit 0
            fi
            echo "Waiting for latest deployment... attempt $i, text HTTP $text_code, media HTTP $media_code"
            sleep 10
          done
          echo 'Latest production endpoints did not become ready.'
          cat /tmp/text-probe.json || true
          cat /tmp/media-probe.json || true
          exit 1

      - name: Run 95 production semantic cases
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/all-results.ndjson
          for batch in $(seq 0 18); do
            echo "=== batch $batch ==="
            curl -L --fail --retry 2 --retry-delay 3 -sS "https://magi-web.vercel.app/api/magi-question-selftest?batch=$batch" -o "/tmp/batch-$batch.json"
            cat "/tmp/batch-$batch.json"
            echo
            jq -c '.results[]' "/tmp/batch-$batch.json" >> /tmp/all-results.ndjson
          done
          total=$(wc -l < /tmp/all-results.ndjson | tr -d ' ')
          failed=$(jq -s '[.[] | select(.pass != true)] | length' /tmp/all-results.ndjson)
          passed=$((total-failed))
          echo "TEXT RESULT: ${passed}/${total} PASS, ${failed} FAIL"
          if [ "$failed" -ne 0 ]; then
            echo 'FAILED TEXT CASES:'
            jq -s -c '.[] | select(.pass != true)' /tmp/all-results.ndjson
            exit 1
          fi

      - name: Run 10000 generated question-routing cases
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/generated-results.ndjson
          for batch in $(seq 0 99); do
            echo "=== generated batch $batch ==="
            curl -L --fail --retry 2 --retry-delay 2 -sS "https://magi-web.vercel.app/api/magi-question-selftest?suite=10000&batch=$batch" -o "/tmp/generated-$batch.json"
            if ! jq -e '.results | type == "array"' "/tmp/generated-$batch.json" >/dev/null 2>&1; then
              echo "INVALID GENERATED RESPONSE batch=$batch"
              cat "/tmp/generated-$batch.json"
              exit 1
            fi
            jq -c '.results[]' "/tmp/generated-$batch.json" >> /tmp/generated-results.ndjson
          done
          total=$(wc -l < /tmp/generated-results.ndjson | tr -d ' ')
          failed=$(jq -s '[.[] | select(.pass != true)] | length' /tmp/generated-results.ndjson)
          passed=$((total-failed))
          echo "GENERATED RESULT: ${passed}/${total} PASS, ${failed} FAIL"
          test "$total" -eq 10000
          if [ "$failed" -ne 0 ]; then
            echo 'FIRST FAILED GENERATED CASES:'
            jq -s -c '[.[] | select(.pass != true)][0:50][]' /tmp/generated-results.ndjson
            exit 1
          fi

      - name: Run 5 production attachment understanding cases
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 --retry-delay 3 -sS 'https://magi-web.vercel.app/api/magi-attachment-selftest' -o /tmp/attachment-results.json
          cat /tmp/attachment-results.json
          echo
          jq -e '.ok == true and .passed == 5 and .total == 5 and ([.results[].pass] | all)' /tmp/attachment-results.json >/dev/null
          echo 'ATTACHMENT RESULT: 5/5 PASS'
          echo 'QUESTION UNDERSTANDING RESULT: 100/100 PASS (95 text + 5 attachment routing/safety)'