name: MAGI Question Understanding Selftest

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/_semantic-request.js'
      - 'server/api/magi/_semantic-postguard.js'
      - 'server/api/magi/core.js'
      - 'api/magi-question-selftest.js'
      - '.github/workflows/magi-question-selftest.yml'
  workflow_dispatch:

jobs:
  production-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Vercel production deployment
        shell: bash
        run: |
          set -e
          URL='https://magi-web.vercel.app/api/magi-question-selftest?batch=12'
          for i in $(seq 1 60); do
            code=$(curl -L -sS -o /tmp/probe.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && jq -e '.results[] | select(.id == 65 and .pass == true and (.semanticVersion | contains("postguard-v1")))' /tmp/probe.json >/dev/null 2>&1; then
              echo "Latest production selftest endpoint is ready."
              cat /tmp/probe.json
              exit 0
            fi
            echo "Waiting for latest deployment... attempt $i, HTTP $code"
            sleep 10
          done
          echo 'Latest production endpoint did not become ready.'
          cat /tmp/probe.json || true
          exit 1

      - name: Run 95 production semantic cases
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/all-results.ndjson
          for batch in $(seq 0 18); do
            echo "=== batch $batch ==="
            curl -L --fail --retry 2 --retry-delay 3 -sS "https://magi-web.vercel.app/api/magi-question-selftest?batch=$batch" -o "/tmp/batch-$batch.json"
            cat "/tmp/batch-$batch.json"
            echo
            jq -c '.results[]' "/tmp/batch-$batch.json" >> /tmp/all-results.ndjson
          done
          total=$(wc -l < /tmp/all-results.ndjson | tr -d ' ')
          failed=$(jq -s '[.[] | select(.pass != true)] | length' /tmp/all-results.ndjson)
          passed=$((total-failed))
          echo "RESULT: ${passed}/${total} PASS, ${failed} FAIL"
          if [ "$failed" -ne 0 ]; then
            echo 'FAILED CASES:'
            jq -s -c '.[] | select(.pass != true)' /tmp/all-results.ndjson
            exit 1
          fi