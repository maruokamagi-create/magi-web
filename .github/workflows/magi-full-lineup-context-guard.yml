name: MAGI Full Lineup Context Guard

on:
  push:
    paths:
      - 'server/api/magi/core.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_appearance-fielding-evidence.js'
      - 'server/api/magi/_evidence-source-map.js'
      - 'api/magi-live-deliberation-selftest.js'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
      - 'lineup-reasons-v415.js'
      - 'server/api/magi/_full-lineup.js'
      - 'server/api/magi/_lineup-deadlock-comparison.js'
      - 'server/api/magi/orchestrate.js'
      - 'scripts/test-lineup-deadlock-comparison.mjs'
      - 'scripts/test-no-client-lineup-finalizer.mjs'
      - 'magi-app-bootstrap-v363.js'
      - 'lineup-finalizer-v350.js'
      - 'final-decision-emphasis-v340.js'
      - 'magi-control-summary-v377.js'
      - 'scripts/test-full-lineup-context-evidence-guard.mjs'
      - 'server/api/magi/persona.js'
      - 'server/api/magi/persona-batch.js'
      - 'server/api/magi/_lineup-order-explanation-reconcile.js'
      - 'scripts/test-persona-output-guard.mjs'
      - '.github/workflows/magi-full-lineup-context-guard.yml'
  pull_request:
    paths:
      - 'server/api/magi/core.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_appearance-fielding-evidence.js'
      - 'server/api/magi/_evidence-source-map.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'lineup-reasons-v415.js'
      - 'index.html'
      - 'server/api/magi/_full-lineup.js'
      - 'server/api/magi/_lineup-deadlock-comparison.js'
      - 'server/api/magi/orchestrate.js'
      - 'scripts/test-lineup-deadlock-comparison.mjs'
      - 'scripts/test-no-client-lineup-finalizer.mjs'
      - 'magi-app-bootstrap-v363.js'
      - 'lineup-finalizer-v350.js'
      - 'final-decision-emphasis-v340.js'
      - 'magi-control-summary-v377.js'
      - 'scripts/test-full-lineup-context-evidence-guard.mjs'
      - 'server/api/magi/persona.js'
      - 'server/api/magi/persona-batch.js'
      - 'server/api/magi/_lineup-order-explanation-reconcile.js'
      - 'scripts/test-persona-output-guard.mjs'
      - '.github/workflows/magi-full-lineup-context-guard.yml'

jobs:
  full-lineup-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check lineup evidence path
        run: |
          node --check server/api/magi/core.js
          node --check server/api/magi/_selection-live-evidence.js
          node --check server/api/magi/_appearance-fielding-evidence.js
          node --check api/magi-live-deliberation-selftest.js
          node --check lineup-reasons-v415.js
          node --check server/api/magi/_lineup-deadlock-comparison.js
          node --check server/api/magi/orchestrate.js
      - name: Guard evidence-grounded lineup reasons
        run: |
          grep -Fq 'function evidenceLayers(r,fallback)' lineup-reasons-v415.js
          grep -Fq 'if(!s)return null;' lineup-reasons-v415.js
          grep -Fq '<b>今季通算：</b>' lineup-reasons-v415.js
          grep -Fq '<b>直近6試合：</b>' lineup-reasons-v415.js
          grep -Fq '<b>過去実績：</b>' lineup-reasons-v415.js
          grep -Fq '<b>実起用：</b>' lineup-reasons-v415.js
          grep -Fq '<b>観察Evidence：</b>' lineup-reasons-v415.js
          grep -Fq 'function playerObservationEvidence(name,layers)' lineup-reasons-v415.js
          grep -Fq 'function recordedDisputeHtml(entries,e)' lineup-reasons-v415.js
          grep -Fq 'function deadlockDisputeHtml(r)' lineup-reasons-v415.js
          grep -Fq 'normalizedObservations' server/api/magi/_selection-live-evidence.js
          grep -Fq '<b>守備根拠：</b>' lineup-reasons-v415.js
          grep -Fq '全14名の今季通算・直近6試合・過去実績・実打順/守備起用を主Evidence' lineup-reasons-v415.js
          grep -Fq '3賢人の一致度そのものを打撃Evidenceの代わりにはしません' lineup-reasons-v415.js
          grep -Fq '/lineup-reasons-v415.js?v=425' index.html
          ! grep -Fq '最終${r.total}人中' lineup-reasons-v415.js
          ! grep -Fq '4番は3賢人の一致度を最優先' lineup-reasons-v415.js
      - name: Guard legacy fixed-order Evidence is not loaded
        run: |
          ! grep -Fq '/best-order-evidence-v268.js' index.html
          grep -Fq 'buildBattingOrderSplitEvidence' server/api/magi/_recent-batting-form.js
          grep -Fq 'battingOrderSplits' server/api/magi/_selection-live-evidence.js
      - name: Guard live selftest Evidence parity
        run: |
          ! grep -Fq 'function prepareBrowserEvidence' api/magi-live-deliberation-selftest.js
          ! grep -Fq '現場では大野 竜暉、坂田 暉馬、嶋田 栄志、大久保 陽翔、中嶋 玲月を上位候補' api/magi-live-deliberation-selftest.js
          grep -Fq 'evidence:reinforceEvidence(packet)' api/magi-live-deliberation-selftest.js
          grep -Fq 'async function runStagedTeamReview' api/magi-live-deliberation-selftest.js
          grep -Fq "mode==='teamReview'&&['primary','cross','second','final'].includes(stagedStage)" api/magi-live-deliberation-selftest.js
          grep -Fq "if(stagedStage==='prepare')" api/magi-live-deliberation-selftest.js
          grep -Fq "TEAM_REVIEW_FINAL',{maxAttempts:1}" api/magi-live-deliberation-selftest.js
      - name: Verify fifteen score originals and identity mapping
        run: node scripts/test-score-sheet-registry.mjs
      - name: Verify one-to-one defense bottlenecks against observed BALTHASAR rejection
        run: node scripts/test-full-lineup-defensive-constraints.mjs
      - name: Verify deadlock proposal comparison remains evidence-only and unselected
        run: node scripts/test-lineup-deadlock-comparison.mjs
      - name: Prevent browser from replacing genuine unresolved FULL_LINEUP with invented final
        run: node scripts/test-no-client-lineup-finalizer.mjs
      - name: Check all verified persona-prose recoveries against strict original Evidence
        run: node scripts/test-persona-output-guard.mjs
      - name: Context leakage regression guard
        run: node scripts/test-full-lineup-context-evidence-guard.mjs
