name: MAGI Full Lineup Context Guard

on:
  push:
    paths:
      - 'server/api/magi/core.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_appearance-fielding-evidence.js'
      - 'server/api/magi/_evidence-source-map.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'lineup-reasons-v415.js'
      - 'server/api/magi/_full-lineup.js'
      - 'scripts/test-full-lineup-context-evidence-guard.mjs'
      - '.github/workflows/magi-full-lineup-context-guard.yml'
  pull_request:
    paths:
      - 'server/api/magi/core.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_appearance-fielding-evidence.js'
      - 'server/api/magi/_evidence-source-map.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'lineup-reasons-v415.js'
      - 'index.html'
      - 'server/api/magi/_full-lineup.js'
      - 'scripts/test-full-lineup-context-evidence-guard.mjs'
      - '.github/workflows/magi-full-lineup-context-guard.yml'

jobs:
  full-lineup-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check lineup evidence path
        run: |
          node --check server/api/magi/core.js
          node --check server/api/magi/_selection-live-evidence.js
          node --check server/api/magi/_appearance-fielding-evidence.js
          node --check api/magi-live-deliberation-selftest.js
          node --check lineup-reasons-v415.js
      - name: Guard evidence-grounded lineup reasons
        run: |
          grep -Fq 'function evidenceLayers(r,fallback)' lineup-reasons-v415.js
          grep -Fq 'if(!s)return null;' lineup-reasons-v415.js
          grep -Fq '<b>今季通算：</b>' lineup-reasons-v415.js
          grep -Fq '<b>直近6試合：</b>' lineup-reasons-v415.js
          grep -Fq '<b>過去実績：</b>' lineup-reasons-v415.js
          grep -Fq '<b>実起用：</b>' lineup-reasons-v415.js
          grep -Fq '<b>観察Evidence：</b>' lineup-reasons-v415.js
          grep -Fq 'function playerObservationEvidence(name,layers)' lineup-reasons-v415.js
          grep -Fq 'normalizedObservations' server/api/magi/_selection-live-evidence.js
          grep -Fq '<b>守備根拠：</b>' lineup-reasons-v415.js
          grep -Fq '全14名の今季通算・直近6試合・過去実績・実打順/守備起用を主Evidence' lineup-reasons-v415.js
          grep -Fq '3賢人の一致度そのものを打撃Evidenceの代わりにはしません' lineup-reasons-v415.js
          grep -Fq '/lineup-reasons-v415.js?v=420' index.html
          ! grep -Fq '最終${r.total}人中' lineup-reasons-v415.js
          ! grep -Fq '4番は3賢人の一致度を最優先' lineup-reasons-v415.js
      - name: Guard live selftest Evidence parity
        run: |
          ! grep -Fq 'function prepareBrowserEvidence' api/magi-live-deliberation-selftest.js
          ! grep -Fq '現場では大野 竜暉、坂田 暉馬、嶋田 栄志、大久保 陽翔、中嶋 玲月を上位候補' api/magi-live-deliberation-selftest.js
          grep -Fq 'evidence:reinforceEvidence(packet)' api/magi-live-deliberation-selftest.js
      - name: Context leakage regression guard
        run: node scripts/test-full-lineup-context-evidence-guard.mjs
