name: MAGI Answer Quality Selftest

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/health.js'
      - 'server/api/magi/_gemini.js'
      - '.github/workflows/magi-answer-quality-selftest.yml'
  workflow_dispatch:

jobs:
  authoritative-answer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run authoritative and guardrail answer cases
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app/api/magi/health'
          ORIGIN='https://magi-web.vercel.app'
          call_case(){
            id="$1"; payload="$2"; out="/tmp/${id}.json"
            curl -L --fail --retry 2 --retry-delay 2 -sS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d "$payload" "$BASE" -o "$out"
            cat "$out"; echo
            jq -e '.ok == true and (.answerEngineVersion == "fixture-answer-v1")' "$out" >/dev/null
          }
          require_text(){ id="$1"; shift; for must in "$@"; do jq -e --arg x "$must" '(.answer // "") | contains($x)' "/tmp/${id}.json" >/dev/null || { echo "$id missing: $must"; exit 1; }; done; }

          call_case A01 '{"mode":"ANSWER_FIXTURE","question":"新チームの陽翔のOPS教えて","route":"BATTING_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2026-2027.pdf","scope":"R8.8.2-R8.8.11","player":"大久保 陽翔","batting":{"OPS":".912"}}}'; require_text A01 '.912'
          call_case A02 '{"mode":"ANSWER_FIXTURE","question":"旧チームの陽翔のOPS教えて","route":"BATTING_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2025-2026.pdf","scope":"2025-2026","player":"大久保 陽翔","batting":{"OPS":".969"}}}'; require_text A02 '.969'
          call_case A03 '{"mode":"ANSWER_FIXTURE","question":"新チームの大野竜暉の打率教えて","route":"BATTING_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2026-2027.pdf","scope":"R8.8.2-R8.8.11","player":"大野 竜暉","batting":{"AVG":".278"}}}'; require_text A03 '.278'
          call_case A04 '{"mode":"ANSWER_FIXTURE","question":"新チームの大野竜暉のOPS教えて","route":"BATTING_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2026-2027.pdf","scope":"R8.8.2-R8.8.11","player":"大野 竜暉","batting":{"OPS":".924"}}}'; require_text A04 '.924'
          call_case A05 '{"mode":"ANSWER_FIXTURE","question":"旧チームの大野竜暉の防御率と奪三振教えて","route":"PITCHING_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2025-2026.pdf","scope":"2025-2026","player":"大野 竜暉","pitching":{"ERA":"1.69","innings":"54.0","strikeouts":"50"}}}'; require_text A05 '1.69' '50'
          call_case A06 '{"mode":"ANSWER_FIXTURE","question":"新チームは何勝何敗？","route":"TEAM_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2026-2027.pdf","scope":"R8.8.2-R8.8.11","teamRecord":{"games":6,"wins":3,"losses":2,"draws":1}}}'; require_text A06 '3勝' '2敗'
          call_case A07 '{"mode":"ANSWER_FIXTURE","question":"新チームのチームOPS教えて","route":"TEAM_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2026-2027.pdf","scope":"R8.8.2-R8.8.11","teamBatting":{"OPS":".738"}}}'; require_text A07 '.738'
          call_case A08 '{"mode":"ANSWER_FIXTURE","question":"中嶋玲月の打率とOPS教えて","route":"BATTING_LOOKUP","evidence":{"source":"丸岡中軟式野球部_通算成績一覧2026-2027.pdf","scope":"R8.8.2-R8.8.11","player":"中嶋 玲月","batting":{"AVG":".588","OPS":"1.376"}}}'; require_text A08 '.588' '1.376'
          echo 'AUTHORITATIVE ANSWER RESULT: 8/8 PASS'

          call_case G01 '{"mode":"ANSWER_FIXTURE","question":"武田晴琉翔のOPS教えて","route":"BATTING_LOOKUP","evidence":{"player":"武田 晴琉翔","batting":{"AVG":".250"}}}'
          jq -e '.refusedToInvent == true and (.missingInformation|length)>0' /tmp/G01.json >/dev/null
          call_case G02 '{"mode":"ANSWER_FIXTURE","question":"大野竜暉のWHIP教えて","route":"PITCHING_LOOKUP","evidence":{"player":"大野 竜暉","pitching":{"ERA":"1.69"}}}'
          jq -e '.refusedToInvent == true and (.missingInformation|length)>0' /tmp/G02.json >/dev/null
          call_case G03 '{"mode":"ANSWER_FIXTURE","question":"橋向のOPS教えて","route":"BATTING_LOOKUP","evidence":{"player":"橋向 結都","sources":[{"name":"集計A","OPS":".700"},{"name":"集計B","OPS":".730"}]}}'
          jq -e '.confidence == "LOW" and (.contradictions|length)>0 and ((.answer//"")|contains(".700")) and ((.answer//"")|contains(".730"))' /tmp/G03.json >/dev/null
          call_case G04 '{"mode":"ANSWER_FIXTURE","question":"今季何勝何敗？","route":"TEAM_LOOKUP","evidence":{"scope":"今季","teamRecord":{"wins":8}}}'
          jq -e '.refusedToInvent == true and (.missingInformation|length)>0 and ((.answer//"")|contains("8勝"))' /tmp/G04.json >/dev/null
          call_case G05 '{"mode":"ANSWER_FIXTURE","question":"9月号TEAM REPORT見せて","route":"DOCUMENT_SEARCH","evidence":{"documents":[]}}'
          jq -e '.refusedToInvent == true and (.missingInformation|length)>0' /tmp/G05.json >/dev/null
          call_case G06 '{"mode":"ANSWER_FIXTURE","question":"大野竜暉の打撃と投手の両方教えて","route":"PLAYER_OVERVIEW","evidence":{"player":"大野 竜暉","batting":{"AVG":".302","OPS":".801"}}}'
          jq -e '.refusedToInvent == true and (.missingInformation|length)>0 and ((.answer//"")|contains(".302"))' /tmp/G06.json >/dev/null
          echo 'GUARDRAIL ANSWER RESULT: 6/6 PASS'
          echo 'ANSWER QUALITY RESULT: 14/14 PASS'