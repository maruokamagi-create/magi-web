name: MAGI Live Full Lineup E2E Repeat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magi-live-e2e-repeat-20260914.yml'
  workflow_dispatch:

jobs:
  live-e2e-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production route
        run: sleep 20
      - name: Execute real live Evidence through 3 Wise Men again
        shell: bash
        run: |
          set -euo pipefail
          URL='https://magi-web.vercel.app/api/magi-live-e2e-repeat-20260914'
          curl -L --fail --max-time 70 --retry 1 --retry-delay 3 -sS "$URL" -o /tmp/e2e-repeat.json
          cat /tmp/e2e-repeat.json; echo
          jq -e '.ok==true' /tmp/e2e-repeat.json >/dev/null
          jq -e '.summary.currentEvidenceCount==14 and .summary.currentPlayersWithBatting==14 and .summary.final.status=="LINEUP_RESULT" and (.summary.final.lineup|length)==9' /tmp/e2e-repeat.json >/dev/null
          echo 'LIVE REAL-EVIDENCE THREE-WISE-MEN E2E REPEAT: PASS'
