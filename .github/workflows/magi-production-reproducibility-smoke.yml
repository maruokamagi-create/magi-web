name: MAGI Production Reproducibility Smoke

on:
  workflow_call:
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production acceptance contract
        uses: actions/checkout@v4

      - name: Wait for production deployment
        run: sleep 45

      - name: Verify production single-path client
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail -sS "$BASE/" -o /tmp/index.html
          grep -F '/magi-app-bootstrap-v363.js?v=427' /tmp/index.html
          if grep -Fq 'magi-formal-hotfix-v369.js' /tmp/index.html; then
            echo 'obsolete v369 hotfix is still loaded' >&2
            exit 1
          fi
          curl -L --fail -sS "$BASE/magi-app-bootstrap-v363.js?v=427" -o /tmp/bootstrap.js
          grep -F 'magi-formal-runner-v373.js' /tmp/bootstrap.js
          if grep -Fq 'magi-formal-runner-v358.js' /tmp/bootstrap.js; then
            echo 'obsolete v358 formal runner is still loaded' >&2
            exit 1
          fi
          curl -L --fail -sS "$BASE/magi-formal-runner-v373.js?v=427" -o /tmp/runner.js
          grep -F 'structuredValidationOnly:true' /tmp/runner.js
          grep -F 'proseBlocking:false' /tmp/runner.js
          echo 'PRODUCTION SINGLE-PATH CLIENT: PASS'

      - name: Verify same Evidence produces same deliberation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          ORIGIN='https://magi-web.vercel.app'

          cat > /tmp/case.json <<'JSON'
          {
            "mode":"selection",
            "selectionKind":"FULL_LINEUP",
            "question":"今の丸岡中のベストオーダーを、守備位置込みで審議して",
            "evidence":{
              "scope":"PRODUCTION_REPRODUCIBILITY_FIXED_EVIDENCE",
              "primarySeason":"current",
              "selectionKind":"FULL_LINEUP",
              "count":14,
              "files":["チーム成績_2026-2027.xlsm"],
              "allCurrentTeamCheck":{
                "status":"COMPLETE",
                "players":[
                  {"name":"井坂 悠聖","batting":{"AVG":".280","OPS":".690","AB":"25"}},
                  {"name":"大久保 陽翔","batting":{"AVG":".333","OPS":".812","AB":"30"}},
                  {"name":"大野 竜暉","batting":{"AVG":".278","OPS":".924","AB":"28"}},
                  {"name":"坂田 暉馬","batting":{"AVG":".250","OPS":".650","AB":"24"}},
                  {"name":"嶋田 栄志","batting":{"AVG":".300","OPS":".720","AB":"27"}},
                  {"name":"武澤 大翔","batting":{"AVG":".286","OPS":".700","AB":"28"}},
                  {"name":"橋向 結都","batting":{"AVG":".240","OPS":".620","AB":"25"}},
                  {"name":"上村 蓮","batting":{"AVG":".222","OPS":".600","AB":"18"}},
                  {"name":"大久保 夢翔","batting":{"AVG":".267","OPS":".680","AB":"15"}},
                  {"name":"長侶 穹","batting":{"AVG":".350","OPS":".880","AB":"20"}},
                  {"name":"中嶋 玲月","batting":{"AVG":".320","OPS":".860","AB":"25"}},
                  {"name":"吉田 真翔","batting":{"AVG":".250","OPS":".640","AB":"16"}},
                  {"name":"鰐渕 将太","batting":{"AVG":".235","OPS":".610","AB":"17"}},
                  {"name":"武田 晴琉翔","batting":{"AVG":".260","OPS":".660","AB":"20"}}
                ]
              },
              "historicalReference":{"status":"INCOMPLETE","players":[]},
              "recentSix":{"status":"INCOMPLETE","players":[]},
              "dataRule":"現チーム14名から異なる9名を1番〜9番で選ぶ。"
            }
          }
          JSON

          # Use the roster supplied by this synthetic CASE, not historic players.
          jq '[.evidence.allCurrentTeamCheck.players[].name]' /tmp/case.json > /tmp/roster.json

          # Reproducibility fixture only: synthetic fielding evidence for all nine positions.
          # A deterministic score matrix gives any selected nine a unique complete assignment.
          jq '
            .evidence.appearanceFielding = {
              status:"COMPLETE",
              players:[
                .evidence.allCurrentTeamCheck.players
                | to_entries[]
                | . as $player
                | {
                    name:$player.value.name,
                    appearance:{
                      officialStartingPositions:(
                        ["投","捕","一","二","三","遊","左","中","右"]
                        | to_entries
                        | map({key:.value,value:(($player.key+1)*(.key+1))})
                        | from_entries
                      ),
                      practiceFirstStartingPositions:{},
                      startingPositions:{},
                      recentStartingPositions:{}
                    },
                    fielding:{positions:{}}
                  }
              ]
            }
          ' /tmp/case.json > /tmp/case-with-fielding.json
          mv /tmp/case-with-fielding.json /tmp/case.json

          post(){
            local endpoint="$1" body="$2" out="$3"
            local headers="${out}.headers" status attempt
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -L -sS -D "$headers" -w '%{http_code}' \
                -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
                -d @"$body" "$BASE$endpoint" -o "$out")"
              if [[ "$status" =~ ^2 ]]; then return 0; fi
              echo "MAGI HTTP FAILURE endpoint=$endpoint attempt=$attempt status=$status" >&2
              if jq -e . "$out" >/dev/null 2>&1; then
                jq -c '{code,error,retryExhausted,retryFreshRequest,retryScope}' "$out" >&2 || true
              fi
              grep -iE '^(retry-after|x-magi-[^:]+):' "$headers" >&2 || true
              [[ "$status" =~ ^(408|429|500|502|503|504)$ ]] || return 22
              [[ "$attempt" -lt 6 ]] || return 22
              wait_seconds=4
              if grep -qi '^x-magi-gemini-failure: provider_rate_limit' "$headers"; then
                retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\\r","",$2); print $2; exit}' "$headers")"
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then wait_seconds="$retry_after"; else wait_seconds=15; fi
                (( wait_seconds > 60 )) && wait_seconds=60
                (( wait_seconds < 10 )) && wait_seconds=10
              fi
              echo "MAGI retry wait=${wait_seconds}s" >&2
              sleep "$wait_seconds"
            done
          }

          validate_repro_persona(){
            local file="$1" phase="$2" persona="$3" tag="$4"
            if jq -e '.reviewRequested==false and .dataConflict==false and (.candidatePlayers|length==9) and ((.candidatePlayers|unique|length)==9)' "$file" >/dev/null; then
              return 0
            fi
            echo "REPRO_PERSONA_ACCEPTANCE_FAILURE tag=$tag phase=$phase persona=$persona" >&2
            # Structural diagnostics only. Never publish raw generated claims,
            # selected names, stats, or the possibly sensitive reviewReason.
            jq -c '{
              reviewRequested:(.reviewRequested==true),
              dataConflict:(.dataConflict==true),
              candidateCount:(if (.candidatePlayers|type)=="array" then (.candidatePlayers|length) else 0 end),
              uniqueCandidateCount:(if (.candidatePlayers|type)=="array" then (.candidatePlayers|unique|length) else 0 end),
              checkedPlayerCount:(if (.checkedPlayers|type)=="array" then (.checkedPlayers|length) else 0 end),
              reasonClass:(if ((.reviewReason//"")|contains("FULL_LINEUP_STANDARD_DEFENSE")) then "FIELDING"
                elif ((.reviewReason//"")|contains("candidatePlayersと打順説明が矛盾")) then "ORDER_CONFLICT"
                elif ((.reviewReason//"")|contains("回答文に、確認できた記録と合わない")) then "EVIDENCE_OUTPUT_GUARD"
                elif ((.reviewReason//"")|length)>0 then "REVIEW_REQUIRED_OTHER"
                else "NONE" end)
            }' "$file" >&2 || true
            return 1
          }

          run_once(){
            local tag="$1"
            echo "REPRO_STAGE tag=$tag phase=PRIMARY"
            for p in melchior balthasar casper; do
              jq -n --arg p "$p" --slurpfile c /tmp/case.json '{persona:$p,phase:"PRIMARY",case:$c[0]}' > "/tmp/${tag}-${p}-primary-body.json"
              post '/api/magi/persona' "/tmp/${tag}-${p}-primary-body.json" "/tmp/${tag}-${p}-primary.json"
              validate_repro_persona "/tmp/${tag}-${p}-primary.json" PRIMARY "$p" "$tag"
            done

            echo "REPRO_STAGE tag=$tag phase=CROSS"
            jq -n --slurpfile c /tmp/case.json \
              --slurpfile m "/tmp/${tag}-melchior-primary.json" \
              --slurpfile b "/tmp/${tag}-balthasar-primary.json" \
              --slurpfile s "/tmp/${tag}-casper-primary.json" \
              '{phase:"CROSS_EXAMINATION",case:$c[0],primary:{melchior:$m[0],balthasar:$b[0],casper:$s[0]}}' > "/tmp/${tag}-cross-body.json"
            post '/api/magi/orchestrate' "/tmp/${tag}-cross-body.json" "/tmp/${tag}-cross.json"

            echo "REPRO_STAGE tag=$tag phase=SECOND"
            for p in melchior balthasar casper; do
              jq -n --arg p "$p" --slurpfile c /tmp/case.json \
                --slurpfile self "/tmp/${tag}-${p}-primary.json" \
                --slurpfile cross "/tmp/${tag}-cross.json" \
                '{persona:$p,phase:"SECOND",case:$c[0],primarySelf:$self[0],crossExamination:$cross[0]}' > "/tmp/${tag}-${p}-second-body.json"
              post '/api/magi/persona' "/tmp/${tag}-${p}-second-body.json" "/tmp/${tag}-${p}-second.json"
              validate_repro_persona "/tmp/${tag}-${p}-second.json" SECOND "$p" "$tag"
            done

            echo "REPRO_STAGE tag=$tag phase=FINAL"
            jq -n --slurpfile c /tmp/case.json \
              --slurpfile pm "/tmp/${tag}-melchior-primary.json" --slurpfile pb "/tmp/${tag}-balthasar-primary.json" --slurpfile pc "/tmp/${tag}-casper-primary.json" \
              --slurpfile sm "/tmp/${tag}-melchior-second.json" --slurpfile sb "/tmp/${tag}-balthasar-second.json" --slurpfile sc "/tmp/${tag}-casper-second.json" \
              --slurpfile x "/tmp/${tag}-cross.json" \
              '{phase:"FINAL",case:$c[0],primary:{melchior:$pm[0],balthasar:$pb[0],casper:$pc[0]},second:{melchior:$sm[0],balthasar:$sb[0],casper:$sc[0]},crossExamination:$x[0]}' > "/tmp/${tag}-final-body.json"
            post '/api/magi/orchestrate' "/tmp/${tag}-final-body.json" "/tmp/${tag}-final.json"
            # Accept only a fully evidenced 3-0/2-1 lineup or a true 1-1-1
            # deadlock that refuses to invent the lineup. Both must replay identically.
            jq -c --arg tag "$tag" '{tag:$tag,status,finalVote,fieldingStatus,reviewReason}' "/tmp/${tag}-final.json"
            if ! jq -e --slurpfile roster /tmp/roster.json -f scripts/validate-production-full-lineup-final.jq "/tmp/${tag}-final.json" >/dev/null; then
              echo "REPRO_ACCEPTANCE_FAILURE tag=$tag stage=FINAL" >&2
              return 1
            fi
            echo "REPRO_ACCEPTANCE_PASS tag=$tag stage=FINAL"
          }

          run_once a
          # Give the canonical cache writes from the first full deliberation time to become visible before replaying the identical Evidence.
          sleep 3
          run_once b

          echo 'REPRO_STAGE phase=COMPARE_PERSONA_OUTPUTS'
          for p in melchior balthasar casper; do
            jq -S '{candidatePlayers,candidateBasis,facts,analysis,prediction,confidence,judgment,primaryReason,publicStatement,warnings,dataConflict,reviewRequested}' "/tmp/a-${p}-primary.json" > "/tmp/a-${p}-primary-stable.json"
            jq -S '{candidatePlayers,candidateBasis,facts,analysis,prediction,confidence,judgment,primaryReason,publicStatement,warnings,dataConflict,reviewRequested}' "/tmp/b-${p}-primary.json" > "/tmp/b-${p}-primary-stable.json"
            cmp "/tmp/a-${p}-primary-stable.json" "/tmp/b-${p}-primary-stable.json"

            jq -S '{candidatePlayers,candidateBasis,facts,analysis,prediction,confidence,judgment,primaryReason,publicStatement,warnings,dataConflict,reviewRequested}' "/tmp/a-${p}-second.json" > "/tmp/a-${p}-second-stable.json"
            jq -S '{candidatePlayers,candidateBasis,facts,analysis,prediction,confidence,judgment,primaryReason,publicStatement,warnings,dataConflict,reviewRequested}' "/tmp/b-${p}-second.json" > "/tmp/b-${p}-second-stable.json"
            cmp "/tmp/a-${p}-second-stable.json" "/tmp/b-${p}-second-stable.json"
          done

          echo 'REPRO_STAGE phase=COMPARE_CROSS'
          jq -S '{agreement,disagreement,domainConflicts,challenges,informationGaps,reviewRequired}' /tmp/a-cross.json > /tmp/a-cross-stable.json
          jq -S '{agreement,disagreement,domainConflicts,challenges,informationGaps,reviewRequired}' /tmp/b-cross.json > /tmp/b-cross-stable.json
          cmp /tmp/a-cross-stable.json /tmp/b-cross-stable.json

          echo 'REPRO_STAGE phase=COMPARE_FINAL'
          jq -S '{mode,status,recommendation,lineup,battingOrder,fieldingStatus,fieldingReason,deliberationDecision,finalVote,reviewReason,proposalGroups,slotConflicts,personaLineups,majorReasons,warnings,crossDiscussion}' /tmp/a-final.json > /tmp/a-final-stable.json
          jq -S '{mode,status,recommendation,lineup,battingOrder,fieldingStatus,fieldingReason,deliberationDecision,finalVote,reviewReason,proposalGroups,slotConflicts,personaLineups,majorReasons,warnings,crossDiscussion}' /tmp/b-final.json > /tmp/b-final-stable.json
          cmp /tmp/a-final-stable.json /tmp/b-final-stable.json

          echo 'PRODUCTION SAME QUESTION + SAME EVIDENCE REPRODUCIBILITY: PASS'
