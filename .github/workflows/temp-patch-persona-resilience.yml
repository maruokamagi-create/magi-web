name: TEMP Persona Resilience Patcher

on:
  push:
    branches: [fix/persona-failure-retry-20260916]
    paths:
      - '.github/workflows/temp-patch-persona-resilience.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persona-failure-retry-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify narrow resilience patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp_patch_persona2.py
          node --check server/api/magi/persona.js
          node --check deliberation-integrity-v348.js
          git diff --check
          grep -Fq 'recoverSoftFullLineupLanguage' server/api/magi/persona.js
          grep -Fq 'retryExhausted' server/api/magi/persona.js
          grep -Fq 'if(error?.retryExhausted)throw error' deliberation-integrity-v348.js
          grep -Fq '確認できない説明は使わず' deliberation-integrity-v348.js
      - name: Commit and push code-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'maruoka-magi-bot'
          git config user.email 'maruoka.magi@gmail.com'
          git add server/api/magi/persona.js deliberation-integrity-v348.js
          git commit -m 'Stabilize full-lineup persona execution'
          git push origin HEAD:fix/persona-failure-retry-20260916
