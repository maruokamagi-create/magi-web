name: MAGI Production Full Lineup Smoke

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/persona.js'
      - 'server/api/magi/orchestrate.js'
      - 'server/api/magi/_full-lineup.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_cross-output-guard.js'
      - '.github/workflows/magi-production-full-lineup-smoke.yml'
  workflow_dispatch:

jobs:
  production-full-lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment
        run: sleep 40

      - name: Run full 1-9 three-sage deliberation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          ORIGIN='https://magi-web.vercel.app'

          cat > /tmp/roster.json <<'JSON'
          ["井坂 悠聖","大久保 陽翔","大野 竜暉","坂田 暉馬","嶋田 栄志","武澤 大翔","橋向 結都","上村 蓮","大久保 夢翔","長侶 穹","中嶋 玲月","吉田 真翔","鰐渕 将太","武田 晴琉翔"]
          JSON

          cat > /tmp/case.json <<'JSON'
          {
            "mode":"selection",
            "selectionKind":"FULL_LINEUP",
            "question":"ベストオーダーを1番から9番まで組んで",
            "evidence":{
              "scope":"PRODUCTION_FULL_LINEUP_SMOKE_SYNTHETIC_FIXED_EVIDENCE",
              "primarySeason":"current",
              "selectionKind":"FULL_LINEUP",
              "allCurrentTeamCheck":{
                "status":"COMPLETE",
                "players":[
                  {"name":"井坂 悠聖","batting":{"AVG":".280","OPS":".690","AB":"25"}},
                  {"name":"大久保 陽翔","batting":{"AVG":".333","OPS":".812","AB":"30"}},
                  {"name":"大野 竜暉","batting":{"AVG":".278","OPS":".924","AB":"28"}},
                  {"name":"坂田 暉馬","batting":{"AVG":".250","OPS":".650","AB":"24"}},
                  {"name":"嶋田 栄志","batting":{"AVG":".300","OPS":".720","AB":"27"}},
                  {"name":"武澤 大翔","batting":{"AVG":".286","OPS":".700","AB":"28"}},
                  {"name":"橋向 結都","batting":{"AVG":".240","OPS":".620","AB":"25"}},
                  {"name":"上村 蓮","batting":{"AVG":".222","OPS":".600","AB":"18"}},
                  {"name":"大久保 夢翔","batting":{"AVG":".267","OPS":".680","AB":"15"}},
                  {"name":"長侶 穹","batting":{"AVG":".350","OPS":".880","AB":"20"}},
                  {"name":"中嶋 玲月","batting":{"AVG":".320","OPS":".860","AB":"25"}},
                  {"name":"吉田 真翔","batting":{"AVG":".250","OPS":".640","AB":"16"}},
                  {"name":"鰐渕 将太","batting":{"AVG":".235","OPS":".610","AB":"17"}},
                  {"name":"武田 晴琉翔","batting":{"AVG":".260","OPS":".660","AB":"20"}}
                ]
              },
              "historicalReference":{
                "status":"COMPLETE",
                "scope":"2025-2026旧チーム",
                "candidateEligible":false,
                "players":[
                  {"name":"大野 竜暉","batting":{"AVG":".300","OPS":".840"}},
                  {"name":"大久保 陽翔","batting":{"AVG":".290","OPS":".800"}},
                  {"name":"宮嵜 翔","batting":{"AVG":".999","OPS":"1.999"}}
                ],
                "warning":"旧チーム記録は参考のみ。引退選手を現チーム候補に混ぜない。"
              },
              "dataRule":"1番〜9番は現チーム14名から異なる9名。現チームを主評価、旧チームは参考。"
            }
          }
          JSON

          same_roster(){
            jq -S '.checkedPlayers|sort' "$1" > /tmp/actual-roster.json
            jq -S 'sort' /tmp/roster.json > /tmp/expected-roster.json
            cmp -s /tmp/actual-roster.json /tmp/expected-roster.json
          }

          valid_lineup(){
            jq -e --slurpfile roster /tmp/roster.json '
              (.candidatePlayers|type=="array") and (.candidatePlayers|length==9) and
              ((.candidatePlayers|unique|length)==9) and
              ([.candidatePlayers[] as $p | ($roster[0] | index($p)) != null] | all) and
              ((.candidatePlayers|index("宮嵜 翔")) == null)
            ' "$1" >/dev/null
          }

          call_persona(){
            local persona="$1" phase="$2" outfile="$3" primary_self="${4:-}" cross_file="${5:-}"
            if [ "$phase" = 'PRIMARY' ]; then
              jq -n --arg p "$persona" --slurpfile c /tmp/case.json '{persona:$p,phase:"PRIMARY",case:$c[0]}' > /tmp/body.json
            else
              jq -n --arg p "$persona" --slurpfile c /tmp/case.json --slurpfile s "$primary_self" --slurpfile x "$cross_file" '{persona:$p,phase:"SECOND",case:$c[0],primarySelf:$s[0],crossExamination:$x[0]}' > /tmp/body.json
            fi
            curl -L --fail --retry 2 --retry-delay 4 -sS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d @/tmp/body.json "$BASE/api/magi/persona" -o "$outfile"
            cat "$outfile"; echo
            sleep 2
          }

          for p in melchior balthasar casper; do
            call_persona "$p" PRIMARY "/tmp/${p}-primary.json"
            jq -e '.reviewRequested==false and .dataConflict==false and (.candidateBasis|length>0)' "/tmp/${p}-primary.json" >/dev/null
            same_roster "/tmp/${p}-primary.json"
            valid_lineup "/tmp/${p}-primary.json"
          done

          jq -n --slurpfile c /tmp/case.json --slurpfile m /tmp/melchior-primary.json --slurpfile b /tmp/balthasar-primary.json --slurpfile s /tmp/casper-primary.json '{phase:"CROSS_EXAMINATION",case:$c[0],primary:{melchior:$m[0],balthasar:$b[0],casper:$s[0]}}' > /tmp/cross-body.json
          curl -L --fail --retry 2 --retry-delay 4 -sS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d @/tmp/cross-body.json "$BASE/api/magi/orchestrate" -o /tmp/cross.json
          cat /tmp/cross.json; echo
          jq -e '(.reviewRequired != true) and (.challenges.melchior|length>0) and (.challenges.balthasar|length>0) and (.challenges.casper|length>0)' /tmp/cross.json >/dev/null
          sleep 2

          for p in melchior balthasar casper; do
            call_persona "$p" SECOND "/tmp/${p}-second.json" "/tmp/${p}-primary.json" /tmp/cross.json
            jq -e '.reviewRequested==false and .dataConflict==false and (.candidateBasis|length>0)' "/tmp/${p}-second.json" >/dev/null
            same_roster "/tmp/${p}-second.json"
            valid_lineup "/tmp/${p}-second.json"
          done

          jq -n --slurpfile c /tmp/case.json --slurpfile pm /tmp/melchior-primary.json --slurpfile pb /tmp/balthasar-primary.json --slurpfile pc /tmp/casper-primary.json --slurpfile sm /tmp/melchior-second.json --slurpfile sb /tmp/balthasar-second.json --slurpfile sc /tmp/casper-second.json --slurpfile x /tmp/cross.json '{phase:"FINAL",case:$c[0],primary:{melchior:$pm[0],balthasar:$pb[0],casper:$pc[0]},second:{melchior:$sm[0],balthasar:$sb[0],casper:$sc[0]},crossExamination:$x[0]}' > /tmp/final-body.json
          curl -L --fail --retry 2 --retry-delay 4 -sS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d @/tmp/final-body.json "$BASE/api/magi/orchestrate" -o /tmp/final.json
          cat /tmp/final.json; echo

          jq -e --slurpfile roster /tmp/roster.json '
            .mode=="FULL_LINEUP" and .status=="LINEUP_RESULT" and
            (.lineup|length==9) and (([.lineup[].name]|unique|length)==9) and
            ([.lineup[].name as $p | ($roster[0] | index($p)) != null] | all) and
            (([.lineup[].name]|index("宮嵜 翔")) == null) and
            (.personaLineups|keys|length==3) and
            (.crossDiscussion.challenges.melchior|length>0) and
            (.crossDiscussion.challenges.balthasar|length>0) and
            (.crossDiscussion.challenges.casper|length>0)
          ' /tmp/final.json >/dev/null

          echo 'PRODUCTION FULL 1-9 THREE-SAGE DELIBERATION: PASS'
