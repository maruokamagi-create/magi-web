name: MAGI Production Selection Smoke

on:
  workflow_call:
  workflow_dispatch:

jobs:
  production-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment
        run: sleep 35

      - name: Run one full candidate-selection deliberation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          ORIGIN='https://magi-web.vercel.app'

          cat > /tmp/roster.json <<'JSON'
          [
            "井坂 悠聖","大久保 陽翔","大野 竜暉","坂田 暉馬","嶋田 栄志","武澤 大翔","橋向 結都",
            "上村 蓮","大久保 夢翔","長侶 穹","中嶋 玲月","吉田 真翔","鰐渕 将太","武田 晴琉翔"
          ]
          JSON

          cat > /tmp/case.json <<'JSON'
          {
            "mode":"selection",
            "question":"3番は誰がいい？",
            "evidence":{
              "scope":"PRODUCTION_SELECTION_SMOKE_SYNTHETIC_FIXED_EVIDENCE",
              "primarySeason":"current",
              "allCurrentTeamCheck":{
                "status":"COMPLETE",
                "players":[
                  {"name":"井坂 悠聖","positions":["一塁"],"batting":{"AVG":".280","OPS":".690"}},
                  {"name":"大久保 陽翔","positions":["投手","三塁"],"batting":{"AVG":".333","OPS":".812"}},
                  {"name":"大野 竜暉","positions":["捕手","投手"],"batting":{"AVG":".278","OPS":".924"}},
                  {"name":"坂田 暉馬","positions":["二塁","右翼"],"batting":{"AVG":".250","OPS":".650"}},
                  {"name":"嶋田 栄志","positions":["中堅"],"batting":{"AVG":".300","OPS":".720"}},
                  {"name":"武澤 大翔","positions":["遊撃"],"batting":{"AVG":".286","OPS":".700"}},
                  {"name":"橋向 結都","positions":["投手"],"batting":{"AVG":".240","OPS":".620"}},
                  {"name":"上村 蓮","positions":["捕手"],"batting":{"AVG":".222","OPS":".600"}},
                  {"name":"大久保 夢翔","positions":["投手","外野"],"batting":{"AVG":".267","OPS":".680"}},
                  {"name":"長侶 穹","positions":["内野"],"batting":{"AVG":".350","OPS":".880"}},
                  {"name":"中嶋 玲月","positions":["一塁"],"batting":{"AVG":".320","OPS":".860"}},
                  {"name":"吉田 真翔","positions":["内野"],"batting":{"AVG":".250","OPS":".640"}},
                  {"name":"鰐渕 将太","positions":["外野"],"batting":{"AVG":".235","OPS":".610"}},
                  {"name":"武田 晴琉翔","positions":["左翼"],"batting":{"AVG":".260","OPS":".660"}}
                ]
              },
              "historicalReference":{
                "status":"COMPLETE",
                "scope":"2025-2026旧チーム",
                "candidateEligible":false,
                "players":[
                  {"name":"大野 竜暉","batting":{"AVG":".300","OPS":".840"}},
                  {"name":"大久保 陽翔","batting":{"AVG":".290","OPS":".800"}},
                  {"name":"宮嵜 翔","batting":{"AVG":".500","OPS":"1.500"}}
                ],
                "warning":"旧チーム記録は参考のみ。引退選手を現チーム候補に混ぜない。"
              },
              "dataRule":"候補は現チーム14名のみ。現チームを主評価、旧チームは参考。ここにない数値・役割・選手は作らない"
            }
          }
          JSON

          # FULL one-provider-call experiment was retired after production proved
          # it cannot reliably return the complete structured deliberation.

          same_roster(){
            local file="$1"
            jq -S '.checkedPlayers|sort' "$file" > /tmp/actual-roster.json
            jq -S 'sort' /tmp/roster.json > /tmp/expected-roster.json
            cmp -s /tmp/actual-roster.json /tmp/expected-roster.json
          }

          candidates_current_only(){
            local file="$1"
            jq -e --slurpfile roster /tmp/roster.json '
              (.candidatePlayers|type=="array") and (.candidatePlayers|length>0) and
              ([.candidatePlayers[] as $p | ($roster[0] | index($p)) != null] | all) and
              ((.candidatePlayers|index("宮嵜 翔")) == null)
            ' "$file" >/dev/null
          }

          call_persona(){
            local persona="$1" phase="$2" outfile="$3" primary_self="${4:-}" cross_file="${5:-}"
            if [ "$phase" = 'PRIMARY' ]; then
              jq -n --arg p "$persona" --slurpfile c /tmp/case.json '{persona:$p,phase:"PRIMARY",case:$c[0]}' > /tmp/body.json
            else
              jq -n --arg p "$persona" --slurpfile c /tmp/case.json --slurpfile s "$primary_self" --slurpfile x "$cross_file" '{persona:$p,phase:"SECOND",case:$c[0],primarySelf:$s[0],crossExamination:$x[0]}' > /tmp/body.json
            fi
            local headers="${outfile}.headers" status attempt
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -L -sS -D "$headers" -w '%{http_code}' \
                -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
                -d @/tmp/body.json "$BASE/api/magi/persona" -o "$outfile")"
              if [[ "$status" =~ ^2 ]]; then break; fi
              echo "MAGI PERSONA FAILURE persona=$persona phase=$phase attempt=$attempt status=$status" >&2
              jq -c '{code,error,retryExhausted,retryFreshRequest,retryScope}' "$outfile" >&2 2>/dev/null || true
              grep -iE '^(retry-after|x-magi-[^:]+):' "$headers" >&2 || true
              [[ "$status" =~ ^(408|429|500|502|503|504)$ && "$attempt" -lt 6 ]] || return 22
              wait_seconds=4
              if grep -qi '^x-magi-gemini-failure: provider_rate_limit' "$headers"; then
                retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\\r","",$2); print $2; exit}' "$headers")"
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  wait_seconds="$retry_after"
                else
                  wait_seconds=15
                fi
                (( wait_seconds > 60 )) && wait_seconds=60
                (( wait_seconds < 10 )) && wait_seconds=10
              fi
              echo "MAGI retry wait=${wait_seconds}s" >&2
              sleep "$wait_seconds"
            done
            [[ "$status" =~ ^2 ]] || return 22
            cat "$outfile"; echo
          }

          jq -n --slurpfile c /tmp/case.json '{phase:"PRIMARY",case:$c[0]}' > /tmp/primary-batch-body.json
          for batch_attempt in 1 2 3 4 5 6; do
            batch_status="$(curl -L -sS -D /tmp/primary-batch.headers -w '%{http_code}' \
              -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
              -d @/tmp/primary-batch-body.json "$BASE/api/magi/persona-batch" -o /tmp/primary-batch.json)"
            [[ "$batch_status" =~ ^2 ]] && break
            echo "MAGI PRIMARY BATCH FAILURE attempt=$batch_attempt status=$batch_status" >&2
            jq -c '{code,error,persona,retryExhausted,retryFreshRequest,retryScope,diagnostic}' /tmp/primary-batch.json >&2 2>/dev/null || true
            grep -iE '^(retry-after|x-magi-[^:]+):' /tmp/primary-batch.headers >&2 || true
            batch_retryable="$(jq -r '.retryFreshRequest == true and .retryExhausted == false' /tmp/primary-batch.json 2>/dev/null || echo false)"
            [[ "$batch_retryable" = true && "$batch_status" =~ ^(408|429|500|502|503|504)$ && "$batch_attempt" -lt 6 ]] || exit 22
            batch_wait="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\\r","",$2); print $2; exit}' /tmp/primary-batch.headers)"
            [[ "$batch_wait" =~ ^[0-9]+$ ]] || batch_wait=15
            (( batch_wait > 60 )) && batch_wait=60
            (( batch_wait < 10 )) && batch_wait=10
            echo "MAGI PRIMARY BATCH retry wait=${batch_wait}s" >&2
            sleep "$batch_wait"
          done
          [[ "$batch_status" =~ ^2 ]] || exit 22
          jq -e '(.melchior|type=="object") and (.balthasar|type=="object") and (.casper|type=="object")' /tmp/primary-batch.json >/dev/null
          for p in melchior balthasar casper; do
            jq --arg p "$p" '.[$p]' /tmp/primary-batch.json > "/tmp/${p}-primary.json"
            expected=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            jq -e --arg p "$expected" '
              .persona==$p and .phase=="PRIMARY" and
              (.reviewRequested==false) and (.dataConflict==false) and
              (.checkedPlayers|length==14) and
              ((.candidateBasis//"")|length>0) and
              ((.primaryReason//"")|length>0) and
              ((.publicStatement//"")|length>0)
            ' "/tmp/${p}-primary.json" >/dev/null
            same_roster "/tmp/${p}-primary.json"
            candidates_current_only "/tmp/${p}-primary.json"
          done

          jq -n \
            --slurpfile c /tmp/case.json \
            --slurpfile m /tmp/melchior-primary.json \
            --slurpfile b /tmp/balthasar-primary.json \
            --slurpfile s /tmp/casper-primary.json \
            '{phase:"CROSS_EXAMINATION",case:$c[0],primary:{melchior:$m[0],balthasar:$b[0],casper:$s[0]}}' > /tmp/cross-body.json
          curl -L --fail --retry 2 --retry-delay 3 -sS \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -d @/tmp/cross-body.json "$BASE/api/magi/orchestrate" -o /tmp/cross.json
          cat /tmp/cross.json; echo
          jq -e '
            (.agreement|type=="array") and (.disagreement|type=="array") and
            (.warnings|type=="array") and (.informationGaps|type=="array") and
            (.challenges.melchior|type=="array") and
            (.challenges.balthasar|type=="array") and
            (.challenges.casper|type=="array") and
            (.reviewRequired != true)
          ' /tmp/cross.json >/dev/null

          jq -n \
            --slurpfile c /tmp/case.json \
            --slurpfile pm /tmp/melchior-primary.json \
            --slurpfile pb /tmp/balthasar-primary.json \
            --slurpfile pc /tmp/casper-primary.json \
            --slurpfile x /tmp/cross.json \
            '{phase:"SECOND",case:$c[0],primary:{melchior:$pm[0],balthasar:$pb[0],casper:$pc[0]},crossExamination:{melchior:$x[0],balthasar:$x[0],casper:$x[0]}}' > /tmp/second-batch-body.json
          for second_batch_attempt in 1 2 3; do
            second_batch_status="$(curl -L -sS -D /tmp/second-batch.headers -w '%{http_code}' \
              -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
              -d @/tmp/second-batch-body.json "$BASE/api/magi/persona-batch" -o /tmp/second-batch.json)"
            [[ "$second_batch_status" =~ ^2 ]] && break
            echo "MAGI SECOND BATCH FAILURE attempt=$second_batch_attempt status=$second_batch_status" >&2
            jq -c '{code,error,persona,retryExhausted,retryFreshRequest,retryScope,diagnostic}' /tmp/second-batch.json >&2 2>/dev/null || true
            grep -iE '^(retry-after|x-magi-[^:]+):' /tmp/second-batch.headers >&2 || true
            retryable="$(jq -r '.retryFreshRequest == true and .retryExhausted == false' /tmp/second-batch.json 2>/dev/null || echo false)"
            [[ "$retryable" = true && "$second_batch_attempt" -lt 3 ]] || exit 22
            retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\\r","",$2); print $2; exit}' /tmp/second-batch.headers)"
            [[ "$retry_after" =~ ^[0-9]+$ ]] || retry_after=15
            (( retry_after > 60 )) && retry_after=60
            (( retry_after < 10 )) && retry_after=10
            echo "MAGI SECOND BATCH retry wait=${retry_after}s" >&2
            sleep "$retry_after"
          done
          [[ "$second_batch_status" =~ ^2 ]] || exit 22
          jq -e '(.melchior|type=="object") and (.balthasar|type=="object") and (.casper|type=="object")' /tmp/second-batch.json >/dev/null
          for p in melchior balthasar casper; do
            jq --arg p "$p" '.[$p]' /tmp/second-batch.json > "/tmp/${p}-second.json"
            expected=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            jq -e --arg p "$expected" '
              .persona==$p and .phase=="SECOND" and
              (.reviewRequested==false) and (.dataConflict==false) and
              (.checkedPlayers|length==14) and
              ((.candidateBasis//"")|length>0) and
              ((.primaryReason//"")|length>0) and
              ((.publicStatement//"")|length>0)
            ' "/tmp/${p}-second.json" >/dev/null
            same_roster "/tmp/${p}-second.json"
            candidates_current_only "/tmp/${p}-second.json"
          done

          jq -n \
            --slurpfile c /tmp/case.json \
            --slurpfile pm /tmp/melchior-primary.json \
            --slurpfile pb /tmp/balthasar-primary.json \
            --slurpfile pc /tmp/casper-primary.json \
            --slurpfile sm /tmp/melchior-second.json \
            --slurpfile sb /tmp/balthasar-second.json \
            --slurpfile sc /tmp/casper-second.json \
            --slurpfile x /tmp/cross.json \
            '{phase:"FINAL",case:$c[0],primary:{melchior:$pm[0],balthasar:$pb[0],casper:$pc[0]},second:{melchior:$sm[0],balthasar:$sb[0],casper:$sc[0]},crossExamination:$x[0]}' > /tmp/final-body.json
          curl -L --fail --retry 2 --retry-delay 3 -sS \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -d @/tmp/final-body.json "$BASE/api/magi/orchestrate" -o /tmp/final.json
          cat /tmp/final.json; echo

          jq -e --slurpfile roster /tmp/roster.json '
            .mode=="SELECTION" and
            (.status|IN("SELECTION_RESULT","SELECTION_SPLIT")) and
            ((.recommendation//"")|length>0) and
            (.candidateSupport|type=="array") and (.candidateSupport|length>0) and
            (.recommendedCandidates|type=="array") and (.recommendedCandidates|length>0) and
            ([.recommendedCandidates[] as $p | ($roster[0] | index($p)) != null] | all) and
            ([.alternateCandidates[] as $p | ($roster[0] | index($p)) != null] | all) and
            ((.recommendedCandidates|index("宮嵜 翔")) == null) and
            ((.alternateCandidates|index("宮嵜 翔")) == null)
          ' /tmp/final.json >/dev/null

          m=$(jq -r '.publicStatement' /tmp/melchior-second.json)
          b=$(jq -r '.publicStatement' /tmp/balthasar-second.json)
          c=$(jq -r '.publicStatement' /tmp/casper-second.json)
          [ "$m" != "$b" ] && [ "$m" != "$c" ] && [ "$b" != "$c" ]

          echo 'PRODUCTION CANDIDATE-SELECTION DELIBERATION: PASS'
