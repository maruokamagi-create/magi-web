name: MAGI Gemini-First Semantic Authority Guard

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/core.js'
      - 'server/api/magi/_semantic-authority.js'
      - 'server/api/magi/_semantic-request.js'
      - 'server/api/magi/_semantic-postguard.js'
      - 'api/magi-production-semantic-fallback-selftest.js'
      - '.github/workflows/magi-semantic-authority-guard.yml'
  workflow_dispatch:

jobs:
  semantic-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce single Gemini-first semantic entry
        shell: bash
        run: |
          set -euo pipefail
          CORE='server/api/magi/core.js'
          AUTH='server/api/magi/_semantic-authority.js'

          grep -q "understandRequestGeminiFirst" "$CORE"
          grep -q "const semantic=await understandRequestGeminiFirst(question,context)" "$CORE"
          grep -q "semanticAuthority:'GEMINI_FIRST'" "$AUTH"
          grep -q "await callGemini" "$AUTH"

          if grep -q "_semantic-request.js" "$CORE"; then
            echo 'FAIL: production core imported the old semantic request router.'
            exit 1
          fi
          if grep -q "_semantic-postguard.js" "$CORE"; then
            echo 'FAIL: production core imported semantic override rules.'
            exit 1
          fi
          if grep -q "isFullLineupQuestion\|isExplicitPitchingPlanQuestion\|fullLineupSemantic\|pitchingPlanSemantic" "$CORE"; then
            echo 'FAIL: production core contains a pre-Gemini intent bypass.'
            exit 1
          fi
          if grep -q "routeQuestion" "$CORE"; then
            echo 'FAIL: a second semantic router is active in production core.'
            exit 1
          fi

          echo 'PASS: every production question enters Gemini semantic authority first; code remains validation/execution only.'

      - name: Wait for deployed production semantic fallback regression
        shell: bash
        run: |
          set -euo pipefail
          URL='https://magi-web.vercel.app/api/magi-production-semantic-fallback-selftest'
          for i in $(seq 1 60); do
            code=$(curl -L -sS -o /tmp/fallback.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && jq -e '.version=="magi-production-semantic-fallback-selftest-v1" and .total==7 and .passed==7 and ([.results[].pass] | all)' /tmp/fallback.json >/dev/null 2>&1; then
              cat /tmp/fallback.json
              echo 'PRODUCTION SEMANTIC FALLBACK REGRESSION: 7/7 PASS'
              exit 0
            fi
            echo "Waiting for production fallback selftest... attempt $i HTTP $code"
            sleep 10
          done
          cat /tmp/fallback.json || true
          exit 1
