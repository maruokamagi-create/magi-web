name: TEMP Cross Fallback Patcher

on:
  push:
    branches: [fix/cross-fallback-20260916]
    paths:
      - '.github/workflows/temp-patch-cross-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-fallback-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify cross fallback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp_patch_cross.py
          node --check server/api/magi/orchestrate.js
          git diff --check
          grep -Fq 'function deterministicFullLineupCross(primary)' server/api/magi/orchestrate.js
          grep -Fq 'const fallback = fullLineupCase ? deterministicFullLineupCross(body.primary) : null' server/api/magi/orchestrate.js
          grep -Fq "code: tooLarge ? 'REQUEST_TOO_LARGE' : 'CROSS_EXAMINATION_FAILED'" server/api/magi/orchestrate.js
      - name: Commit and push code-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'maruoka-magi-bot'
          git config user.email 'maruoka.magi@gmail.com'
          git add server/api/magi/orchestrate.js
          git commit -m 'Add resilient full-lineup cross fallback'
          git push origin HEAD:fix/cross-fallback-20260916
