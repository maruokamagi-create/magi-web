name: MAGI Production Lineup Stats Smoke

on:
  push:
    branches: [main]
    paths:
      - 'api/lineup-batting-stats.js'
      - 'lineup-stats-v371.js'
      - 'stats-server-bridge-v315.js'
      - 'stats-report-v260.js'
      - 'main-live-answer-v362.js'
      - 'magi-app-bootstrap-v363.js'
      - 'index.html'
      - 'scripts/test-stats-report-browser-path.mjs'
      - '.github/workflows/magi-lineup-stats-smoke.yml'
  workflow_dispatch:

jobs:
  lineup-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run browser-path batting report regression
        run: node scripts/test-stats-report-browser-path.mjs

      - name: Wait for production deployment
        run: sleep 40

      - name: Verify authoritative batting stats endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/api/lineup-batting-stats" -o /tmp/stats.json
          cat /tmp/stats.json
          jq -e '
            .ok==true and .season=="2026-2027" and
            (.players|type=="array") and (.players|length==14) and
            ([.players[] | has("games") and has("AB") and has("H") and has("AVG") and has("OBP") and has("OPS") and has("RBI")] | all) and
            ([.players[] | .AVG,.OBP,.SLG,.OPS,.RISP | select(. != "") | test("^-?(?:[0-9]+)?\\.[0-9]{3}$")] | all) and
            ([.players[] | select(.name=="大野 竜暉") | (.OPS | test("^-?(?:[0-9]+)?\\.[0-9]{3}$"))] | any)
          ' /tmp/stats.json >/dev/null
          echo 'PRODUCTION LINEUP BATTING STATS + 3-DECIMAL RATES: PASS'

      - name: Verify lineup card formatter
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/" -o /tmp/index.html
          grep -Fq '/lineup-stats-v371.js?v=373' /tmp/index.html
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/lineup-stats-v371.js?v=373" -o /tmp/lineup-stats.js
          grep -Fq 'function fmtRate(v)' /tmp/lineup-stats.js
          grep -Fq 'OPS <b>${fmtRate(st.OPS)}</b>' /tmp/lineup-stats.js
          echo 'PRODUCTION LINEUP CARD RATE FORMATTER: PASS'

      - name: Verify stats bridge player canonicalization
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/stats-server-bridge-v315.js" -o /tmp/stats-bridge.js
          grep -Fq "'島田栄志':'嶋田栄志'" /tmp/stats-bridge.js
          grep -Fq 'function canonName(v)' /tmp/stats-bridge.js
          grep -Fq 'const official=officialTarget(query);if(official)return official;' /tmp/stats-bridge.js
          grep -Fq 'if(canonName(row[m.ix.player])!==np)continue;' /tmp/stats-bridge.js
          echo 'PRODUCTION STATS PLAYER CANONICALIZATION: PASS'

      - name: Verify canonical main-path hydration before batting report
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors -sS "$BASE/" -o /tmp/index-main.html
          grep -Fq '/stats-server-bridge-v315.js?v=319' /tmp/index-main.html
          grep -Fq '/magi-app-bootstrap-v363.js?v=380' /tmp/index-main.html
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors -sS "$BASE/stats-server-bridge-v315.js?v=319" -o /tmp/stats-bridge-main.js
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors -sS "$BASE/main-live-answer-v362.js?v=380" -o /tmp/main-live-answer.js
          grep -Fq 'window.MAGI_STATS_SERVER_HYDRATE=hydrate' /tmp/stats-bridge-main.js
          grep -Fq "const hydrate=await waitFor('MAGI_STATS_SERVER_HYDRATE')" /tmp/main-live-answer.js
          grep -Fq 'const hydrated=await hydrate(synthetic)' /tmp/main-live-answer.js
          grep -Fq "if(!hydrated)throw new Error('打撃正本データを取得できませんでした')" /tmp/main-live-answer.js
          echo 'PRODUCTION MAIN BATTING PATH: CORE -> HYDRATE -> REPORT PASS'

      - name: Verify production batting report canonical aggregation contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/stats-report-v260.js?v=265" -o /tmp/stats-report-contract.js
          grep -Fq 'window.MAGI_STATS_REPORT_COLLECT=collect' /tmp/stats-report-contract.js
          grep -Fq 'const np=canonPlayer(target)' /tmp/stats-report-contract.js
          grep -Fq 'canonPlayer(player(r))===np' /tmp/stats-report-contract.js
          if grep -Fq 'n(player(r))===np' /tmp/stats-report-contract.js; then
            echo 'legacy non-canonical player comparison remains in production stats aggregation' >&2
            exit 1
          fi
          echo 'PRODUCTION BATTING REPORT CANONICAL AGGREGATION CONTRACT: PASS'

      - name: Verify production batting report uses official roster identity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/" -o /tmp/index.html
          grep -Fq '/stats-report-v260.js?v=265' /tmp/index.html
          curl -L --fail --retry 2 --retry-delay 3 -sS "$BASE/stats-report-v260.js?v=265" -o /tmp/stats-report.js
          grep -Fq "const OFFICIAL_PLAYERS=" /tmp/stats-report.js
          grep -Fq "嶋田栄志" /tmp/stats-report.js
          grep -Fq 'function officialTarget(q)' /tmp/stats-report.js
          grep -Fq 'Object.entries(PLAYER_ALIASES)' /tmp/stats-report.js
          grep -Fq 'const np=canonPlayer(target)' /tmp/stats-report.js
          grep -Fq 'canonPlayer(player(r))===np' /tmp/stats-report.js
          grep -Fq 'window.MAGI_STATS_REPORT_COLLECT=collect' /tmp/stats-report.js
          echo 'PRODUCTION BATTING REPORT OFFICIAL ROSTER IDENTITY: PASS'
