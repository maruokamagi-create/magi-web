name: MAGI Production Direct Dialogue Smoke

on:
  push:
    branches: [main]
    paths:
      - 'api/magi-gateway.js'
      - 'server/api/magi/dialogue.js'
      - 'server/api/magi/dialogue-resilient.js'
      - '.github/workflows/magi-production-dialogue-smoke.yml'
  workflow_dispatch:
  # verification refresh 2026-09-25

jobs:
  production-direct-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 40

      - name: Verify direct Three Wise Men dialogue route
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          ORIGIN='https://magi-web.vercel.app'
          cat > /tmp/body.json <<'JSON'
          {
            "phase":"CROSS_EXAMINATION",
            "case":{"mode":"selection","selectionKind":"FULL_LINEUP","question":"ベストオーダーは？"},
            "primary":{
              "melchior":{"persona":"MELCHIOR-1","candidatePlayers":["大野 竜暉","坂田 暉馬","嶋田 栄志","中嶋 玲月","大久保 陽翔","鰐渕 将太","井坂 悠聖","橋向 結都","武田 晴琉翔"],"publicStatement":"私は今の記録からこの打順を選びます。"},
              "balthasar":{"persona":"BALTHASAR-2","candidatePlayers":["大野 竜暉","坂田 暉馬","中嶋 玲月","大久保 陽翔","嶋田 栄志","鰐渕 将太","橋向 結都","井坂 悠聖","武田 晴琉翔"],"publicStatement":"俺は打線のつながりからこの打順でいく。"},
              "casper":{"persona":"CASPER-3","candidatePlayers":["大野 竜暉","坂田 暉馬","中嶋 玲月","大久保 陽翔","嶋田 栄志","鰐渕 将太","橋向 結都","井坂 悠聖","武田 晴琉翔"],"publicStatement":"僕は今の役割と打線のつながりからこの打順にします。"}
            }
          }
          JSON
          curl -L --fail -sS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d @/tmp/body.json "$BASE/api/magi/dialogue" -o /tmp/dialogue.json
          cat /tmp/dialogue.json; echo
          jq -e '
            (.dialogue|length)==3 and
            .dialogue[0].speaker=="MELCHIOR-1" and .dialogue[0].target=="BALTHASAR-2" and
            .dialogue[1].speaker=="BALTHASAR-2" and .dialogue[1].target=="CASPER-3" and
            .dialogue[2].speaker=="CASPER-3" and .dialogue[2].target=="MELCHIOR-1" and
            (.challenges.melchior|length)>=1 and
            (.challenges.balthasar|length)>=1 and
            (.challenges.casper|length)>=1 and
            ([.dialogue[].statement|contains("MAGI CONTROL")]|any|not) and
            ([.dialogue[].statement|test("お前|てめえ")]|any|not) and
            (.dialogueFallbackUsed != true) and
            ([.dialogue[].statement|test("3番|4番|5番|7番")]|all) and
            ([.dialogue[].statement|test("3番の3番|4番の4番|5番の5番|中嶋 玲月と中嶋 玲月")]|any|not)
          ' /tmp/dialogue.json >/dev/null
          echo 'PRODUCTION DIRECT THREE-WISE-MEN DIALOGUE: PASS'

          cat > /tmp/slot-body.json <<'JSON'
          {
            "phase":"CROSS_EXAMINATION",
            "case":{"mode":"selection","selectionKind":"BATTING_ORDER","question":"3番は誰がいい？"},
            "primary":{
              "melchior":{"persona":"MELCHIOR-1","candidatePlayers":["大野 竜暉","中嶋 玲月","長侶 穹"],"candidateBasis":"OPS .924の大野 竜暉を第一候補にする。","publicStatement":"3番の第一候補は大野 竜暉です。確認できるOPS .924を重視します。"},
              "balthasar":{"persona":"BALTHASAR-2","candidatePlayers":["中嶋 玲月","大野 竜暉","長侶 穹"],"candidateBasis":"打率 .320の中嶋 玲月を第一候補にする。","publicStatement":"3番は中嶋 玲月を第一候補にします。打率 .320を比較材料にします。"},
              "casper":{"persona":"CASPER-3","candidatePlayers":["大野 竜暉","中嶋 玲月","長侶 穹"],"candidateBasis":"現在の記録から大野 竜暉を第一候補にする。","publicStatement":"僕は3番の第一候補を大野 竜暉にします。現在の記録を比較して判断します。"}
            }
          }
          JSON
          slot_http=$(curl -L -sS -w '%{http_code}' -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d @/tmp/slot-body.json "$BASE/api/magi/dialogue" -o /tmp/slot-dialogue.json || true)
          cat /tmp/slot-dialogue.json; echo
          echo "SINGLE-SLOT DIALOGUE HTTP $slot_http"
          if [ "$slot_http" -lt 200 ] || [ "$slot_http" -ge 300 ]; then
            exit 22
          fi
          jq -e '
            (.dialogue|length)==3 and
            (.dialogueFallbackUsed != true) and
            .dialogue[0].target=="BALTHASAR-2" and
            .dialogue[1].target=="CASPER-3" and
            .dialogue[2].target=="MELCHIOR-1" and
            (.challenges.melchior|length)>=1 and
            (.challenges.balthasar|length)>=1 and
            (.challenges.casper|length)>=1 and
            ([.dialogue[].statement|contains("3番")]|all) and
            ([.dialogue[].statement|contains("大野 竜暉")]|all) and
            ([.dialogue[].statement|test("お前|てめえ")]|any|not) and
            ([.dialogue[].statement|test("3番の3番|大野 竜暉と大野 竜暉")]|any|not)
          ' /tmp/slot-dialogue.json >/dev/null
          echo 'PRODUCTION SINGLE-SLOT DIRECT DIALOGUE: PASS'
