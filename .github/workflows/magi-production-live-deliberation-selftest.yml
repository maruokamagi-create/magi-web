name: MAGI Production Live Deliberation Selftest

on:
  push:
    branches: [main]
    paths:
      - 'api/magi-gateway.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'engine/magi-engine-v1.js'
      - 'server/api/magi/**'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
      - '.github/workflows/magi-production-sequential-suite.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  exact-live-best-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment
        run: sleep 45
      - name: Execute staged live best-order in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          run_stage(){
            stage="$1"
            out="/tmp/lineup-${stage}.json"
            curl -L --fail --max-time 55 -sS "$BASE/api/magi-live-deliberation-selftest?mode=lineup&stage=${stage}&session=${SESSION}" -o "$out"
            cat "$out"; echo
            jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="lineup" and .stage==$stage' "$out" >/dev/null
          }

          run_stage primary
          jq -e '
            .evidence.count==14 and
            .evidence.selectionKind=="FULL_LINEUP" and
            .evidence.battingOrderSplitStatus=="COMPLETE" and
            .evidence.appearanceFieldingStatus=="COMPLETE" and
            .evidence.appearanceStatus=="COMPLETE" and
            .evidence.fieldingStatus=="COMPLETE" and
            .evidence.normalizedObservationStatus=="COMPLETE"
          ' /tmp/lineup-primary.json >/dev/null

          run_stage cross
          jq -e '
            (.cross.challengeCounts.melchior>0) and
            (.cross.challengeCounts.balthasar>0) and
            (.cross.challengeCounts.casper>0)
          ' /tmp/lineup-cross.json >/dev/null

          # PRIMARY and SECOND both carry the full live Evidence. FreeTier
          # input-token quota is per model per minute, so do not fire SECOND
          # immediately after PRIMARY and force unnecessary reserve fallbacks.
          sleep 70
          run_stage second
          jq -e '
            (.second.melchior.candidatePlayers|length)==9 and
            (.second.balthasar.candidatePlayers|length)==9 and
            (.second.casper.candidatePlayers|length)==9
          ' /tmp/lineup-second.json >/dev/null

          run_stage final
          jq -e '
            .finalStatus=="LINEUP_RESULT" and
            (.lineup|length==9) and
            (([.lineup[].name]|unique|length)==9) and
            (([.lineup[].position]|unique|length)==9) and
            (([.lineup[].position]|sort)==(["一","三","中","二","右","左","投","捕","遊"]|sort)) and
            ([.lineup[].positionEvidence | (.officialStarts>0 or .practiceFirstStarts>0)] | all) and
            (.digest|length==16)
          ' /tmp/lineup-final.json >/dev/null
          echo 'PRODUCTION STAGED LIVE BEST-ORDER DELIBERATION: PASS'

  exact-live-closer:
    needs: exact-live-best-order
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cool down provider capacity
        run: sleep 75
      - name: Execute live closer consultation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --max-time 125 -sS "$BASE/api/magi-live-deliberation-selftest?mode=closer" -o /tmp/closer.json
          cat /tmp/closer.json; echo
          jq -e '.ok==true and .mode=="closer" and .closer.sakataSaveCount=="2" and .closer.saveEvidenceUsed==true' /tmp/closer.json >/dev/null
          echo 'PRODUCTION CLOSER DELIBERATION: PASS'

  exact-natural-third:
    needs: exact-live-closer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cool down provider capacity
        run: sleep 90
      - name: Execute exact natural third-batter E2E
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --max-time 125 -sS "$BASE/api/magi-live-deliberation-selftest?mode=naturalThird" -o /tmp/third.json
          cat /tmp/third.json; echo
          jq -e '.ok==true and .mode=="naturalThird" and .naturalThird.question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and .naturalThird.evidence.count==14 and .naturalThird.evidence.selectionKind=="BATTING_ORDER" and (.naturalThird.status=="SELECTION_RESULT" or .naturalThird.status=="SELECTION_SPLIT") and (.naturalThird.recommendedCandidates|length>0)' /tmp/third.json >/dev/null
          echo 'PRODUCTION NATURAL THIRD-BATTER DELIBERATION: PASS'


  exact-live-team-review:
    needs: exact-natural-third
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cool down provider capacity
        run: sleep 75
      - name: Execute exact natural team-review E2E
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --max-time 125 -sS "$BASE/api/magi-live-deliberation-selftest?mode=teamReview" -o /tmp/team-review.json
          cat /tmp/team-review.json; echo
          jq -e '
            .ok==true and .mode=="teamReview" and
            .question=="今の丸岡中の弱点は何？" and
            .evidence.count==14 and
            .evidence.reviewKind=="TEAM_REVIEW" and
            .evidence.selectionKind=="TEAM_REVIEW" and
            (.primary.melchior.publicStatement|length>0) and
            (.primary.balthasar.publicStatement|length>0) and
            (.primary.casper.publicStatement|length>0)
          ' /tmp/team-review.json >/dev/null
          echo 'PRODUCTION EXACT LIVE TEAM-REVIEW PRIMARY BATCH: PASS'
