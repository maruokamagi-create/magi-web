name: MAGI Production Live Deliberation Selftest

on:
  push:
    branches: [main]
    paths:
      - 'api/magi-live-deliberation-selftest.js'
      - 'server/api/magi/core.js'
      - 'server/api/magi/persona.js'
      - 'server/api/magi/orchestrate.js'
      - 'server/api/magi/_selection-live-evidence.js'
      - 'server/api/magi/_canonical-cache.js'
      - 'magi-formal-runner-v373.js'
      - 'magi-app-bootstrap-v363.js'
      - 'main-live-answer-v362.js'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
  workflow_dispatch:

jobs:
  exact-live-best-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment
        run: sleep 45

      - name: Execute live best-order and natural third-batter consultation in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          # This endpoint already executes the full live best-order flow plus the exact
          # natural third-batter consultation. Run once here: a second immediate run
          # can hit the model provider rate limit and does not add semantic coverage.
          curl -L --fail --max-time 125 --retry 3 --retry-delay 8 --retry-all-errors -sS "$BASE/api/magi-live-deliberation-selftest" -o /tmp/result.json
          cat /tmp/result.json; echo

          jq -e '
            .ok==true and
            .question=="今の丸岡中のベストオーダーを、守備位置込みで審議して" and
            .evidence.count==14 and
            .evidence.selectionKind=="FULL_LINEUP" and
            .finalStatus=="LINEUP_RESULT" and
            (.lineup|length==9) and
            (([.lineup[].name]|unique|length)==9) and
            (.digest|length==16) and
            .naturalThird.question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and
            .naturalThird.evidence.count==14 and
            .naturalThird.evidence.selectionKind=="BATTING_ORDER" and
            (.naturalThird.status=="SELECTION_RESULT" or .naturalThird.status=="SELECTION_SPLIT") and
            (.naturalThird.recommendedCandidates|length>0)
          ' /tmp/result.json >/dev/null

          echo 'PRODUCTION EXACT LIVE BEST-ORDER DELIBERATION: PASS'
          echo 'PRODUCTION NATURAL THIRD-BATTER DELIBERATION: PASS'
