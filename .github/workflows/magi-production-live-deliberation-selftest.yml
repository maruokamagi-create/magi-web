# Production acceptance gate. Verification trigger after staged TEAM_REVIEW merge; no behavior change.
name: MAGI Production Live Deliberation Selftest

on:
  push:
    branches: [main]
    paths:
      - 'api/magi-gateway.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'engine/magi-engine-v1.js'
      - 'server/api/magi/**'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
      - '.github/workflows/magi-production-sequential-suite.yml'
      - '.github/workflows/magi-production-full-lineup-smoke.yml'
      - '.github/workflows/magi-production-reproducibility-smoke.yml'
      - 'scripts/validate-production-full-lineup-final.jq'
      - 'scripts/test-production-full-lineup-smoke-contract.mjs'
  workflow_call:
  workflow_dispatch:

jobs:
  production-revision-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify production revision
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-revision-ready"
          out='/tmp/production-revision-ready.json'
          for attempt in 1 2 3 4 5; do
            code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=lineup&stage=prepare&session=${SESSION}" -o "$out" || true)"
            cat "$out" 2>/dev/null || true; echo
            if [ "$code" = "200" ] && jq -e --arg expected_sha "$GITHUB_SHA" '
              .ok==true and
              .mode=="lineup" and
              .stage=="PREPARE" and
              .deployment.sha==$expected_sha and
              .deployment.env=="production"
            ' "$out" >/dev/null 2>&1; then
              echo 'PRODUCTION REVISION READY: PASS'
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 12; fi
          done
          echo "Production is not serving GITHUB_SHA=${GITHUB_SHA}; skip provider-heavy acceptance." >&2
          exit 1

  exact-live-best-order:
    needs: production-revision-ready
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Execute staged live best-order in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-lineup"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/lineup-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=lineup&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="lineup" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit"))' "$out" >/dev/null 2>&1; then
                echo "Provider rate limit on this stage; stop immediately without repeating the same Gemini call." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e --arg expected_sha "$GITHUB_SHA" '.deployment.sha==$expected_sha and .deployment.env=="production"' /tmp/lineup-prepare.json >/dev/null
          jq -e '
            .evidence.count==14 and
            .evidence.selectionKind=="FULL_LINEUP" and
            .evidence.battingOrderSplitStatus=="COMPLETE" and
            .evidence.appearanceFieldingStatus=="COMPLETE" and
            .evidence.appearanceStatus=="COMPLETE" and
            .evidence.fieldingStatus=="COMPLETE" and
            .evidence.normalizedObservationStatus=="COMPLETE"
          ' /tmp/lineup-prepare.json >/dev/null

          run_stage primary 3
          jq -e '
            ([.primary[].candidatePlayers|length] | all(.==9)) and
            (([.primary[]|tostring]|join("\n")) as $text |
              ($text|test("得点効率|勝てる確率|勝率を高め|勝利の確率|確実な勝利|確実な勝ち筋|勝ちへの道|勝利に直結|得点力.{0,10}(?:最大化|発揮)|勝利(?:へ|に).{0,12}近づ|得点機会.{0,24}(創出|増加)|(?:打率|OPS).{0,24}安定|守備.{0,24}安定|連携.{0,24}(深め|高め)|[1-9１-９]番.{0,18}固定")|not))
          ' /tmp/lineup-primary.json >/dev/null

          run_stage cross
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/lineup-cross.json >/dev/null

          run_stage second 3
          jq -e '
            ([.second[].candidatePlayers|length] | all(.==9)) and
            (([.second[]|tostring]|join("\n")) as $text |
              ($text|test("得点効率|勝てる確率|勝率を高め|勝利の確率|確実な勝利|確実な勝ち筋|勝ちへの道|勝利に直結|得点力.{0,10}(?:最大化|発揮)|勝利(?:へ|に).{0,12}近づ|得点機会.{0,24}(創出|増加)|(?:打率|OPS).{0,24}安定|守備.{0,24}安定|連携.{0,24}(深め|高め)|[1-9１-９]番.{0,18}固定")|not))
          ' /tmp/lineup-second.json >/dev/null

          run_stage final
          jq -e '
            (
              (
                .finalStatus=="LINEUP_RESULT" and
                .fieldingStatus=="COMPLETE" and
                (.lineup|length==9) and
                (([.lineup[].name]|unique|length)==9) and
                (([.lineup[].position]|unique|length)==9) and
                (([.lineup[].position]|sort)==(["一","三","中","二","右","左","投","捕","遊"]|sort)) and
                ([.lineup[].positionEvidence | (.officialStarts>0 or .practiceFirstStarts>0)] | all)
              )
              or
              (
                .finalStatus=="LINEUP_REVIEW_REQUIRED" and
                .fieldingStatus=="NOT_EVALUATED" and
                .reviewReason=="FULL_LINEUP_DEADLOCK_1_1_1" and
                .deliberationDecision=="DEADLOCK" and
                .finalVote=="1-1-1" and
                (.lineup|length==0)
              )
            ) and
            (.digest|length==16)
          ' /tmp/lineup-final.json >/dev/null
          echo 'PRODUCTION STAGED LIVE BEST-ORDER DELIBERATION: PASS'

  exact-live-closer:
    needs: [production-revision-ready, exact-live-best-order]
    if: ${{ always() && !cancelled() && needs.production-revision-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cool down provider capacity
        run: sleep 75
      - name: Execute staged closer consultation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-closer"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/closer-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=closer&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="closer" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("PERSONA_BATCH_VALIDATION_FAILED"))' "$out" >/dev/null 2>&1; then
                echo "Deterministic persona validation failure; do not retry the same stage." >&2
                return 1
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit"))' "$out" >/dev/null 2>&1; then
                echo "Provider rate limit on this stage; stop immediately without repeating the same Gemini call." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "closer stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e --arg expected_sha "$GITHUB_SHA" '.deployment.sha==$expected_sha and .deployment.env=="production"' /tmp/closer-prepare.json >/dev/null
          jq -e '
            .question=="クローザーは誰がいい？" and
            .evidence.count==14 and
            .evidence.selectionKind=="PITCHING_ROLE" and
            .evidence.sakataSaveCount=="2" and
            .evidence.coachObservationStatus=="COMPLETE"
          ' /tmp/closer-prepare.json >/dev/null

          run_stage primary 3
          jq -e '
            ([.primary[].candidatePlayers|length] | all(.>0)) and
            (([.primary[]|tostring]|join("\n")) as $text |
              ($text|test("(?:大野|大久保|井坂|坂田|嶋田|武澤|橋向|上村|長侶|中嶋|吉田|鰐渕|武田).{0,8}(?:くん|君)|確率的優位|勝利の確率|終盤の競った場面|長いイニングを任せ|信頼できる|半年後|将来的なチーム|投手層.{0,12}厚み|選手層.{0,12}広げ|チーム全体の成長|チーム全体.{0,20}負担|役割の分散|今後.{0,18}(?:成長|育成)|(?:大切に)?育て|調整の過程|別の投手.{0,24}成長|過度な依存|過度な負担|負担集中|特定の選手への負担|勝利に直結|勝ちに直結|勝ち筋|勝ちパターン|防御率.{0,45}安定している")|not))
          ' /tmp/closer-primary.json >/dev/null

          run_stage cross 3
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/closer-cross.json >/dev/null

          run_stage second 3
          jq -e '
            ([.second[].candidatePlayers|length] | all(.>0)) and
            (([.second[]|tostring]|join("\n")) as $text |
              ($text|test("(?:大野|大久保|井坂|坂田|嶋田|武澤|橋向|上村|長侶|中嶋|吉田|鰐渕|武田).{0,8}(?:くん|君)|確率的優位|勝利の確率|終盤の競った場面|長いイニングを任せ|信頼できる|半年後|将来的なチーム|投手層.{0,12}厚み|選手層.{0,12}広げ|チーム全体の成長|チーム全体.{0,20}負担|役割の分散|今後.{0,18}(?:成長|育成)|(?:大切に)?育て|調整の過程|別の投手.{0,24}成長|過度な依存|過度な負担|負担集中|特定の選手への負担|勝利に直結|勝ちに直結|勝ち筋|勝ちパターン|防御率.{0,45}安定している")|not))
          ' /tmp/closer-second.json >/dev/null

          run_stage final 3
          jq -e '
            .question=="クローザーは誰がいい？" and
            .closer.sakataSaveCount=="2" and
            .closer.saveEvidenceUsed==true and
            (.closer.recommendedCandidates|length>0) and
            ([.closer.majorReasons[]?|select(test("坂田 暉馬.*2セーブ"))]|length>0) and
            ((.closer.majorReasons|join("\n")) as $reasons |
              ($reasons|test("問いかけ|指摘に対する回答|指摘された|指摘の通り|勝ちに行くため|この選択を変える理由|私の判断は変え|僕の判断はこのまま|将来のチーム力|チーム全体.{0,20}負担|役割の分散|今後.{0,18}(?:成長|育成)|(?:大切に)?育て|調整の過程|別の投手.{0,24}成長|確率的優位|競った場面|勝利に直結|勝ちに直結|勝ち筋|勝ちパターン")|not)) and
            ((.closer.warnings|join("\n")|test("過度な負担|負担集中|特定の選手への負担")|not)) and
            (.digest|length==16)
          ' /tmp/closer-final.json >/dev/null
          echo 'PRODUCTION STAGED CLOSER DELIBERATION: PASS'

  exact-natural-third:
    needs: [production-revision-ready, exact-live-closer]
    if: ${{ always() && !cancelled() && needs.production-revision-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cool down provider capacity
        run: sleep 90
      - name: Execute staged natural third-batter E2E
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-natural-third"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/natural-third-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=naturalThird&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="naturalThird" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("PERSONA_BATCH_VALIDATION_FAILED"))' "$out" >/dev/null 2>&1; then
                echo "Deterministic persona validation failure; do not retry the same stage." >&2
                return 1
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit"))' "$out" >/dev/null 2>&1; then
                echo "Provider rate limit on this stage; stop immediately without repeating the same Gemini call." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "natural-third stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e --arg expected_sha "$GITHUB_SHA" '.deployment.sha==$expected_sha and .deployment.env=="production"' /tmp/natural-third-prepare.json >/dev/null
          jq -e '
            .question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and
            .evidence.count==14 and
            .evidence.selectionKind=="BATTING_ORDER"
          ' /tmp/natural-third-prepare.json >/dev/null

          run_stage primary 3
          jq -e '
            ([.primary[].candidatePlayers|length] | all(.>0)) and
            (([.primary[]|tostring]|join("\n")) as $text |
              ($text|test("(?:大野|大久保|井坂|坂田|嶋田|武澤|橋向|上村|長侶|中嶋|吉田|鰐渕|武田).{0,8}(?:くん|君)|ポジション適性.{0,18}(?:豊富|高い)|最も確実な選択肢|定着度が高い|役割.{0,12}定着|打順の軸.{0,12}安定|3番.{0,18}経験値|実戦経験.{0,18}(?:豊富|蓄積)|戦術.{0,24}合致|固定されて|継続起用|打順の継続性|崩す理由にはなら|チームの形.{0,18}馴染|実績.{0,36}(?:その位置に置く.{0,18}確実|選択.{0,18}確実)|チームの安定.{0,18}(?:つなが|可能性)|(?:他の記録が示されない限り|他の記録がない限り).{0,48}(?:変更|変える).{0,18}理由は(?:ない|ありません)|勢い.{0,18}(?:落|陰り)|低調(?:な状態)?|状態の波|安定した打撃|全体のつながり.{0,24}影響|半年後|選手(?:たち)?の成長.{0,18}見守")|not))
          ' /tmp/natural-third-primary.json >/dev/null

          run_stage cross 3
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/natural-third-cross.json >/dev/null

          run_stage second 3
          jq -e '
            ([.second[].candidatePlayers|length] | all(.>0)) and
            (([.second[]|tostring]|join("\n")) as $text |
              ($text|test("(?:大野|大久保|井坂|坂田|嶋田|武澤|橋向|上村|長侶|中嶋|吉田|鰐渕|武田).{0,8}(?:くん|君)|ポジション適性.{0,18}(?:豊富|高い)|最も確実な選択肢|定着度が高い|役割.{0,12}定着|打順の軸.{0,12}安定|3番.{0,18}経験値|実戦経験.{0,18}(?:豊富|蓄積)|戦術.{0,24}合致|固定されて|継続起用|打順の継続性|崩す理由にはなら|チームの形.{0,18}馴染|実績.{0,36}(?:その位置に置く.{0,18}確実|選択.{0,18}確実)|チームの安定.{0,18}(?:つなが|可能性)|(?:他の記録が示されない限り|他の記録がない限り).{0,48}(?:変更|変える).{0,18}理由は(?:ない|ありません)|勢い.{0,18}(?:落|陰り)|低調(?:な状態)?|状態の波|安定した打撃|全体のつながり.{0,24}影響|半年後|選手(?:たち)?の成長.{0,18}見守")|not))
          ' /tmp/natural-third-second.json >/dev/null

          run_stage final 3
          jq -e '
            .question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and
            .final.mode=="SELECTION" and
            (.final.status=="SELECTION_RESULT" or .final.status=="SELECTION_SPLIT") and
            (.final.recommendedCandidates|length>0) and
            ((.final.majorReasons|join("\n"))|test("最も確実な選択肢|役割.{0,12}定着|打順の軸.{0,12}安定|3番.{0,18}経験値|実戦経験.{0,18}(?:豊富|蓄積)|戦術.{0,24}合致|固定されて|継続起用|打順の継続性|崩す理由にはなら|チームの形.{0,18}馴染|実績.{0,36}(?:その位置に置く.{0,18}確実|選択.{0,18}確実)|チームの安定.{0,18}(?:つなが|可能性)|(?:他の記録が示されない限り|他の記録がない限り).{0,48}(?:変更|変える).{0,18}理由は(?:ない|ありません)|勢い.{0,18}(?:落|陰り)|低調(?:な状態)?|状態の波|安定した打撃|全体のつながり.{0,24}影響|選手の成長.{0,18}見守|半年後")|not) and
            (.digest|length==16)
          ' /tmp/natural-third-final.json >/dev/null
          echo 'PRODUCTION STAGED NATURAL THIRD-BATTER DELIBERATION: PASS'


  exact-live-team-review:
    needs: [production-revision-ready, exact-natural-third]
    if: ${{ always() && !cancelled() && needs.production-revision-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cool down provider capacity
        run: sleep 75
      - name: Execute staged natural team-review E2E
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-team-review"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/team-review-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=teamReview&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="teamReview" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("PERSONA_BATCH_VALIDATION_FAILED"))' "$out" >/dev/null 2>&1; then
                echo "Deterministic persona validation failure; do not retry the same team-review stage." >&2
                return 1
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit"))' "$out" >/dev/null 2>&1; then
                echo "Provider rate limit on this stage; stop immediately without repeating the same Gemini call." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "team-review stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e --arg expected_sha "$GITHUB_SHA" '.deployment.sha==$expected_sha and .deployment.env=="production"' /tmp/team-review-prepare.json >/dev/null
          jq -e '
            .question=="今の丸岡中の弱点は何？" and
            .evidence.count==14 and
            .evidence.reviewKind=="TEAM_REVIEW" and
            .evidence.selectionKind=="TEAM_REVIEW"
          ' /tmp/team-review-prepare.json >/dev/null

          run_stage primary 3
          jq -e '
            (.primary.melchior.publicStatement|length>0) and
            (.primary.balthasar.publicStatement|length>0) and
