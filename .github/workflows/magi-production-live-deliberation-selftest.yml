name: MAGI Production Live Deliberation Selftest

on:
  workflow_call:
  workflow_dispatch:

jobs:
  exact-live-best-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment
        run: sleep 45

      - name: Execute live best-order and closer consultation in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --max-time 125 --retry 3 --retry-delay 8 --retry-all-errors -sS "$BASE/api/magi-live-deliberation-selftest" -o /tmp/result.json
          cat /tmp/result.json; echo

          jq -e '
            .ok==true and
            .question=="今の丸岡中のベストオーダーを、守備位置込みで審議して" and
            .evidence.count==14 and
            .evidence.selectionKind=="FULL_LINEUP" and
            .finalStatus=="LINEUP_RESULT" and
            (.lineup|length==9) and
            (([.lineup[].name]|unique|length)==9) and
            (.digest|length==16)
          ' /tmp/result.json >/dev/null

          echo 'PRODUCTION EXACT LIVE BEST-ORDER DELIBERATION: PASS'
          echo 'PRODUCTION CLOSER DELIBERATION: PASS'\n\n      - name: Execute exact natural third-batter E2E separately\n        shell: bash\n        run: |\n          set -euo pipefail\n          BASE='https://magi-web.vercel.app'\n          sleep 20\n          curl -L --fail --max-time 125 --retry 3 --retry-delay 8 --retry-all-errors -sS \"$BASE/api/magi-live-deliberation-selftest?naturalThird=1\" -o /tmp/third.json\n          cat /tmp/third.json; echo\n          jq -e '\n            .naturalThird.question==\"3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？\" and\n            .naturalThird.evidence.count==14 and\n            .naturalThird.evidence.selectionKind==\"BATTING_ORDER\" and\n            (.naturalThird.status==\"SELECTION_RESULT\" or .naturalThird.status==\"SELECTION_SPLIT\") and\n            (.naturalThird.recommendedCandidates|length>0)\n          ' /tmp/third.json >/dev/null\n          echo 'PRODUCTION NATURAL THIRD-BATTER DELIBERATION: PASS'
