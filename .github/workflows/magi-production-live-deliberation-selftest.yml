# Production acceptance gate. Verification trigger after staged TEAM_REVIEW merge; no behavior change.
name: MAGI Production Live Deliberation Selftest

on:
  push:
    branches: [main]
    paths:
      - 'api/magi-gateway.js'
      - 'api/magi-live-deliberation-selftest.js'
      - 'engine/magi-engine-v1.js'
      - 'server/api/magi/**'
      - '.github/workflows/magi-production-live-deliberation-selftest.yml'
      - '.github/workflows/magi-production-sequential-suite.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  exact-live-best-order:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production deployment
        run: sleep 45
      - name: Execute staged live best-order in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-lineup"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/lineup-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=lineup&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="lineup" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit")) and ((.error//"")|contains("[quota=DAY"))' "$out" >/dev/null 2>&1; then
                echo "Daily provider quota exhausted for this stage; do not hot-loop." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e '
            .evidence.count==14 and
            .evidence.selectionKind=="FULL_LINEUP" and
            .evidence.battingOrderSplitStatus=="COMPLETE" and
            .evidence.appearanceFieldingStatus=="COMPLETE" and
            .evidence.appearanceStatus=="COMPLETE" and
            .evidence.fieldingStatus=="COMPLETE" and
            .evidence.normalizedObservationStatus=="COMPLETE"
          ' /tmp/lineup-prepare.json >/dev/null

          run_stage primary 3
          jq -e '([.primary[].candidatePlayers|length] | all(.==9))' /tmp/lineup-primary.json >/dev/null

          run_stage cross
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/lineup-cross.json >/dev/null

          run_stage second 3
          jq -e '([.second[].candidatePlayers|length] | all(.==9))' /tmp/lineup-second.json >/dev/null

          run_stage final
          jq -e '
            .finalStatus=="LINEUP_RESULT" and
            (.lineup|length==9) and
            (([.lineup[].name]|unique|length)==9) and
            (([.lineup[].position]|unique|length)==9) and
            (([.lineup[].position]|sort)==(["一","三","中","二","右","左","投","捕","遊"]|sort)) and
            ([.lineup[].positionEvidence | (.officialStarts>0 or .practiceFirstStarts>0)] | all) and
            (.digest|length==16)
          ' /tmp/lineup-final.json >/dev/null
          echo 'PRODUCTION STAGED LIVE BEST-ORDER DELIBERATION: PASS'

  exact-live-closer:
    needs: exact-live-best-order
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cool down provider capacity
        run: sleep 75
      - name: Execute staged closer consultation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-closer"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/closer-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=closer&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="closer" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("PERSONA_BATCH_VALIDATION_FAILED"))' "$out" >/dev/null 2>&1; then
                echo "Deterministic persona validation failure; do not retry the same stage." >&2
                return 1
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit")) and ((.error//"")|contains("[quota=DAY"))' "$out" >/dev/null 2>&1; then
                echo "Daily provider quota exhausted for this stage; do not hot-loop." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "closer stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e '
            .question=="クローザーは誰がいい？" and
            .evidence.count==14 and
            .evidence.selectionKind=="PITCHING_ROLE" and
            .evidence.sakataSaveCount=="2" and
            .evidence.coachObservationStatus=="COMPLETE"
          ' /tmp/closer-prepare.json >/dev/null

          run_stage primary 3
          jq -e '([.primary[].candidatePlayers|length] | all(.>0))' /tmp/closer-primary.json >/dev/null

          run_stage cross 3
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/closer-cross.json >/dev/null

          run_stage second 3
          jq -e '([.second[].candidatePlayers|length] | all(.>0))' /tmp/closer-second.json >/dev/null

          run_stage final 3
          jq -e '
            .question=="クローザーは誰がいい？" and
            .closer.sakataSaveCount=="2" and
            .closer.saveEvidenceUsed==true and
            (.closer.recommendedCandidates|length>0) and
            (.digest|length==16)
          ' /tmp/closer-final.json >/dev/null
          echo 'PRODUCTION STAGED CLOSER DELIBERATION: PASS'

  exact-natural-third:
    needs: exact-live-closer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cool down provider capacity
        run: sleep 90
      - name: Execute staged natural third-batter E2E
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-natural-third"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/natural-third-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=naturalThird&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="naturalThird" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("PERSONA_BATCH_VALIDATION_FAILED"))' "$out" >/dev/null 2>&1; then
                echo "Deterministic persona validation failure; do not retry the same stage." >&2
                return 1
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit")) and ((.error//"")|contains("[quota=DAY"))' "$out" >/dev/null 2>&1; then
                echo "Daily provider quota exhausted for this stage; do not hot-loop." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "natural-third stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e '
            .question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and
            .evidence.count==14 and
            .evidence.selectionKind=="BATTING_ORDER"
          ' /tmp/natural-third-prepare.json >/dev/null

          run_stage primary 3
          jq -e '([.primary[].candidatePlayers|length] | all(.>0))' /tmp/natural-third-primary.json >/dev/null

          run_stage cross 3
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/natural-third-cross.json >/dev/null

          run_stage second 3
          jq -e '([.second[].candidatePlayers|length] | all(.>0))' /tmp/natural-third-second.json >/dev/null

          run_stage final 3
          jq -e '
            .question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and
            .final.mode=="SELECTION" and
            (.final.status=="SELECTION_RESULT" or .final.status=="SELECTION_SPLIT") and
            (.final.recommendedCandidates|length>0) and
            (.digest|length==16)
          ' /tmp/natural-third-final.json >/dev/null
          echo 'PRODUCTION STAGED NATURAL THIRD-BATTER DELIBERATION: PASS'


  exact-live-team-review:
    needs: exact-natural-third
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cool down provider capacity
        run: sleep 75
      - name: Execute staged natural team-review E2E
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-team-review"

          run_stage(){
            stage="$1"
            max_attempts="${2:-1}"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              out="/tmp/team-review-${stage}.json"
              code="$(curl -L --max-time 58 -sS -w '%{http_code}' "$BASE/api/magi-live-deliberation-selftest?mode=teamReview&stage=${stage}&session=${SESSION}" -o "$out" || true)"
              cat "$out" 2>/dev/null || true; echo
              if [ "$code" = "200" ] && jq -e --arg stage "$(echo "$stage" | tr '[:lower:]' '[:upper:]')" '.ok==true and .mode=="teamReview" and .stage==$stage' "$out" >/dev/null 2>&1; then
                return 0
              fi
              if jq -e '((.error//"")|contains("provider_rate_limit")) and ((.error//"")|contains("[quota=DAY"))' "$out" >/dev/null 2>&1; then
                echo "Daily provider quota exhausted for this stage; do not hot-loop." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "team-review stage $stage failed after $attempt outer request attempt(s), HTTP=$code" >&2
                return 1
              fi
              sleep $((attempt*12))
              attempt=$((attempt+1))
            done
          }

          run_stage prepare
          jq -e '
            .question=="今の丸岡中の弱点は何？" and
            .evidence.count==14 and
            .evidence.reviewKind=="TEAM_REVIEW" and
            .evidence.selectionKind=="TEAM_REVIEW"
          ' /tmp/team-review-prepare.json >/dev/null

          run_stage primary 3
          jq -e '
            (.primary.melchior.publicStatement|length>0) and
            (.primary.balthasar.publicStatement|length>0) and
            (.primary.casper.publicStatement|length>0) and
            (([.primary[]|tostring]|join("\n")) as $text |
              ($text|test("半年後|1年後|勝負の分かれ道|得点源が限定|得点力.{0,24}直結|数値の偏りこそ.{0,24}弱点|打線の偏り.{0,24}弱点|育成を疎か|チーム全体を.{0,24}育て")|not))
          ' /tmp/team-review-primary.json >/dev/null

          run_stage cross 3
          jq -e '([.cross.challengeCounts[]] | all(.>0))' /tmp/team-review-cross.json >/dev/null

          run_stage second 3
          jq -e '
            (.second.melchior.publicStatement|length>0) and
            (.second.balthasar.publicStatement|length>0) and
            (.second.casper.publicStatement|length>0) and
            (([.second[]|tostring]|join("\n")) as $text |
              ($text|test("半年後|1年後|勝負の分かれ道|得点源が限定|得点力.{0,24}直結|数値の偏りこそ.{0,24}弱点|打線の偏り.{0,24}弱点|育成を疎か|チーム全体を.{0,24}育て")|not))
          ' /tmp/team-review-second.json >/dev/null

          run_stage final 3
          jq -e '
            .question=="今の丸岡中の弱点は何？" and
            .final.mode=="REVIEW" and
            .final.reviewKind=="TEAM_REVIEW" and
            (.final.status|length>0) and
            (.final.recommendation|length>0) and
            ([.final.majorReasons[]?|select(test("直近6試合.*安打0"))]|length>0) and
            ((.final.majorReasons|join("\n")|test("チームの弱点である|戦術的弱点|総合力と育成面での課題|得点力.{0,24}直結"))|not) and
            (.final.recommendation|test("恒常的な弱点、得点への因果までは断定しない")) and
            (.digest|length==16)
          ' /tmp/team-review-final.json >/dev/null
          echo 'PRODUCTION STAGED LIVE TEAM-REVIEW DELIBERATION: PASS'
