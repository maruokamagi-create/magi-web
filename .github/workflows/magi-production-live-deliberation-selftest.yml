name: MAGI Production Live Deliberation Selftest

on:
  workflow_call:
  workflow_dispatch:

jobs:
  exact-live-best-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production deployment
        run: sleep 45

      - name: Execute live best-order in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          curl -L --fail --max-time 125 --retry 3 --retry-delay 8 --retry-all-errors -sS "$BASE/api/magi-live-deliberation-selftest?mode=lineup" -o /tmp/lineup.json
          cat /tmp/lineup.json; echo
          jq -e '
            .ok==true and
            .mode=="lineup" and
            .evidence.count==14 and
            .evidence.selectionKind=="FULL_LINEUP" and
            .finalStatus=="LINEUP_RESULT" and
            (.lineup|length==9) and
            (([.lineup[].name]|unique|length)==9) and
            (.digest|length==16)
          ' /tmp/lineup.json >/dev/null
          echo 'PRODUCTION EXACT LIVE BEST-ORDER DELIBERATION: PASS'

      - name: Execute live closer consultation separately
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          sleep 10
          curl -L --fail --max-time 125 --retry 3 --retry-delay 8 --retry-all-errors -sS "$BASE/api/magi-live-deliberation-selftest?mode=closer" -o /tmp/closer.json
          cat /tmp/closer.json; echo
          jq -e '
            .ok==true and
            .mode=="closer" and
            .closer.sakataSaveCount=="2" and
            .closer.saveEvidenceUsed==true
          ' /tmp/closer.json >/dev/null
          echo 'PRODUCTION CLOSER DELIBERATION: PASS'

      - name: Execute exact natural third-batter E2E separately
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magi-web.vercel.app'
          sleep 10
          curl -L --fail --max-time 125 --retry 3 --retry-delay 8 --retry-all-errors -sS "$BASE/api/magi-live-deliberation-selftest?mode=naturalThird" -o /tmp/third.json
          cat /tmp/third.json; echo
          jq -e '
            .ok==true and
            .mode=="naturalThird" and
            .naturalThird.question=="3番を誰にするか迷ってる。4番の大久保 陽翔につなぐことを考えると、誰がいいと思う？" and
            .naturalThird.evidence.count==14 and
            .naturalThird.evidence.selectionKind=="BATTING_ORDER" and
            (.naturalThird.status=="SELECTION_RESULT" or .naturalThird.status=="SELECTION_SPLIT") and
            (.naturalThird.recommendedCandidates|length>0)
          ' /tmp/third.json >/dev/null
          echo 'PRODUCTION NATURAL THIRD-BATTER DELIBERATION: PASS'
