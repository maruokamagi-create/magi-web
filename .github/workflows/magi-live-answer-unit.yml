name: MAGI Live Answer Unit Selftest

on:
  push:
    branches: [main]
    paths:
      - 'server/api/magi/_live-answer.js'
      - 'server/api/magi/_strict-pitching-answer.js'
      - 'scripts/test-live-answer-routing.mjs'
      - '.github/workflows/magi-live-answer-unit.yml'
  workflow_dispatch:

jobs:
  exact-answer-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run live answer unit cases
        run: node --experimental-default-type=module scripts/test-live-answer-routing.mjs
