<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Live Pitching Answer Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 36px}h1{font-size:30px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}.actions{margin-top:12px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:13px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.q{font-size:18px;font-weight:800;margin-bottom:8px}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55;overflow-wrap:anywhere}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>MAGI Live Pitching Answer Test</h1><div class="sub">投手質問を、質問理解 → シーズン判定 → Google Driveの正本XLSM → 投手成績セル取得 → 回答まで通して検証します。期待値は既存の正式集計資料とも照合した値です。数値取得・回答整形ではGeminiを使いません。</div><section class="card"><b>今回の8ケース</b><div class="muted">今期の防御率・奪三振・投球回・与四球・投手成績まとめ、さらに2025-2026旧チームへの期間切替を確認します。</div><div class="actions"><button id="run">8ケース開始</button></div></section><section class="card"><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b class="ok" id="pass">0</b></div><div class="stat"><span>FAIL</span><b class="bad" id="fail">0</b></div></div><div class="muted" id="meta" style="margin-top:10px">未実行</div></section><section class="card" id="list"></section></div><script>
const cases=[
 {id:'P01',q:'橋向の今期防御率教えて',route:'PITCHING_LOOKUP',season:'current',tests:[/橋向 結都/,/防御率は2(?:\.0+)?です/]},
 {id:'P02',q:'陽翔の今期防御率教えて',route:'PITCHING_LOOKUP',season:'current',tests:[/大久保 陽翔/,/防御率は3\.89です/]},
 {id:'P03',q:'陽翔の今期奪三振教えて',route:'PITCHING_LOOKUP',season:'current',tests:[/大久保 陽翔/,/奪三振は15です/]},
 {id:'P04',q:'中嶋玲月の今期投球回教えて',route:'PITCHING_LOOKUP',season:'current',tests:[/中嶋 玲月/,/投球回は5(?:\.0)?です/]},
 {id:'P05',q:'大久保夢翔の今期与四球教えて',route:'PITCHING_LOOKUP',season:'current',tests:[/大久保 夢翔/,/与四球は8です/]},
 {id:'P06',q:'橋向の今期投手成績まとめて',route:'PITCHING_LOOKUP',season:'current',tests:[/橋向 結都/,/防御率/,/投球回/,/奪三振/]},
 {id:'P07',q:'陽翔の2025-2026防御率教えて',route:'PITCHING_LOOKUP',season:'old',tests:[/大久保 陽翔/,/防御率は3\.63です/]},
 {id:'P08',q:'陽翔の2025-2026投球回教えて',route:'PITCHING_LOOKUP',season:'old',tests:[/大久保 陽翔/,/投球回は56(?:\.0)?です/]}
];
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function evaluate(c,d){const routeOk=d.route===c.route;const answer=String(d.answer||'');const textOk=c.tests.every(re=>re.test(answer));const seasonOk=d.season===c.season;return {ok:routeOk&&textOk&&seasonOk,routeOk,textOk,seasonOk}}
$('run').onclick=async()=>{$('run').disabled=true;$('done').textContent='0';$('pass').textContent='0';$('fail').textContent='0';$('list').innerHTML='';$('meta').textContent='実行中…';let p=0,f=0,api=0;for(let i=0;i<cases.length;i++){const c=cases[i];let d=null,err=null;try{const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'LIVE_QUESTION_ANSWER',question:c.q,context:[]})});d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`)}catch(e){err=e;api++}let ev={ok:false};if(d)ev=evaluate(c,d);ev.ok?p++:f++;const row=document.createElement('div');row.className='row '+(ev.ok?'pass':'fail');row.innerHTML=`<div class="q">${esc(c.id)} ${esc(c.q)} — <span class="${ev.ok?'ok':'bad'}">${ev.ok?'PASS':'FAIL'}</span></div>${err?`<div class="bad">API ERROR: ${esc(err.message||err)}</div>`:`<div>${esc(d.answer)}</div><div class="mono">route=${esc(d.route)} / router=${esc(d.routerVersion)} / season=${esc(d.season)} / engine=${esc(d.answerEngineVersion)} / refused=${esc(d.refusedToInvent)} / limitation=${esc(d.limitation||'')}<br>source=${esc(d.source?.name||'')}<br>evidence=${esc((d.evidence||[]).join(' | '))}</div>`}`;$('list').appendChild(row);$('done').textContent=String(i+1);$('pass').textContent=String(p);$('fail').textContent=String(f)}$('meta').textContent=`8件終了 / API ERROR ${api} / 投手成績は正本XLSMから取得。`;$('run').disabled=false};
</script></body></html>
