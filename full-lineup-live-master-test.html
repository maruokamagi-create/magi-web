<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>MAGI-WEB ベストオーダー本番正本テスト</title>
<style>
:root{color-scheme:dark;--bg:#071427;--card:#10233e;--line:#2c4668;--ok:#79d69b;--bad:#ff8e8e;--muted:#9db0c9;--text:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(920px,100%);margin:auto;padding:18px 14px 40px}h1{font-size:22px;margin:4px 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:14px}.bar{position:sticky;top:0;z-index:5;background:rgba(7,20,39,.96);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}button,a.btn{border:1px solid #49688e;background:#183657;color:white;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none}button:disabled{opacity:.5}.summary,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.summary strong{font-size:18px}.ok{color:var(--ok)}.bad{color:var(--bad)}.pending{color:#ffd479}.row{padding:10px 0;border-top:1px solid rgba(157,176,201,.18)}.row:first-child{border-top:0}.label{font-weight:800;margin-bottom:4px}.small{color:var(--muted);font-size:12px;line-height:1.55}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.order{font-size:14px;line-height:1.8}.hidden{display:none}.auth{border-color:#9b7731;background:#322812}.phase{font-size:12px;color:#bcd0e8;letter-spacing:.04em}.err{white-space:pre-wrap;color:#ffd0d0;font-size:12px}.source{overflow-wrap:anywhere}
</style>
</head>
<body><main class="wrap">
<h1>MAGI-WEB ベストオーダー1〜9 本番正本テスト</h1>
<div class="sub">通常の <b>/api/magi/core</b> から、現チーム正本＋旧チーム正本 → 3賢人一次審議 → クロス審議 → 二次審議 → 最終1〜9番までを通します。合成データは使いません。メイン画面は変更しません。</div>
<div class="bar"><button id="run">本番正本テストを実行</button><a class="btn" href="/">MAGI-WEBへ戻る</a></div>
<div id="auth" class="panel auth hidden"><b>認証が必要です</b><div class="small">このページは正本データを使うため、MAGI-WEBに承認済みLINEアカウントでログインしている同じブラウザで開いてください。ログイン後にこのページへ戻って再実行してください。</div></div>
<div id="summary" class="summary"><strong class="pending">未実行</strong><div class="small">実データのテスト結果が出るまでPASSとは扱いません。</div></div>
<div id="results"></div>
</main>
<script>
const ROSTER=["井坂 悠聖","大久保 陽翔","大野 竜暉","坂田 暉馬","嶋田 栄志","武澤 大翔","橋向 結都","上村 蓮","大久保 夢翔","長侶 穹","中嶋 玲月","吉田 真翔","鰐渕 将太","武田 晴琉翔"];
const OLD_ONLY=["北 淳志","坂本 陸","櫻川 莉大","佐々木 悠成","下田 涼歩","前川 夢斗","増田 晃大","宮嵜 翔","宮村 龍"];
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function add(title,status,detail='',extra=''){
  const cls=status==='PASS'?'ok':status==='FAIL'?'bad':'pending';
  $('#results').insertAdjacentHTML('beforeend',`<section class="panel"><div class="phase">${esc(title)}</div><div class="label ${cls}">${esc(status)}</div>${detail?`<div class="small">${esc(detail)}</div>`:''}${extra}</section>`);
}
function orderText(arr){return (arr||[]).map((n,i)=>`${i+1}番 ${n}`).join(' / ')}
function sameSet14(arr){return Array.isArray(arr)&&arr.length===14&&new Set(arr).size===14&&ROSTER.every(n=>arr.includes(n))}
function validLineup(arr){return Array.isArray(arr)&&arr.length===9&&new Set(arr).size===9&&arr.every(n=>ROSTER.includes(n))&&!arr.some(n=>OLD_ONLY.includes(n))}
function sameOrder(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&a.every((v,i)=>v===b[i])}
async function post(url,body){
  let response;
  try{response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify(body)})}
  catch(e){throw new Error(`通信失敗: ${e.message||e}`)}
  let data={};try{data=await response.json()}catch{}
  if(response.status===401||response.status===403){const e=new Error(data?.error||'認証が必要です');e.auth=true;e.status=response.status;throw e}
  if(!response.ok)throw new Error(`${url} HTTP ${response.status}: ${data?.error||'request failed'}`);
  return data;
}
async function persona(name,phase,caseData,primarySelf=null,cross=null){
  const body={persona:name,phase,case:caseData};
  if(phase==='SECOND'){body.primarySelf=primarySelf;body.crossExamination=cross}
  return post('/api/magi/persona',body);
}
async function run(){
  $('#run').disabled=true;$('#auth').classList.add('hidden');$('#results').innerHTML='';
  $('#summary').innerHTML='<strong class="pending">実行中…</strong><div class="small">本番正本と3賢人を順番に確認しています。</div>';
  try{
    const question='ベストオーダーを1番から9番まで組んで';
    const core=await post('/api/magi/core',{question,context:[]});
    const packet=core?.evidencePacket;
    const coreOk=core?.action==='DELIBERATE'&&core?.route==='DELIBERATION'&&core?.evidenceResolution?.source==='CURRENT_MASTER_LIVE_SELECTION'&&packet?.selectionKind==='FULL_LINEUP';
    if(!coreOk)throw new Error(`COREがFULL_LINEUP正本審議へ到達していません。 action=${core?.action||'-'} source=${core?.evidenceResolution?.source||'-'} kind=${packet?.selectionKind||'-'}`);
    add('1. 通常チャット経路 → 正本Evidence','PASS',`${core.coreVersion||''} / ${packet.resolverVersion||''}`);

    const currentOk=packet?.count===14&&packet?.allCurrentTeamCheck?.status==='COMPLETE'&&sameSet14((packet?.allCurrentTeamCheck?.players||[]).map(x=>x?.name));
    if(!currentOk)throw new Error('現チーム正本の14名完全一致チェックに失敗しました。');
    const currentSource=(packet.sources||[]).find(s=>s?.season==='current'||s?.priority==='PRIMARY');
    if(!currentSource)throw new Error('現チーム正本のsource情報がありません。');
    add('2. 現チーム正本・14名完全一致','PASS',packet.scope||'2026-2027現チーム',`<div class="row source small">PRIMARY: ${esc(currentSource.name||'—')}<br>${esc(currentSource.path||'')}<br>modified: ${esc(currentSource.modifiedTime||'—')}</div>`);

    const old=packet?.historicalReference;
    const oldSource=(packet.sources||[]).find(s=>s?.season==='old'||s?.priority==='REFERENCE');
    if(old?.status!=='COMPLETE'||!oldSource)throw new Error('旧チーム正本を参考Evidenceとして取得できていません。今回は現＋旧の実測PASSにはしません。');
    add('3. 旧チーム正本・参考Evidence','PASS',`${old.scope||'2025-2026旧チーム'} / candidateEligible=${String(old.candidateEligible)}`,`<div class="row source small">REFERENCE: ${esc(oldSource.name||'—')}<br>${esc(oldSource.path||'')}<br>modified: ${esc(oldSource.modifiedTime||'—')}</div>`);

    const caseData={mode:'selection',selectionKind:'FULL_LINEUP',question,evidence:packet};
    const primary={};
    for(const p of ['melchior','balthasar','casper']){
      await sleep(350);
      const r=await persona(p,'PRIMARY',caseData);
      if(r?.reviewRequested||r?.dataConflict||!sameSet14(r?.checkedPlayers)||!validLineup(r?.candidatePlayers))throw new Error(`${p} 一次案が安全条件を満たしません。 ${r?.reviewReason||''}`);
      primary[p]=r;
      add(`4. ${p.toUpperCase()} 一次打順`,'PASS','現14名全員確認・現9名・重複なし',`<div class="order">${esc(orderText(r.candidatePlayers))}</div>`);
    }

    await sleep(350);
    const cross=await post('/api/magi/orchestrate',{phase:'CROSS_EXAMINATION',case:caseData,primary});
    const challenges=cross?.challenges||{};
    if(cross?.reviewRequired===true||!['melchior','balthasar','casper'].every(p=>Array.isArray(challenges[p])&&challenges[p].length))throw new Error(`クロス審議が成立していません。 ${cross?.reviewReason||''}`);
    add('5. 3賢人クロス審議','PASS','3者それぞれへの具体的な反論・再検討要求あり',`<div class="mono row">MELCHIOR: ${esc(challenges.melchior.join(' / '))}\nBALTHASAR: ${esc(challenges.balthasar.join(' / '))}\nCASPER: ${esc(challenges.casper.join(' / '))}</div>`);

    const second={};
    for(const p of ['melchior','balthasar','casper']){
      await sleep(350);
      const r=await persona(p,'SECOND',caseData,primary[p],cross);
      if(r?.reviewRequested||r?.dataConflict||!sameSet14(r?.checkedPlayers)||!validLineup(r?.candidatePlayers))throw new Error(`${p} 二次案が安全条件を満たしません。 ${r?.reviewReason||''}`);
      second[p]=r;
      add(`6. ${p.toUpperCase()} 二次打順`,'PASS',r.changedFromPrimary?'一次案から変更':'一次案を維持',`<div class="order">${esc(orderText(r.candidatePlayers))}</div>`);
    }

    await sleep(250);
    const final=await post('/api/magi/orchestrate',{phase:'FINAL',case:caseData,primary,second,crossExamination:cross});
    const finalOrder=(final?.lineup||[]).sort((a,b)=>(a.slot||0)-(b.slot||0)).map(x=>x.name);
    const matches=Object.entries(second).filter(([,r])=>sameOrder(finalOrder,r.candidatePlayers)).map(([p])=>p);
    if(final?.mode!=='FULL_LINEUP'||final?.status!=='LINEUP_RESULT'||!validLineup(finalOrder)||matches.length<1)throw new Error('最終打順が「二次審議で実際に出た3案のどれか」という条件を満たしていません。');
    add('7. MAGI 最終1〜9番','PASS',`採用元: ${matches.map(x=>x.toUpperCase()).join(' / ')}`,`<div class="order"><b>${esc(orderText(finalOrder))}</b></div><div class="small row">合成の第4案ではなく、実際の二次案から採用。</div>`);

    $('#summary').innerHTML='<strong class="ok">本番正本テスト PASS</strong><div class="small">現チーム正本＋旧チーム正本 → 14名全確認 → 3賢人一次 → クロス → 二次 → 最終1〜9番まで、実データで完走しました。</div>';
  }catch(e){
    if(e.auth)$('#auth').classList.remove('hidden');
    $('#summary').innerHTML=`<strong class="bad">本番正本テスト FAIL / 未完了</strong><div class="err">${esc(e.message||e)}</div><div class="small">途中で止まったため、本番PASSとは記録しません。</div>`;
  }finally{$('#run').disabled=false}
}
$('#run').addEventListener('click',run);
</script>
</body></html>
