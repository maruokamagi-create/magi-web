<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Live Batting 12 Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 36px}h1{font-size:29px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:13px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.q{font-size:18px;font-weight:800;margin-bottom:7px}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;overflow-wrap:anywhere}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>MAGI Live Batting 12 Test</h1><div class="sub">8/8の基本試験の次段階です。現チーム14人のうち対象を広げ、正本XLSMの<strong>打撃一覧</strong>から選手と指標をその場で特定して答えられるか確認します。数値取得・回答整形ではGeminiを使いません。</div><section class="card"><b>12ケース</b><div class="muted">OPSだけでなく、打率・安打・四球・三振・打点・盗塁・二塁打・チーム出塁率まで確認します。Geminiの短時間制限を避けるため6件ずつ実行します。</div><div class="actions"><button id="next">次の6件</button><button id="reset">リセット</button></div><div class="muted" id="progress" style="margin-top:10px">0/12</div></section><section class="card"><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b class="ok" id="pass">0</b></div><div class="stat"><span>FAIL</span><b class="bad" id="fail">0</b></div></div><div class="muted" id="meta" style="margin-top:10px">未実行</div></section><section class="card" id="list"></section></div><script>
const cases=[
{id:'B01',q:'嶋田栄志の今期OPS教えて',route:'BATTING_LOOKUP',value:'.940'},
{id:'B02',q:'坂田暉馬の今期OPS教えて',route:'BATTING_LOOKUP',value:'1.115'},
{id:'B03',q:'井坂悠聖の今期打率教えて',route:'BATTING_LOOKUP',value:'.182'},
{id:'B04',q:'武澤大翔の今期安打数は？',route:'BATTING_LOOKUP',value:'1'},
{id:'B05',q:'大久保夢翔の今期四球は？',route:'BATTING_LOOKUP',value:'2'},
{id:'B06',q:'吉田真翔の今期三振数教えて',route:'BATTING_LOOKUP',value:'6'},
{id:'B07',q:'武田晴琉翔の今期打点は？',route:'BATTING_LOOKUP',value:'1'},
{id:'B08',q:'上村蓮の今期打率は？',route:'BATTING_LOOKUP',value:'.091'},
{id:'B09',q:'中嶋玲月の今期安打数教えて',route:'BATTING_LOOKUP',value:'10'},
{id:'B10',q:'大野竜暉の今期盗塁は？',route:'BATTING_LOOKUP',value:'3'},
{id:'B11',q:'大久保陽翔の今期二塁打は？',route:'BATTING_LOOKUP',value:'1'},
{id:'B12',q:'今期のチーム出塁率教えて',route:'TEAM_LOOKUP',value:'.390'}
];
const $=id=>document.getElementById(id);let index=0,p=0,f=0,api=0;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setStats(){$('done').textContent=index;$('pass').textContent=p;$('fail').textContent=f;$('progress').textContent=index>=cases.length?'12/12 完了':`${index}/12`}
async function runBatch(){if(index>=cases.length)return;$('next').disabled=true;$('meta').textContent='実行中…';const end=Math.min(index+6,cases.length);for(;index<end;index++){const c=cases[index];let d=null,err=null;try{const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'LIVE_QUESTION_ANSWER',question:c.q,context:[]})});d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`)}catch(e){err=e;api++}const ok=!!d&&d.route===c.route&&String(d.answer||'').includes(c.value)&&d.season==='current'&&!d.refusedToInvent;ok?p++:f++;const row=document.createElement('div');row.className='row '+(ok?'pass':'fail');row.innerHTML=`<div class="q">${esc(c.id)} ${esc(c.q)} — <span class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</span></div>${err?`<div class="bad">API ERROR: ${esc(err.message||err)}</div>`:`<div>${esc(d.answer)}</div><div class="mono">期待値=${esc(c.value)} / route=${esc(d.route)} / season=${esc(d.season)} / engine=${esc(d.answerEngineVersion)} / parser=${esc(d.source?.parser||'')} / refused=${esc(d.refusedToInvent)}</div>`}`;$('list').appendChild(row);setStats()}$('meta').textContent=`ここまで${index}件 / API ERROR ${api}`;$('next').disabled=index>=cases.length;$('next').textContent=index>=cases.length?'完了':'次の6件'}
$('next').onclick=runBatch;$('reset').onclick=()=>{index=0;p=0;f=0;api=0;$('list').innerHTML='';$('next').disabled=false;$('next').textContent='次の6件';$('meta').textContent='未実行';setStats()};setStats();
</script></body></html>
