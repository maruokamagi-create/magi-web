<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI PDF Modifier Smoke Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}h1{margin:0 0 6px}.sub,.meta{color:#9db4c7}.actions{margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#edf6ff;color:#07111f}.ok{color:#8ce0b4}.bad{color:#ff9898}.row{background:#071827;border:1px solid #274965;border-radius:12px;padding:10px;margin:8px 0}.row.fail{border-color:#8b4040}.q{font-weight:800;margin:6px 0}.route{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7}</style></head><body><div class="wrap"><h1>MAGI PDF Modifier Smoke Test</h1><div class="sub">PDFを「出力形式」として扱えるか、既存PDF検索と混同しないかを確認します。</div><section class="card"><div class="actions"><button id="run">7ケース開始</button></div><div id="summary" class="meta">未実行</div></section><section class="card" id="list"></section></div><script>
const CASES=[
 {id:'P01',q:'大野 竜暉の打撃成績をPDFで',route:'BATTING_LOOKUP',format:'PDF'},
 {id:'P02',q:'中嶋 玲月の打撃成績をPDFで',route:'BATTING_LOOKUP',format:'PDF'},
 {id:'P03',q:'宮村 龍の打撃成績をPDFで',route:'BATTING_LOOKUP',format:'PDF'},
 {id:'P04',q:'大久保 陽翔の投手成績をPDFで',route:'PITCHING_LOOKUP',format:'PDF'},
 {id:'P05',q:'大野 竜暉をクローザー固定すべきかPDFでまとめて',route:'DELIBERATION',format:'PDF'},
 {id:'P06',q:'8月号のTEAM REPORTのPDFを見せて',route:'DOCUMENT_SEARCH',format:'PDF'},
 {id:'P07',q:'前に作った陽翔のレポートPDFを探して',route:'DOCUMENT_SEARCH',format:'PDF'}
];
const $=x=>document.getElementById(x);const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(q){const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ROUTE_QUESTION',question:q,context:[]})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
$('run').onclick=async()=>{$('run').disabled=true;$('list').innerHTML='';let pass=0,fail=0,api=0;for(const c of CASES){let d=null,err='';try{d=await call(c.q)}catch(e){err=String(e.message||e);api++}const errs=[];if(d){if(d.route!==c.route)errs.push(`route ${c.route} != ${d.route}`);if(d.outputFormat!==c.format)errs.push(`outputFormat ${c.format} != ${d.outputFormat}`)}const ok=d&&!errs.length;if(ok)pass++;else if(d)fail++;const row=document.createElement('div');row.className='row '+(ok?'':'fail');row.innerHTML=`<b>${c.id} — ${ok?'PASS':err?'API ERROR':'FAIL'}</b><div class="q">${c.q}</div>`+(d?`<div class="route">期待: ${c.route} / ${c.format}<br>実際: ${d.route} / ${d.outputFormat} / router=${d.routerVersion||'—'} / reason=${d.outputFormatReason||'—'}</div>`:`<div class="bad">${err}</div>`)+(errs.length?`<div class="bad">${errs.join('<br>')}</div>`:'');$('list').appendChild(row);await sleep(3800)}$('summary').innerHTML=`<b class="${fail||api?'bad':'ok'}">${pass}/${CASES.length} PASS</b> / FAIL ${fail} / API ERROR ${api}`;$('run').disabled=false};
</script></body></html>
