<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MAGI Question Router Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}h1{font-size:24px;margin:0 0 6px}.sub{color:#93aec6;font-size:13px;margin-bottom:18px}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:16px;margin-bottom:14px}.badge{display:inline-block;border:1px solid #3e6d90;border-radius:999px;padding:5px 10px;font-size:12px;color:#bfeeff;margin-bottom:10px}textarea{width:100%;min-height:120px;resize:vertical;background:#04131f;color:#fff;border:1px solid #315574;border-radius:14px;padding:14px;font-size:17px;line-height:1.6}button{appearance:none;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800;background:#eaf4ff;color:#07111f;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#14334f;color:#eef7ff;border:1px solid #315574}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.presets button{font-size:12px;padding:8px 10px}.state{font-size:13px;color:#9fbbd4;margin-top:10px}.route{font-size:28px;font-weight:900;letter-spacing:.02em;margin:4px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kv{background:#071827;border:1px solid #254866;border-radius:12px;padding:11px}.kv span{display:block;color:#87a5bf;font-size:11px;margin-bottom:4px}.kv b{font-size:14px;word-break:break-word}.clarify{margin-top:12px;padding:14px;border-radius:14px;background:#15233a;border:1px solid #6a5f91}.clarify b{display:block;margin-bottom:7px;color:#e9dcff}.clarify span{font-size:16px;line-height:1.55}.raw{white-space:pre-wrap;word-break:break-word;background:#020b13;border-radius:12px;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a9c5db;max-height:320px;overflow:auto}.chat{display:flex;flex-direction:column;gap:9px}.bubble{max-width:88%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#173c5b;border:1px solid #356586}.bubble.assistant{align-self:flex-start;background:#141d33;border:1px solid #5f587d}.bubble small{display:block;font-size:10px;color:#8fa8bd;margin-bottom:4px}.empty{color:#7893aa;font-size:13px}.notice{padding:11px 12px;border-radius:12px;background:#071827;border:1px solid #254866;color:#a9c5db;font-size:12px;line-height:1.55}@media(max-width:520px){.grid{grid-template-columns:1fr}.route{font-size:22px}.bubble{max-width:94%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>MAGI Question Router Lab</h1>
  <div class="sub">Gemini質問理解ルーター単体テスト。MAGI本体の実行処理には接続していません。</div>

  <section class="card">
    <div class="badge">ROUTER ONLY / MULTI-TURN</div>
    <div class="notice">曖昧ならMAGIが聞き返します。その回答を前の質問とつないで再判定します。意図が確定するまで複数回の聞き返しも可能です。</div>
    <textarea id="q">宮嵜 翔の成績を教えて</textarea>
    <div class="actions"><button id="run">Geminiで判定</button><button class="secondary" id="reset">会話をリセット</button></div>
    <div class="presets" id="presets"></div>
    <div class="state" id="state">質問の意味だけを判定します。成績表示や3賢人審議は実行しません。</div>
  </section>

  <section class="card">
    <div class="badge">会話</div>
    <div class="chat" id="chat"><div class="empty" id="emptyChat">まだ会話はありません。</div></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="badge">RESULT</div>
    <div class="route" id="route"></div>
    <div class="grid">
      <div class="kv"><span>理解した依頼</span><b id="understood"></b></div>
      <div class="kv"><span>確信度</span><b id="confidence"></b></div>
      <div class="kv"><span>選手</span><b id="players"></b></div>
      <div class="kv"><span>領域</span><b id="domains"></b></div>
      <div class="kv"><span>期間</span><b id="timeScope"></b></div>
      <div class="kv"><span>3賢人</span><b id="deliberation"></b></div>
    </div>
    <div class="clarify" id="clarifyBox" hidden><b>MAGIから確認</b><span id="clarification"></span></div>
  </section>

  <section class="card"><div class="badge">RAW JSON</div><div class="raw" id="raw">—</div></section>
</div>
<script>
const PRESETS=[
 '宮嵜 翔の成績を教えて',
 '陽翔どう？',
 '昨日のあれどうだった？',
 '投手は？',
 '宮嵜 翔の通算投手成績を教えて',
 '大野と陽翔ならどっちを4番にする？',
 '大野と陽翔の通算打撃成績を比べて',
 '8月号のTEAM REPORTを見せて',
 'asdfgh'
];
const $=id=>document.getElementById(id),q=$('q'),state=$('state'),raw=$('raw'),result=$('result'),run=$('run'),chat=$('chat');
let history=[];
let awaitingClarification=false;
let round=0;

function addBubble(role,text){
 const empty=$('emptyChat');if(empty)empty.remove();
 const d=document.createElement('div');d.className=`bubble ${role}`;
 const small=document.createElement('small');small.textContent=role==='user'?'あなた':'MAGI';
 const body=document.createElement('div');body.textContent=text;
 d.append(small,body);chat.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function setPreset(text){resetConversation(false);q.value=text;q.focus()}
for(const text of PRESETS){const b=document.createElement('button');b.className='secondary';b.textContent=text;b.onclick=()=>setPreset(text);$('presets').appendChild(b)}

function resetConversation(clearInput=true){
 history=[];awaitingClarification=false;round=0;chat.innerHTML='<div class="empty" id="emptyChat">まだ会話はありません。</div>';result.hidden=true;raw.textContent='—';
 if(clearInput)q.value='';q.placeholder='質問を入力してください';run.textContent='Geminiで判定';state.textContent='会話をリセットしました。';
}
$('reset').onclick=()=>resetConversation(true);

function paintResult(data){
 result.hidden=false;$('route').textContent=data.route||'—';$('understood').textContent=data.understoodRequest||'—';$('confidence').textContent=data.confidence||'—';$('players').textContent=(data.players||[]).join('・')||'—';$('domains').textContent=(data.domains||[]).join(' / ')||'—';$('timeScope').textContent=data.timeScope||'—';$('deliberation').textContent=data.needsDeliberation?'必要':'不要';
 const show=!!data.needsClarification;$('clarifyBox').hidden=!show;$('clarification').textContent=data.clarificationQuestion||'';
}

async function judge(){
 const text=q.value.trim();if(!text){state.textContent=awaitingClarification?'MAGIへの回答を入力してください。':'質問を入力してください。';return}
 const priorContext=history.slice(-12);
 addBubble('user',text);history.push({role:'user',text});q.value='';round++;
 run.disabled=true;run.textContent='判定中…';state.textContent=`Geminiが会話全体から意味を確認しています…（${round}回目）`;
 try{
  const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ROUTE_QUESTION',question:text,context:priorContext})});
  const data=await r.json();raw.textContent=JSON.stringify({sentContext:priorContext,response:data},null,2);
  if(!r.ok||!data.ok)throw new Error(data.error||`HTTP ${r.status}`);
  paintResult(data);
  if(data.needsClarification){
   const ask=data.clarificationQuestion||'もう少し具体的に教えてください。';
   addBubble('assistant',ask);history.push({role:'assistant',text:ask});awaitingClarification=true;
   q.placeholder='MAGIへの回答を入力してください';run.textContent='回答して再判定';state.textContent=`聞き返し中：まだ実行ルートは確定していません。（${round}回目）`;
  }else{
   awaitingClarification=false;q.placeholder='この会話を続ける質問、または「会話をリセット」で新規テスト';run.textContent='続けて判定';state.textContent=`意図確定：${data.route}。本体処理はまだ実行していません。`;
  }
 }catch(e){result.hidden=true;state.textContent=`エラー: ${e.message||e}`;run.textContent=awaitingClarification?'回答して再判定':'Geminiで判定'}
 finally{run.disabled=false}
}
run.onclick=judge;
q.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')judge()});
</script>
</body>
</html>
