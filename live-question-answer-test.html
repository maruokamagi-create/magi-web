<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Live Question Answer Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 36px}h1{font-size:30px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}.actions{margin-top:12px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:13px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.q{font-size:18px;font-weight:800;margin-bottom:8px}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55;overflow-wrap:anywhere}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>MAGI Live Question → Answer Test</h1><div class="sub">普通の日本語質問を、①質問理解 → ②シーズン/対象判定 → ③Google Driveの正本XLSM取得 → ④数値取得・計算 → ⑤回答、まで通して確認します。数値取得と回答整形ではGeminiを使いません。</div><section class="card"><b>今回の8ケース</b><div class="muted">今期の個人成績3件、今期チーム成績・計算OPS、旧チームOPS、未接続の「通算」を捏造せず止めるケース、曖昧資料依頼の聞き返しです。</div><div class="actions"><button id="run">8ケース開始</button></div></section><section class="card"><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b class="ok" id="pass">0</b></div><div class="stat"><span>FAIL</span><b class="bad" id="fail">0</b></div></div><div class="muted" id="meta" style="margin-top:10px">未実行</div></section><section class="card" id="list"></section></div><script>
const cases=[
 {id:'E01',q:'陽翔の今期OPS教えて',route:'BATTING_LOOKUP',includes:['大久保 陽翔','OPS','.912'],season:'current'},
 {id:'E02',q:'大野竜暉の今期OPS教えて',route:'BATTING_LOOKUP',includes:['大野 竜暉','OPS','.924'],season:'current'},
 {id:'E03',q:'中嶋玲月の今期OPS教えて',route:'BATTING_LOOKUP',includes:['中嶋 玲月','OPS','1.376'],season:'current'},
 {id:'E04',q:'今期のチーム成績教えて',route:'TEAM_LOOKUP',includes:['3勝2敗1分'],season:'current'},
 {id:'E05',q:'今期のチームOPS教えて',route:'TEAM_LOOKUP',includes:['OPS','.738'],season:'current'},
 {id:'E06',q:'2025-2026のチームOPS教えて',route:'TEAM_LOOKUP',includes:['OPS','.672'],season:'old'},
 {id:'E07',q:'陽翔の通算OPS教えて',route:'BATTING_LOOKUP',includes:['通算成績','数値は出しません'],season:'career',refused:true,limitation:'CAREER_AGGREGATION_NOT_CONNECTED'},
 {id:'E08',q:'レポート見せて',route:'CLARIFY',includes:['どのレポートや資料'],season:null}
];
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function evaluate(c,d){const routeOk=d.route===c.route;const answer=String(d.answer||'');const textOk=c.includes.every(x=>answer.includes(x));const seasonOk=c.season===null?true:d.season===c.season;const refusedOk=c.refused===undefined?true:d.refusedToInvent===c.refused;const limitationOk=!c.limitation||d.limitation===c.limitation;return {ok:routeOk&&textOk&&seasonOk&&refusedOk&&limitationOk,routeOk,textOk,seasonOk,refusedOk,limitationOk}}
$('run').onclick=async()=>{$('run').disabled=true;$('done').textContent='0';$('pass').textContent='0';$('fail').textContent='0';$('list').innerHTML='';$('meta').textContent='実行中…';let p=0,f=0,api=0;for(let i=0;i<cases.length;i++){const c=cases[i];let d=null,err=null;try{const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'LIVE_QUESTION_ANSWER',question:c.q,context:[]})});d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`)}catch(e){err=e;api++}let ev={ok:false};if(d)ev=evaluate(c,d);ev.ok?p++:f++;const row=document.createElement('div');row.className='row '+(ev.ok?'pass':'fail');row.innerHTML=`<div class="q">${esc(c.id)} ${esc(c.q)} — <span class="${ev.ok?'ok':'bad'}">${ev.ok?'PASS':'FAIL'}</span></div>${err?`<div class="bad">API ERROR: ${esc(err.message||err)}</div>`:`<div>${esc(d.answer)}</div><div class="mono">route=${esc(d.route)} / router=${esc(d.routerVersion)} / season=${esc(d.season)} / engine=${esc(d.answerEngineVersion)} / refused=${esc(d.refusedToInvent)} / limitation=${esc(d.limitation||'')}<br>source=${esc(d.source?.name||'')}<br>evidence=${esc((d.evidence||[]).join(' | '))}</div>`}`;$('list').appendChild(row);$('done').textContent=String(i+1);$('pass').textContent=String(p);$('fail').textContent=String(f)}$('meta').textContent=`8件終了 / API ERROR ${api} / ルーターは質問理解にGeminiを使用。数値取得・回答はXLSM直読。`;$('run').disabled=false};
</script></body></html>
