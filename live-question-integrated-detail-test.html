<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Integrated Detail Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom))}.card,.row{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:15px;margin:12px 0}h1{margin:0 0 7px;font-size:27px}.sub,.meta{color:#9db4c7;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:850;background:#edf6ff;color:#07111f}.row.pass{border-color:#2c6a4b}.row.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.top{display:flex;gap:8px;align-items:center}.id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8da8bf}.verdict{margin-left:auto;font-weight:900}.q{font-weight:800;margin:9px 0}.ans{line-height:1.65}.detail{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;margin-top:8px;word-break:break-word}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><h1>MAGI LIVE統合 詳細回答テスト</h1><div class="sub">本番用の LIVE_QUESTION_ANSWER 経路に、FULL OPEN済み旧チーム詳細回答が正しく接続されたかを確認します。</div>
<section class="card"><div class="actions"><button id="run">10問テスト開始</button></div><div id="state" class="meta">未実行</div><div class="stats"><div class="stat"><span>実行</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b id="pass" class="ok">0</b></div><div class="stat"><span>FAIL</span><b id="fail" class="bad">0</b></div><div class="stat"><span>API ERROR</span><b id="api">0</b></div></div></section><section id="list"></section></main><script>
const CASES=[
{id:'I01',q:'前チームの宮村 龍の盗塁数は？',detail:true,keys:['SB'],player:'宮村 龍'},
{id:'I02',q:'前チームの宮嵜 翔の四球と死球を教えて',detail:true,keys:['BB','HBP'],player:'宮嵜 翔'},
{id:'I03',q:'前チームの大野 竜暉の犠打と犠飛は？',detail:true,keys:['SAC','SF'],player:'大野 竜暉'},
{id:'I04',q:'前チームの鰐渕 将太の守備機会と失策は？',detail:true,keys:['CHANCES','ERRORS'],player:'鰐渕 将太'},
{id:'I05',q:'前チームの大野 竜暉の守備率は？',detail:true,keys:['FIELDING_PCT'],player:'大野 竜暉'},
{id:'I06',q:'前チームの宮村 龍の盗塁阻止数と盗塁阻止率は？',detail:true,keys:['CS','CS_PCT'],player:'宮村 龍'},
{id:'I07',q:'前チーム全体の盗塁数は？',detail:true,keys:['SB'],team:true},
{id:'I08',q:'前チーム全体の失策数は？',detail:true,keys:['ERRORS'],team:true},
{id:'I09',q:'陽翔の今期OPS教えて',detail:false,contains:'.912'},
{id:'I10',q:'前チームの大久保 陽翔の防御率は？',detail:false,contains:'3.63'}
];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function check(c,d){const e=[];if(!d?.ok)e.push('ok=false');if(c.detail){if(d?.integratedRoute!=='VERIFIED_OLD_DETAIL')e.push(`integratedRoute=${d?.integratedRoute}`);if(d?.verification?.overallState!=='FULL')e.push(`gate=${d?.verification?.overallState}`);if(c.player&&d?.target?.player!==c.player)e.push(`player ${c.player} != ${d?.target?.player}`);if(c.team&&d?.target?.type!=='TEAM')e.push('team target missing');for(const k of c.keys){if(!Object.prototype.hasOwnProperty.call(d?.metricValues||{},k))e.push(`metric missing ${k}`);const shown=d?.displayValues?.[k];if(shown===undefined||shown===null)e.push(`display missing ${k}`);else if(!String(d.answer||'').includes(String(shown)))e.push(`answer missing ${k}=${shown}`)}}else{if(d?.integratedRoute==='VERIFIED_OLD_DETAIL')e.push('ordinary answer hijacked by detail route');if(c.contains&&!String(d?.answer||'').includes(c.contains))e.push(`answer missing ${c.contains}`)}return e}
async function call(c){const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'LIVE_QUESTION_ANSWER',question:c.q})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function addRow(c,d,errs,apiError){const row=document.createElement('article');row.className='row '+(!apiError&&!errs.length?'pass':'fail');row.innerHTML=`<div class="top"><span class="id">${c.id}</span><span class="verdict ${!apiError&&!errs.length?'ok':'bad'}">${apiError?'API ERROR':errs.length?'FAIL':'PASS'}</span></div><div class="q">${esc(c.q)}</div>`+(apiError?`<div class="bad">${esc(apiError)}</div>`:`<div class="ans">${esc(d.answer)}</div><div class="detail">integratedRoute=${esc(d.integratedRoute||'-')} / engine=${esc(d.engineVersion||d.answerEngineVersion||'-')} / values=${esc(JSON.stringify(d.metricValues||{}))}</div>`)+(errs.length?`<div class="bad detail">${errs.map(esc).join('<br>')}</div>`:'');$('list').appendChild(row)}
$('run').onclick=async()=>{$('run').disabled=true;$('list').innerHTML='';let p=0,f=0,a=0;for(let i=0;i<CASES.length;i++){const c=CASES[i];$('state').textContent=`${i+1}/${CASES.length} ${c.id} 実行中`;try{const d=await call(c),errs=check(c,d);errs.length?f++:p++;addRow(c,d,errs,'')}catch(e){a++;addRow(c,null,[],String(e.message||e))}$('done').textContent=i+1;$('pass').textContent=p;$('fail').textContent=f;$('api').textContent=a;await sleep(650)}$('state').textContent=`終了：PASS ${p} / FAIL ${f} / API ERROR ${a}`;$('run').disabled=false};
</script></body></html>
