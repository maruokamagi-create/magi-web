<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Conversation Router Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}h1{margin:0 0 6px}.sub,.meta{color:#9db4c7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#edf6ff;color:#07111f}button.secondary{background:#14334f;color:#eef7ff;border:1px solid #315574}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.ok{color:#8ce0b4}.bad{color:#ff9898}.row{background:#071827;border:1px solid #274965;border-radius:12px;padding:10px;margin:8px 0}.row.fail{border-color:#8b4040}.turn{margin:8px 0;padding:8px;border-radius:10px;background:#091522}.u{color:#d9edff}.a{color:#cbbcff}.route{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7}.progress{height:10px;background:#06101b;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#dbefff}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>MAGI Conversation Router Test</h1><div class="sub">複数ターン会話で、聞き返し・訂正・話題変更・文脈保持を検証します。MAGI本体処理は実行しません。</div><section class="card"><div>基準12シナリオを残したまま、長めの会話・再訂正・話題復帰・指示語などを追加した30シナリオ版です。実際のMAGIの聞き返し文を次ターンの会話履歴に入れて再判定します。</div><div class="actions"><button id="run">全30シナリオ開始</button><button id="reset" class="secondary">結果リセット</button></div><div class="progress"><div class="bar" id="bar"></div></div><div id="state" class="meta">未実行</div></section><section class="card"><div class="stats"><div class="stat"><span>シナリオ</span><b id="total">0</b></div><div class="stat"><span>PASS</span><b id="pass" class="ok">0</b></div><div class="stat"><span>FAIL</span><b id="fail" class="bad">0</b></div><div class="stat"><span>API ERROR</span><b id="api">0</b></div></div></section><section class="card" id="list"></section></div><script>
const SCENARIOS=[
{id:'M01',name:'領域確認',turns:[{u:'陽翔の成績見せて',route:'CLARIFY'},{u:'投手',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M02',name:'比較軸確認',turns:[{u:'大野と陽翔を比べて',route:'CLARIFY'},{u:'打撃',route:'PLAYER_COMPARISON',players:['大野 竜暉','大久保 陽翔'],domain:'BATTING'}]},
{id:'M03',name:'途中訂正',turns:[{u:'宮嵜 翔の打撃成績',route:'BATTING_LOOKUP'},{u:'いや宮村 龍だった',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING'},{u:'打撃で',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING'}]},
{id:'M04',name:'話題変更',turns:[{u:'宮嵜 翔の投手成績',route:'PITCHING_LOOKUP'},{u:'やっぱり宮村 龍の打撃成績にして',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING'}]},
{id:'M05',name:'期間補完',turns:[{u:'宮嵜 翔の投手成績',route:'PITCHING_LOOKUP'},{u:'通算で',route:'PITCHING_LOOKUP',player:'宮嵜 翔',domain:'PITCHING',time:'CAREER'}]},
{id:'M06',name:'曖昧継続',turns:[{u:'陽翔どう？',route:'CLARIFY'},{u:'成績',route:'CLARIFY'},{u:'打撃',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING'}]},
{id:'M07',name:'比較から単独へ変更',turns:[{u:'大野と陽翔を比べて',route:'CLARIFY'},{u:'やっぱ陽翔の投手成績だけ',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M08',name:'指示語',turns:[{u:'大野 竜暉の通算投手成績を見たい',route:'PITCHING_LOOKUP'},{u:'それでお願い',route:'PITCHING_LOOKUP',player:'大野 竜暉',domain:'PITCHING',time:'CAREER'}]},

{id:'M10',name:'訂正の連続',turns:[{u:'大野 竜暉の投手成績',route:'PITCHING_LOOKUP'},{u:'いや打撃',route:'BATTING_LOOKUP'},{u:'ごめんやっぱ投手',route:'PITCHING_LOOKUP',player:'大野 竜暉',domain:'PITCHING'}]},

{id:'M13',name:'領域確定後に期間訂正',turns:[{u:'竜暉の成績見たい',route:'CLARIFY'},{u:'投手',route:'PITCHING_LOOKUP',player:'大野 竜暉',domain:'PITCHING'},{u:'今季じゃなくて通算で',route:'PITCHING_LOOKUP',player:'大野 竜暉',domain:'PITCHING',time:'CAREER'}]},
{id:'M14',name:'比較軸を途中変更',turns:[{u:'陽翔と竜暉どっちがいい？',route:'CLARIFY'},{u:'打撃成績で比べて',route:'PLAYER_COMPARISON',players:['大久保 陽翔','大野 竜暉'],domain:'BATTING'},{u:'やっぱ投手成績で',route:'PLAYER_COMPARISON',players:['大久保 陽翔','大野 竜暉'],domain:'PITCHING'}]},
{id:'M15',name:'別話題後に最初へ戻る',turns:[{u:'陽翔の防御率教えて',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'},{u:'宮村 龍の打撃成績にして',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING'},{u:'やっぱ最初の陽翔の方',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M16',name:'比較結果から判断へ',turns:[{u:'大野と陽翔の打撃成績を比べて',route:'PLAYER_COMPARISON',players:['大野 竜暉','大久保 陽翔'],domain:'BATTING'},{u:'その2人なら次の試合どっちを先発投手にするべき？',route:'DELIBERATION',players:['大野 竜暉','大久保 陽翔']}]},
{id:'M17',name:'同姓曖昧を訂正で解消',turns:[{u:'大久保の投手成績見せて',route:'CLARIFY'},{u:'夢翔じゃなくて陽翔',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M18',name:'音表記から正式名確認',turns:[{u:'みやざきしょうの成績',route:'CLARIFY'},{u:'宮嵜 翔のこと',route:'CLARIFY'},{u:'投手成績',route:'PITCHING_LOOKUP',player:'宮嵜 翔',domain:'PITCHING'}]},
{id:'M19',name:'確認後に期間追加',turns:[{u:'陽翔の成績',route:'CLARIFY'},{u:'投手で',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'},{u:'それの通算',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING',time:'CAREER'}]},
{id:'M20',name:'短い期間追加',turns:[{u:'陽翔の投手成績',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'},{u:'最近のだけ',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M21',name:'年度指定から通算へ',turns:[{u:'宮村 龍の打撃成績',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING'},{u:'2025-2026で',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING',time:'SPECIFIC_SEASON'},{u:'いや通算で',route:'BATTING_LOOKUP',player:'宮村 龍',domain:'BATTING',time:'CAREER'}]},
{id:'M22',name:'一般質問を挟んで戻る',turns:[{u:'陽翔の打率教えて',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING'},{u:'OPSって何？',route:'GENERAL_QUESTION'},{u:'じゃあ陽翔のOPS教えて',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING'}]},
{id:'M23',name:'資料検索の指示語継続',turns:[{u:'8月号のTEAM REPORT見せて',route:'DOCUMENT_SEARCH'},{u:'それでお願い',route:'DOCUMENT_SEARCH'}]},
{id:'M24',name:'対象外からMAGI質問へ復帰',turns:[{u:'明日の天気どう？',route:'UNSUPPORTED'},{u:'じゃあ陽翔の防御率教えて',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M25',name:'曖昧語を段階補完',turns:[{u:'あれどうなった？',route:'CLARIFY'},{u:'陽翔のこと',route:'CLARIFY'},{u:'投手成績',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M26',name:'判断依頼から数値だけへ',turns:[{u:'陽翔を4番にすべき？',route:'DELIBERATION',player:'大久保 陽翔'},{u:'判断じゃなくて打率だけ教えて',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING'}]},
{id:'M27',name:'数値照会から判断へ',turns:[{u:'陽翔のOPS教えて',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING'},{u:'それ見て4番にするか判断して',route:'DELIBERATION',player:'大久保 陽翔'}]},
{id:'M28',name:'比較から片方だけへ',turns:[{u:'大野と陽翔の防御率比べて',route:'PLAYER_COMPARISON',players:['大野 竜暉','大久保 陽翔'],domain:'PITCHING'},{u:'やっぱ陽翔だけでいい',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'}]},
{id:'M29',name:'同一選手の期間往復',turns:[{u:'陽翔の通算打撃成績',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING',time:'CAREER'},{u:'今季だけ',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING',time:'CURRENT_SEASON'},{u:'やっぱ通算',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING',time:'CAREER'}]},
{id:'M30',name:'6ターン複合訂正',turns:[{u:'陽翔どう？',route:'CLARIFY'},{u:'成績',route:'CLARIFY'},{u:'投手',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING'},{u:'いや打撃',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING'},{u:'今季',route:'BATTING_LOOKUP',player:'大久保 陽翔',domain:'BATTING',time:'CURRENT_SEASON'},{u:'やっぱ投手の通算',route:'PITCHING_LOOKUP',player:'大久保 陽翔',domain:'PITCHING',time:'CAREER'}]}
];
const $=id=>document.getElementById(id), results=[];$('total').textContent=SCENARIOS.length;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hasAll(a,b){return (b||[]).every(x=>(a||[]).includes(x))}
function check(t,d){const e=[];if(d.route!==t.route)e.push(`route ${t.route} != ${d.route}`);if(t.player&&!d.players?.includes(t.player))e.push(`player missing ${t.player}`);if(t.players&&!hasAll(d.players,t.players))e.push(`players missing ${t.players.filter(x=>!(d.players||[]).includes(x)).join(',')}`);if(t.domain&&!d.domains?.includes(t.domain))e.push(`domain missing ${t.domain}`);if(t.time&&d.timeScope!==t.time)e.push(`time ${t.time} != ${d.timeScope}`);return e}
async function call(q,ctx){for(let i=0;i<3;i++){try{const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ROUTE_QUESTION',question:q,context:ctx})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){if(i===2)throw e;await sleep(1400)}}}
async function runScenario(s){const ctx=[];const out=[];let api=false;for(const t of s.turns){let d;try{d=await call(t.u,ctx)}catch(e){api=true;out.push({u:t.u,error:String(e.message||e)});break}const errs=check(t,d);out.push({u:t.u,d,errs});ctx.push({role:'user',text:t.u});if(d.route==='CLARIFY'&&d.clarificationQuestion)ctx.push({role:'assistant',text:d.clarificationQuestion});else ctx.push({role:'assistant',text:d.understoodRequest||d.route});await sleep(3800)}return {s,out,api,pass:!api&&out.every(x=>!x.errs?.length)}}
function render(){let p=0,f=0,a=0;const list=$('list');list.innerHTML='';for(const r of results){if(r.api)a++;else if(r.pass)p++;else f++;const row=document.createElement('div');row.className='row '+(r.pass?'':'fail');row.innerHTML=`<b>${r.s.id} ${r.s.name} — ${r.api?'API ERROR':r.pass?'PASS':'FAIL'}</b>`;for(const x of r.out){const div=document.createElement('div');div.className='turn';div.innerHTML=`<div class="u">あなた: ${x.u}</div>`+(x.error?`<div class="bad">${x.error}</div>`:`<div class="a">MAGI: ${x.d.clarificationQuestion||x.d.understoodRequest||''}</div><div class="route">${x.d.route} / ${x.d.confidence} / safe=${x.d.safeToExecute}</div>`)+(x.errs?.length?`<div class="bad">${x.errs.join('<br>')}</div>`:'');row.appendChild(div)}list.appendChild(row)}$('pass').textContent=p;$('fail').textContent=f;$('api').textContent=a;$('bar').style.width=`${Math.round(results.length/SCENARIOS.length*100)}%`}
$('run').onclick=async()=>{$('run').disabled=true;results.length=0;render();for(let i=0;i<SCENARIOS.length;i++){$('state').textContent=`${i+1}/${SCENARIOS.length} ${SCENARIOS[i].name}`;results.push(await runScenario(SCENARIOS[i]));render();await sleep(4200)}$('state').textContent='全シナリオ終了';$('run').disabled=false};$('reset').onclick=()=>{results.length=0;render();$('state').textContent='結果をリセットしました'};render();</script></body></html>
