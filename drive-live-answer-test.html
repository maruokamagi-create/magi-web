<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGI Drive Live XLSM Answer Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 32px}.card{background:#0a1c2e;border:1px solid #315574;border-radius:18px;padding:14px;margin:12px 0}h1{font-size:28px;margin:0 0 10px}.sub,.muted{color:#9db4c7;line-height:1.65}.actions{margin-top:12px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#edf6ff;color:#07111f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#071827;border:1px solid #284966;border-radius:12px;padding:10px}.stat span{display:block;color:#8da8bf;font-size:11px}.stat b{font-size:22px}.row{background:#071827;border:1px solid #274965;border-radius:14px;padding:12px;margin:10px 0}.pass{border-color:#2c6a4b}.fail{border-color:#8b4040}.ok{color:#8ce0b4}.bad{color:#ff9898}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db4c7;line-height:1.55}.q{font-weight:800;margin-bottom:6px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>MAGI Drive Live XLSM Answer Test</h1><div class="sub">PDFは使いません。MAGI-WEBのサーバーがGoogle Driveへ実際に接続し、2026-2027現チームの <strong>03_STATS_成績データ / 00_MASTER_正本 にあるXLSM</strong> を取得し、そのセルから成績を読み取れるかを確認します。</div><section class="card"><b>正式ソース</b><div class="muted">2026-2027_CURRENT_現チーム → 03_STATS_成績データ → 00_MASTER_正本 → XLSM<br>今期の正式定義：2026-08-02開始<br>PDFは閲覧資料として数値ソースに使用しません。</div><div class="actions"><button id="run">XLSMライブ8項目確認</button></div></section><section class="card"><div class="stats"><div class="stat"><span>確認</span><b id="done">0</b></div><div class="stat"><span>PASS</span><b class="ok" id="pass">0</b></div><div class="stat"><span>FAIL</span><b class="bad" id="fail">0</b></div></div><div class="muted" id="meta" style="margin-top:10px">未実行</div></section><section class="card" id="list"></section></div><script>
const expected=[
 ['今期開始日','periodStart','2026-08-02'],
 ['試合数','team.games',6],['勝ち','team.wins',3],['引き分け','team.draws',1],['負け','team.losses',2],
 ['チームOPS','team.OPS','.738'],['大久保 陽翔 OPS','players.okuboHaruto.OPS','.912'],['大野 竜暉 OPS','players.onoTatsuki.OPS','.924']
];
const $=id=>document.getElementById(id);function get(o,p){return p.split('.').reduce((a,k)=>a?.[k],o)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('run').onclick=async()=>{ $('run').disabled=true;$('list').innerHTML='<div class="muted">Google Driveから正式XLSM正本を取得してセル解析中です。少し時間がかかります。</div>';$('done').textContent='0';$('pass').textContent='0';$('fail').textContent='0';try{const r=await fetch('/api/magi/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'DRIVE_LIVE_AUDIT'})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);let p=0,f=0;$('list').innerHTML='';for(const [label,path,want] of expected){const got=get(d.extracted,path);const ok=String(got)===String(want);ok?p++:f++;const row=document.createElement('div');row.className='row '+(ok?'pass':'fail');row.innerHTML=`<div class="q">${esc(label)} — <span class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</span></div><div>期待: <b>${esc(want)}</b></div><div>XLSM実取得: <b>${esc(got)}</b></div>`;$('list').appendChild(row)}$('done').textContent=expected.length;$('pass').textContent=p;$('fail').textContent=f;$('meta').innerHTML=`LIVE=true / source=${esc(d.sourceType)}<br>${esc(d.source?.name)}<br><span class="mono">modified=${esc(d.source?.modifiedTime)} / sheets=${esc((d.usedSheets||[]).join(', '))} / model=${esc(d.model)}</span>`;}catch(e){$('meta').innerHTML=`<span class="bad">API ERROR: ${esc(e.message||e)}</span>`;$('list').innerHTML='<div class="bad">XLSMライブ取得に失敗しました。画面をそのまま送ってください。</div>'}finally{$('run').disabled=false}};
</script></body></html>
